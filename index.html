              const eHr = Math.min(23, Math.max(sHr + 1, parseInt(document.getElementById('admEndHr').value, 10) || 21));
              const slotDurationMinutes = parseInt(document.getElementById('admSlotDur').value, 10) || 20;
              const username = document.getElementById('admDocUser').value.trim();
              const password = document.getElementById('admDocPass').value.trim();
              const extraSpecs = selectedAdditionalSpecs.filter((s) => s !== specialty);

              if (!doctorName || !specialty || !username || !password) {
                showToast(bi('يرجى إدخال اسم الدكتور والتخصص واسم المستخدم وكلمة المرور', 'Please fill doctor name, specialty, username, and password'));
                return;
              }

              const duplicateUser = db.doctors.find((d) => d.username === username && (!isEdit || d.id !== editDoc.id));
              if (duplicateUser) {
                showToast(bi('اسم المستخدم أو الهاتف مستخدم بالفعل لدكتور آخر', 'Username/phone already used by another doctor'));
                return;
              }

              if (isEdit) {
                const scheduleChanged =
                  editDoc.workStartMinutes !== sHr * 60 ||
                  editDoc.workEndMinutes !== eHr * 60 ||
                  editDoc.slotDurationMinutes !== slotDurationMinutes;

                editDoc.doctorName = doctorName;
                editDoc.doctorNameEn = doctorNameEn;
                editDoc.specialty = specialty;
                editDoc.additionalSpecialties = extraSpecs;
                editDoc.clinicType = clinicType;
                editDoc.clinicName = clinicName;
                editDoc.clinicNameEn = clinicNameEn;
                editDoc.bio = bio;
                editDoc.locationLabel = locationLabel;
                editDoc.feeEgp = feeEgp;
                editDoc.mapsUrl = mapsUrl;
                editDoc.driveWebAppUrl = driveWebAppUrl;
                editDoc.secondaryDriveWebAppUrl = secondaryDriveWebAppUrl;
                editDoc.workStartMinutes = sHr * 60;
                editDoc.workEndMinutes = eHr * 60;
                editDoc.slotDurationMinutes = slotDurationMinutes;
                editDoc.username = username;
                editDoc.password = password;

                if (scheduleChanged) {
                  db.slots = db.slots.filter((s) => s.doctorId !== editDoc.id).concat(buildDoctorSlots(editDoc));
                }
                saveState(db);
                closeModal();
                showToast(bi('تم تحديث بيانات ' + doctorName + ' في المنصة فوراً', 'Updated ' + doctorName));
                renderApp();
              } else {
                const newDoc = {
                  id: 'doc_' + Date.now(),
                  doctorName: doctorName,
                  doctorNameEn: doctorNameEn,
                  specialty: specialty,
                  additionalSpecialties: extraSpecs,
                  clinicName: clinicName,
                  clinicNameEn: clinicNameEn,
                  clinicType: clinicType,
                  locationLabel: locationLabel,
                  locationLabelEn: locationLabel === 'قرية الحجايزة' ? 'Al-Hajayzah Village' : '',
                  bio: bio,
                  mapsUrl: mapsUrl,
                  driveWebAppUrl: driveWebAppUrl,
                  secondaryDriveWebAppUrl: secondaryDriveWebAppUrl,
                  username: username,
                  password: password,
                  feeEgp: feeEgp,
                  workStartMinutes: sHr * 60,
                  workEndMinutes: eHr * 60,
                  slotDurationMinutes: slotDurationMinutes,
                  currentDelayMinutes: 0,
                  rating: 4.9,
                  chatEnabled: true
                };
                db.doctors.unshift(newDoc);
                db.slots = db.slots.concat(buildDoctorSlots(newDoc));
                saveState(db);
                closeModal();
                showToast(bi('تمت إضافة ' + doctorName + ' ونشر عيادته في المنصة فوراً', 'Added & published ' + doctorName));
                renderApp();
              }
            };
          }
        );
      }

      function openDirectChatModal(target) {
        if (!target || !target.threadType) return;
        const viewerRole = ui.roleMode === 'ADMIN' && ui.isAdminLoggedIn
          ? 'ADMIN'
          : (ui.roleMode === 'DOCTOR' && ui.loggedInDoctorId ? 'DOCTOR' : 'PATIENT');

        function matchesThread(m) {
          if (!m || m.threadType !== target.threadType) return false;
          if (target.threadType === 'PATIENT_CLINIC') {
            return m.patientAccountId === target.patientAccountId && m.doctorId === target.doctorId;
          }
          if (target.threadType === 'PATIENT_ADMIN') {
            return m.patientAccountId === target.patientAccountId;
          }
          if (target.threadType === 'CLINIC_ADMIN') {
            return m.doctorId === target.doctorId;
          }
          return false;
        }

        function markThreadReadForViewer() {
          const updatedMsgs = [];
          (db.messages || []).forEach((m) => {
            if (!matchesThread(m) || isMessageReadForRole(m, viewerRole)) return;
            const isFromOther =
              (viewerRole === 'PATIENT' && m.senderRole !== 'PATIENT') ||
              (viewerRole === 'DOCTOR' && m.senderRole !== 'CLINIC') ||
              (viewerRole === 'ADMIN' && m.senderRole !== 'ADMIN');
            if (isFromOther) {
              m.isRead = true;
              if (viewerRole === 'PATIENT') m.isReadByPatient = true;
              if (viewerRole === 'DOCTOR') m.isReadByClinic = true;
              if (viewerRole === 'ADMIN') m.isReadByAdmin = true;
              updatedMsgs.push(m);
            }
          });
          if (updatedMsgs.length > 0) {
            saveState(db);
            updatedMsgs.forEach((m) => syncDocToFirestoreNamespace('messages', m.id, m));
            updateHeader();
          }
        }

        markThreadReadForViewer();

        const titleText = target.threadType === 'PATIENT_CLINIC'
          ? (viewerRole === 'DOCTOR'
              ? bi('محادثة المريض: ' + (target.patientName || ''), 'Patient Chat: ' + (target.patientName || ''))
              : bi('مراسلة: ' + (target.doctorName || 'العيادة'), 'Chat: ' + (target.doctorName || 'Clinic')))
          : (target.threadType === 'PATIENT_ADMIN'
              ? (viewerRole === 'ADMIN'
                  ? bi('دعم فني — المريض: ' + (target.patientName || ''), 'Support — Patient: ' + (target.patientName || ''))
                  : bi('مراسلة الإدارة / الدعم الفني', 'Message Admin / Support'))
              : (viewerRole === 'ADMIN'
                  ? bi('دعم فني — العيادة: ' + (target.doctorName || ''), 'Support — Clinic: ' + (target.doctorName || ''))
                  : bi('مراسلة الإدارة العليا', 'Message Super Admin')));

        function isMine(m) {
          if (viewerRole === 'PATIENT') return m.senderRole === 'PATIENT';
          if (viewerRole === 'DOCTOR') return m.senderRole === 'CLINIC';
          return m.senderRole === 'ADMIN';
        }

        let isAdminWarningMode = false;

        function renderChatHtml() {
          const msgs = (db.messages || []).filter(matchesThread).sort((a, b) => a.createdAtMillis - b.createdAtMillis);
          const listHtml = msgs.length === 0
            ? '<div style="text-align:center;color:var(--text-muted);padding:24px 8px;">' + esc(bi('ابدأ المحادثة الآن بكتابة رسالتك بالأسفل.', 'Start the conversation by typing your message below.')) + '</div>'
            : msgs.map((m) => {
                const mine = isMine(m);
                const isWarn = String(m.body || '').indexOf('[تحذير إداري]') >= 0 || String(m.body || '').indexOf('⚠️ تحذير') >= 0;
                const warnBubbleStyle = isWarn ? 'background:#FEF2F2;color:#991B1B;border:1.5px solid #DC2626;' : '';
                const delBtnHtml = viewerRole === 'ADMIN'
                  ? '<button type="button" data-chat-del-msg="' + esc(m.id) + '" title="' + esc(bi('حذف الرسالة', 'Delete Message')) + '" style="background:none;border:none;cursor:pointer;font-size:0.9rem;padding:2px 6px;min-width:36px;min-height:36px;color:inherit;">🗑️</button>'
                  : '';
                return '<div class="chat-bubble ' + (mine ? 'mine' : 'theirs') + '" style="' + warnBubbleStyle + '">' +
                  '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:2px;">' +
                    '<span style="font-size:0.74rem;font-weight:700;opacity:0.9;">' + (isWarn ? '⚠️ ' : '') + esc(m.senderName || '') + '</span>' +
                    delBtnHtml +
                  '</div>' +
                  '<div style="white-space:pre-wrap;">' + esc(m.body) + '</div>' +
                  '<div class="chat-meta"><span>' + esc(formatMessageTime(m.createdAtMillis)) + '</span><span>' + (mine ? (m.isRead ? '✓✓' : '✓') : '') + '</span></div>' +
                '</div>';
              }).join('');
          const clearAllHtml = (viewerRole === 'ADMIN' && msgs.length > 0)
            ? '<div style="display:flex;justify-content:flex-end;margin-bottom:4px;">' +
                '<button class="btn btn-danger-outline" id="btnDirectChatClearAll" type="button" style="min-height:38px;padding:4px 12px;font-size:0.82rem;">🗑️ ' + esc(bi('مسح المحادثة بالكامل', 'Clear Entire Thread')) + '</button>' +
              '</div>'
            : '';
          const adminTypeSelectorHtml = viewerRole === 'ADMIN'
            ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;">' +
                '<button type="button" class="chip ' + (!isAdminWarningMode ? 'active' : '') + '" id="btnChatTypeNormal" style="flex:1;">💬 ' + esc(bi('رسالة عادية', 'Normal Message')) + '</button>' +
                '<button type="button" class="chip ' + (isAdminWarningMode ? 'active' : '') + '" id="btnChatTypeWarn" style="flex:1;' + (isAdminWarningMode ? 'background:#DC2626;border-color:#DC2626;color:#fff;' : 'color:#991B1B;border-color:#FCA5A5;') + '">⚠️ ' + esc(bi('رسالة تحذير إداري', 'Admin Warning')) + '</button>' +
              '</div>'
            : '';
          return clearAllHtml +
            '<div class="chat-thread-list" id="chatThreadList">' + listHtml + '</div>' +
            adminTypeSelectorHtml +
            '<div style="display:flex;gap:8px;align-items:center;">' +
              '<input class="input" id="chatComposerInput" placeholder="' + esc(isAdminWarningMode ? bi('اكتب نص التحذير الإداري...', 'Type administrative warning...') : bi('اكتب رسالتك هنا...', 'Type your message...')) + '" style="flex:1;' + (isAdminWarningMode ? 'border-color:#DC2626;' : '') + '" />' +
              '<button class="btn ' + (isAdminWarningMode ? 'btn-danger-outline' : 'btn-primary') + '" id="btnSendChatMessage" type="button" style="min-height:46px;' + (isAdminWarningMode ? 'background:#DC2626;color:#fff;' : '') + '">' + (isAdminWarningMode ? '⚠️ ' + esc(bi('إرسال تحذير', 'Send Warning')) : '📤 ' + esc(bi('إرسال', 'Send'))) + '</button>' +
            '</div>';
        }

        function mountChatHandlers() {
          const box = document.getElementById('chatThreadList');
          if (box) box.scrollTop = box.scrollHeight;
          const inp = document.getElementById('chatComposerInput');
          const btn = document.getElementById('btnSendChatMessage');

          function rerenderModalChat() {
            const bodyEl = document.getElementById('modalBody');
            if (bodyEl) {
              bodyEl.innerHTML = renderChatHtml();
              mountChatHandlers();
            }
            updateHeader();
          }

          if (viewerRole === 'ADMIN') {
            const normTypeBtn = document.getElementById('btnChatTypeNormal');
            const warnTypeBtn = document.getElementById('btnChatTypeWarn');
            if (normTypeBtn) normTypeBtn.onclick = function () { isAdminWarningMode = false; rerenderModalChat(); };
            if (warnTypeBtn) warnTypeBtn.onclick = function () { isAdminWarningMode = true; rerenderModalChat(); };

            document.querySelectorAll('[data-chat-del-msg]').forEach((delBtn) => {
              delBtn.onclick = function () {
                const msgId = delBtn.getAttribute('data-chat-del-msg');
                deleteDirectMessageByAdmin(msgId);
                showToast(bi('تم حذف الرسالة بنجاح', 'Message deleted'));
                rerenderModalChat();
                renderApp();
              };
            });
            const clearAllBtn = document.getElementById('btnDirectChatClearAll');
            if (clearAllBtn) {
              clearAllBtn.onclick = function () {
                deleteChatThreadByAdmin(target.threadType, target.patientAccountId, target.doctorId);
                showToast(bi('تم مسح المحادثة بالكامل', 'Conversation cleared'));
                rerenderModalChat();
                renderApp();
              };
            }
          }

          function submitMsg() {
            const txt = (inp ? inp.value : '').trim();
            if (!txt) return;
            if (target.threadType === 'PATIENT_CLINIC' && viewerRole === 'PATIENT') {
              const docObj = db.doctors.find((d) => d.id === target.doctorId);
              if (!canPatientChatWith(docObj)) {
                showToast(bi('تم إيقاف الدردشة مع هذه العيادة من قبل الإدارة', 'Chat is currently disabled by Admin'));
                return;
              }
            }
            const senderRole = viewerRole === 'PATIENT' ? 'PATIENT' : (viewerRole === 'DOCTOR' ? 'CLINIC' : 'ADMIN');
            const senderName = viewerRole === 'PATIENT'
              ? (target.patientName || (db.account && db.account.fullName) || bi('مريض', 'Patient'))
              : (viewerRole === 'DOCTOR'
                  ? (target.doctorName || bi('العيادة', 'Clinic'))
                  : (db.config.adminOwnerName || bi('المدير العام', 'General Manager')));
            const finalBody = (viewerRole === 'ADMIN' && isAdminWarningMode && txt.indexOf('[تحذير إداري]') < 0)
              ? ('⚠️ [تحذير إداري] ' + txt)
              : txt;
            pushDirectMessage({
              threadType: target.threadType,
              senderRole: senderRole,
              senderName: senderName,
              patientAccountId: target.patientAccountId || '',
              patientName: target.patientName || '',
              patientPhone: target.patientPhone || '',
              doctorId: target.doctorId || '',
              doctorName: target.doctorName || '',
              body: finalBody
            });
            if (viewerRole === 'ADMIN' && isAdminWarningMode) {
              const aud = target.threadType === 'CLINIC_ADMIN' ? 'CLINIC' : 'PATIENT';
              const tid = target.threadType === 'CLINIC_ADMIN' ? (target.doctorId || '') : (target.patientAccountId || '');
              const nowMs = Date.now();
              const warnNotif = {
                id: nowMs,
                message: finalBody,
                isRead: false,
                targetAudience: aud,
                targetId: tid,
                senderLabel: bi('⚠️ تحذير إداري من المدير العام', '⚠️ Warning from General Manager'),
                createdAtMillis: nowMs
              };
              db.notifications.unshift(warnNotif);
              saveState(db);
              syncDocToFirestoreNamespace('notifications', String(warnNotif.id), warnNotif);
              triggerPlatformNotification('⚠️ تحذير إداري — طب الحجايزة', finalBody, 'warn_' + nowMs);
              dispatchWorkerPush('ADMIN_WARNING', '⚠️ تحذير إداري — طب الحجايزة', finalBody, aud, tid, CLOUD_PATHS.notifications);
            }
            rerenderModalChat();
            const reInp = document.getElementById('chatComposerInput');
            if (reInp) reInp.focus();
          }

          if (btn) btn.onclick = submitMsg;
          if (inp) {
            inp.onkeydown = function (e) {
              if (e.key === 'Enter') {
                e.preventDefault();
                submitMsg();
              }
            };
          }
        }

        openModal(titleText, renderChatHtml(), mountChatHandlers);
      }

      function openNotificationsModal() {
        const roleMode = ui.roleMode === 'ADMIN' && ui.isAdminLoggedIn
          ? 'ADMIN'
          : (ui.roleMode === 'DOCTOR' && ui.loggedInDoctorId ? 'DOCTOR' : 'PATIENT');

        function buildThreadsForModal() {
          const map = {};
          (db.messages || []).forEach((m) => {
            if (roleMode === 'PATIENT') {
              if (!db.account || m.patientAccountId !== db.account.id) return;
              if (m.threadType !== 'PATIENT_CLINIC' && m.threadType !== 'PATIENT_ADMIN') return;
              const k = m.threadType === 'PATIENT_CLINIC' ? ('PC_' + m.doctorId) : 'PA_ADMIN';
              if (!map[k]) {
                map[k] = {
                  key: k,
                  threadType: m.threadType,
                  doctorId: m.doctorId,
                  doctorName: m.doctorName,
                  patientAccountId: m.patientAccountId,
                  patientName: m.patientName,
                  patientPhone: m.patientPhone,
                  title: m.threadType === 'PATIENT_CLINIC' ? (m.doctorName || bi('عيادة', 'Clinic')) : bi('الإدارة / الدعم الفني', 'Admin / Support'),
                  msgs: [],
                  unread: 0
                };
              }
              map[k].msgs.push(m);
              if (!m.isRead && m.senderRole !== 'PATIENT') map[k].unread += 1;
            } else if (roleMode === 'DOCTOR') {
              if (!ui.loggedInDoctorId || m.doctorId !== ui.loggedInDoctorId) return;
              const k = m.threadType === 'PATIENT_CLINIC' ? ('PC_' + m.patientAccountId) : 'CA_ADMIN';
              if (!map[k]) {
                map[k] = {
                  key: k,
                  threadType: m.threadType,
                  doctorId: m.doctorId,
                  doctorName: m.doctorName,
                  patientAccountId: m.patientAccountId,
                  patientName: m.patientName,
                  patientPhone: m.patientPhone,
                  title: m.threadType === 'PATIENT_CLINIC' ? (m.patientName || bi('مريض', 'Patient')) : bi('الإدارة العليا', 'Super Admin'),
                  msgs: [],
                  unread: 0
                };
              }
              map[k].msgs.push(m);
              if (!m.isRead && m.senderRole !== 'CLINIC') map[k].unread += 1;
            } else {
              if (m.threadType !== 'PATIENT_ADMIN' && m.threadType !== 'CLINIC_ADMIN') return;
              const k = m.threadType === 'PATIENT_ADMIN' ? ('PA_' + m.patientAccountId) : ('CA_' + m.doctorId);
              if (!map[k]) {
                map[k] = {
                  key: k,
                  threadType: m.threadType,
                  doctorId: m.doctorId,
                  doctorName: m.doctorName,
                  patientAccountId: m.patientAccountId,
                  patientName: m.patientName,
                  patientPhone: m.patientPhone,
                  title: m.threadType === 'PATIENT_ADMIN' ? (m.patientName || bi('مريض', 'Patient')) : (m.doctorName || bi('عيادة', 'Clinic')),
                  msgs: [],
                  unread: 0
                };
              }
              map[k].msgs.push(m);
              if (!m.isRead && m.senderRole !== 'ADMIN') map[k].unread += 1;
            }
          });
          return Object.values(map).sort((a, b) => {
            const al = a.msgs[a.msgs.length - 1];
            const bl = b.msgs[b.msgs.length - 1];
            return (bl ? bl.createdAtMillis : 0) - (al ? al.createdAtMillis : 0);
          });
        }

        function renderNotificationsBody() {
          const visibleAlerts = getVisibleNotificationsForRole();
          const threads = buildThreadsForModal();

          const markAllBtnHtml = (visibleAlerts.some((n) => !n.isRead) || threads.some((t) => t.unread > 0))
            ? '<button class="btn btn-outline btn-block" id="btnNotifMarkAllRead" type="button">✓ ' + esc(bi('تحديد الكل كمقروء', 'Mark All as Read')) + '</button>'
            : '';

          const threadsHtml = threads.length > 0
            ? '<h4 style="margin-top:4px;">💬 ' + esc(bi('المحادثات والرسائل المباشرة', 'Direct Conversations')) + '</h4>' +
              threads.map((t) => {
                const last = t.msgs[t.msgs.length - 1];
                return '<div class="card" style="padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;' + (t.unread > 0 ? 'border-color:var(--teal);background:var(--teal-soft);' : '') + '">' +
                  '<div style="flex:1;min-width:170px;">' +
                    '<div style="font-weight:800;">' + esc(t.title) + (t.unread > 0 ? ' <span class="badge badge-booked">' + t.unread + '</span>' : '') + '</div>' +
                    (last ? '<div style="font-size:0.83rem;color:var(--text-muted);margin-top:2px;">' + esc(last.body) + '</div>' : '') +
                  '</div>' +
                  '<button class="btn btn-primary" type="button" data-notif-open-thread="' + esc(t.key) + '" style="min-height:36px;padding:4px 10px;font-size:0.82rem;">💬 ' + esc(bi('رد / فتح المحادثة', 'Reply / Open')) + '</button>' +
                '</div>';
              }).join('')
            : '';

          const alertsHtml = visibleAlerts.length === 0
            ? '<div style="padding:14px;text-align:center;color:var(--text-muted);">' + esc(bi('لا توجد إشعارات أو تنبيهات حالياً.', 'No alerts or notifications right now.')) + '</div>'
            : '<h4 style="margin-top:4px;">🔔 ' + esc(bi('الإشعارات والتنبيهات', 'Alerts & Broadcasts')) + '</h4>' +
              visibleAlerts.map((n) => {
                const matchedAcc = (roleMode === 'ADMIN' && n.targetAudience === 'ADMIN' && n.targetId)
                  ? (db.accounts || []).find((a) => a.id === n.targetId)
                  : null;
                const isWarnNotif = String(n.message || '').indexOf('تحذير') >= 0 || String(n.senderLabel || '').indexOf('تحذير') >= 0;
                return '<div class="alert-banner" style="flex-direction:column;align-items:stretch;' + (isWarnNotif ? 'background:#FEF2F2;border-color:#DC2626;color:#991B1B;' : '') + (n.isRead ? 'opacity:0.86;' : 'border-width:2px;') + '">' +
                  (n.senderLabel ? '<div style="font-size:0.76rem;font-weight:800;margin-bottom:2px;">' + esc(n.senderLabel) + '</div>' : '') +
                  '<div>' + esc(n.message) + '</div>' +
                  (matchedAcc
                    ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">' +
                        (matchedAcc.isPhoneVerified === false
                          ? '<button class="btn btn-green" type="button" data-notif-verify-acc="' + esc(matchedAcc.id) + '" style="min-height:36px;padding:4px 10px;font-size:0.8rem;">✅ ' + esc(bi('توثيق فوري', 'Verify Now')) + '</button>' +
                            '<button class="btn btn-blue" type="button" data-notif-copy-otp="' + esc(matchedAcc.id) + '" style="min-height:36px;padding:4px 10px;font-size:0.8rem;">🔑 ' + esc(bi('كود OTP', 'OTP Code')) + '</button>'
                          : '') +
                        '<button class="btn btn-warn" type="button" data-notif-chat-acc="' + esc(matchedAcc.id) + '" style="min-height:36px;padding:4px 10px;font-size:0.8rem;">💬 ' + esc(bi('مراسلة / تحذير', 'Chat / Warn')) + '</button>' +
                      '</div>'
                    : '') +
                '</div>';
              }).join('');

          return markAllBtnHtml + threadsHtml + alertsHtml;
        }

        function mountNotificationsHandlers() {
          const threads = buildThreadsForModal();
          const markBtn = document.getElementById('btnNotifMarkAllRead');
          if (markBtn) {
            markBtn.onclick = function () {
              const changedNotifs = [];
              const changedMsgs = [];
              getVisibleNotificationsForRole().forEach((n) => {
                if (!n.isRead) {
                  n.isRead = true;
                  changedNotifs.push(n);
                }
              });
              (db.messages || []).forEach((m) => {
                if (isIncomingMessageForRole(m, roleMode)) {
                  m.isRead = true;
                  if (roleMode === 'PATIENT') m.isReadByPatient = true;
                  else if (roleMode === 'DOCTOR') m.isReadByClinic = true;
                  else if (roleMode === 'ADMIN') m.isReadByAdmin = true;
                  changedMsgs.push(m);
                }
              });
              saveState(db);
              changedNotifs.forEach((n) => {
                syncDocToFirestoreNamespace('notifications', String(n.id), n);
              });
              changedMsgs.forEach((m) => {
                syncDocToFirestoreNamespace('messages', m.id, m);
              });
              updateHeader();
              const body = document.getElementById('modalBody');
              if (body) {
                body.innerHTML = renderNotificationsBody();
                mountNotificationsHandlers();
              }
            };
          }
          document.querySelectorAll('[data-notif-open-thread]').forEach((btn) => {
            btn.onclick = function () {
              const key = btn.getAttribute('data-notif-open-thread');
              const t = threads.find((x) => x.key === key);
              if (t) openDirectChatModal(t);
            };
          });
          document.querySelectorAll('[data-notif-verify-acc]').forEach((btn) => {
            btn.onclick = function () {
              const acc = (db.accounts || []).find((a) => a.id === btn.getAttribute('data-notif-verify-acc'));
              if (!acc) return;

      function openSmartPrescriptionModal(slotId) {
        const slot = db.slots.find((s) => s.id === slotId);
        const doc = db.doctors.find((d) => d.id === slot.doctorId);
        const docMedKeys = medicationCatalogKeysForDoctor(doc);
        const docTemplates = getSpecialtyTemplatesForDoctor(doc);
        let filterMode = 'SPECIALTY';
        let medQuery = '';
        let selectedRx = [];
        let rxAttachmentUrl = '';

        function renderQuickSpecialtyBoxes() {
          const favArr = db.doctorFavorites[doc.id] || [];
          const favDiagList = favArr.map(decodeCustomDiagFavKey).filter(Boolean);

              }).join('') +
              favDiagList.map((fd) => {

                return '<button class="chip ' + (active ? 'active' : '') + '" type="button" data-pick-diag-ar="' + esc(fd) + '" data-pick-diag-en="" style="min-height:34px;padding:4px 10px;font-size:0.8rem;border-color:#F59E0B;">⭐ ' + esc(fd) + '</button>';
              }).join('');

          }

          const sugBox = document.getElementById('rxSpecialtyMedsChips');
          if (sugBox) {

              return '<button class="chip ' + (added ? 'active' : '') + '" type="button" data-sug-med-id="' + esc(sm.id) + '" style="min-height:34px;padding:4px 10px;font-size:0.8rem;">' +

              '</button>';
            }).join('');

              btn.onclick = function () {
                const sm = docTemplates.medications.find((x) => x.id === btn.getAttribute('data-sug-med-id'));
                if (!sm) return;
                if (selectedRx.some((x) => x.id === sm.id || x.tradeName === sm.tradeName)) {
                  showToast(bi('الدواء مضاف بالفعل في الروشتة', 'Medication already added'));
                  return;
                }
                selectedRx.push({ id: sm.id, tradeName: sm.tradeName, strength: sm.strength, dosage: sm.defaultDosage });
                renderRxModalBody();
              };
            });
          }
        }

        function renderRxModalBody() {
          const favArr = db.doctorFavorites[doc.id] || [];
          const favSet = new Set(favArr);
          const q = medQuery.trim().toLowerCase();
          const customFavMeds = filterMode === 'FAV'
            ? favArr.map(decodeCustomMedFavKey).filter(Boolean).filter((cm) => !q || cm.tradeName.toLowerCase().includes(q) || cm.dosage.toLowerCase().includes(q))
            : [];
          const filteredMeds = ui.medications.filter((m) => {
            const matchQ = !q ||
              m.tradeName.toLowerCase().includes(q) ||
              m.activeIngredient.toLowerCase().includes(q) ||
              m.strength.toLowerCase().includes(q);
            if (filterMode === 'FAV') return favSet.has(m.id) && matchQ;
            if (q) return matchQ;
            if (filterMode === 'SPECIALTY') return docMedKeys.size === 0 || docMedKeys.has(m.specialty) || m.specialty === doc.specialty;
            return true;
          });

          renderQuickSpecialtyBoxes();

          const customFavHtml = customFavMeds.map((cm) => {
            const isAdded = selectedRx.some((x) => x.tradeName === cm.tradeName);
            return '<div class="med-item-row">' +
              '<div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">' +

          document.getElementById('rxCatalogContainer').innerHTML = (filteredMeds.length === 0 && customFavMeds.length === 0)

                  '</button>' +
                '</div>';
              }).join('');

          document.getElementById('rxSelectedContainer').innerHTML = selectedRx.length === 0

            : selectedRx.map((item, idx) =>

                    '<button class="chip" type="button" data-del-rx="' + idx + '" style="min-height:30px;padding:2px 8px;color:var(--booked-border);">' + esc(bi('حذف', 'Remove')) + '</button>' +
                  '</div>' +
                  '<input class="input" data-edit-dose="' + idx + '" value="' + esc(item.dosage) + '" placeholder="' + esc(bi('الجرعة وطريقة الاستخدام', 'Dosage instructions')) + '" />' +
                  '<div class="chips-row" style="margin-top:6px;">' +

                    ).join('') +
                  '</div>' +
                '</div>'

          document.querySelectorAll('[data-fav-med]').forEach((btn) => {
            btn.onclick = function () {
              const medId = btn.getAttribute('data-fav-med');

              db.doctorFavorites[doc.id] = arr;
              saveState(db);
              renderRxModalBody();
            };

          document.querySelectorAll('[data-add-custom-fav]').forEach((btn) => {
            btn.onclick = function () {
              const decoded = decodeCustomMedFavKey(btn.getAttribute('data-add-custom-fav'));

      function downloadAttachmentFile(fileObj) {
        if (!fileObj || !fileObj.attachmentDataUrl) {
          showToast(bi('لا يوجد ملف متاح للتحميل', 'No file available to download'));
          return;
        }
        const safeName = fileObj.attachmentName || (fileObj.attachmentMimeType === 'application/pdf' ? 'medical_report.pdf' : 'medical_attachment.jpg');
        const mimeType = fileObj.attachmentMimeType || (String(fileObj.attachmentDataUrl).indexOf('data:application/pdf') === 0 ? 'application/pdf' : 'image/jpeg');

        if (window.AndroidPdfBridge && typeof window.AndroidPdfBridge.saveBase64File === 'function') {
          try {
            window.AndroidPdfBridge.saveBase64File(fileObj.attachmentDataUrl, mimeType, safeName);
            showToast(bi('تم حفظ الملف في مجلد التنزيلات: ' + safeName, 'Saved to Downloads: ' + safeName));
            return;
          } catch (e) { /* fall back to browser blob download */ }
        }

        const blob = dataUrlToBlob(fileObj.attachmentDataUrl, mimeType);
        if (!blob) {
          showToast(bi('تعذر تجهيز الملف للتحميل', 'Unable to prepare file download'));
          return;
        }
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = safeName;
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () {
          try { URL.revokeObjectURL(blobUrl); } catch (e) {}
        }, 6000);
        showToast(bi('جاري تحميل الملف: ' + safeName, 'Downloading file: ' + safeName));
      }

        saveState(db);
        showToast(bi('تم حذف الملف وتحديث الملخص الطبي بنجاح', 'File deleted & AI summary refreshed'));

              '<button class="btn btn-danger-outline" id="btnModalDeleteAtt" type="button">🗑️ ' + esc(bi('حذف الملف', 'Delete File')) + '</button>' +
            '</div>' +
            zoomBarHtml +
            '<div class="img-preview-scroll"><img id="previewAttImage" src="' + esc(rec.attachmentDataUrl) + '" style="width:100%;height:auto;border-radius:14px;border:1px solid var(--border);display:block;margin:0 auto;" alt="' + esc(safeName) + '" /></div>',
            function () {
              document.getElementById('btnModalDownloadAtt').onclick = function () { downloadAttachmentFile(rec); };
              document.getElementById('btnModalDeleteAtt').onclick = function () { openDeleteFileConfirmModal(rec.id); };
              bindZoomAndFullscreen(function () {
                const img = document.getElementById('previewAttImage');
                const zLbl = document.getElementById('btnViewerZoomReset');
                if (img) img.style.width = Math.round(zoomFactor * 100) + '%';
                if (zLbl) zLbl.textContent = Math.round(zoomFactor * 100) + '%';
              });
            }
          );
          return;
        }

        const blob = dataUrlToBlob(rec.attachmentDataUrl, 'application/pdf');
        const blobUrl = blob ? URL.createObjectURL(blob) : '';
        if (blobUrl) activeModalBlobUrls.push(blobUrl);

        openModal(
          safeName,
          '<div class="pdf-viewer-toolbar">' +
            '<button class="btn btn-primary" id="btnModalDownloadPdf" type="button" style="flex:1;">⬇️ ' + esc(bi('تحميل ملف التحليل (PDF)', 'Download PDF Report')) + '</button>' +
            '<button class="btn btn-danger-outline" id="btnModalDeletePdf" type="button">🗑️ ' + esc(bi('حذف الملف', 'Delete File')) + '</button>' +
          '</div>' +
          zoomBarHtml +
          '<div id="pdfRenderStatus" style="font-size:0.84rem;color:var(--teal-text);font-weight:700;">⏳ ' + esc(bi('جاري تحميل ومعالجة صفحات الـ PDF...', 'Rendering PDF pages...')) + '</div>' +
          '<div id="pdfCanvasList" class="pdf-canvas-list" dir="ltr"></div>' +
          (rec.extractedText
            ? '<details style="margin-top:4px;"><summary style="cursor:pointer;font-weight:700;color:var(--teal-text);font-size:0.86rem;">📄 ' + esc(bi('عرض النص المستخرج من التحليل', 'Show Extracted PDF Text')) + '</summary>' +
                '<div style="white-space:pre-wrap;font-size:0.8rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:6px;max-height:180px;overflow-y:auto;">' + esc(rec.extractedText) + '</div>' +
              '</details>'
            : ''),
          async function () {
            document.getElementById('btnModalDownloadPdf').onclick = function () { downloadAttachmentFile(rec); };
            document.getElementById('btnModalDeletePdf').onclick = function () { openDeleteFileConfirmModal(rec.id); };

            function applyPdfZoom() {
              const zLbl = document.getElementById('btnViewerZoomReset');
              if (zLbl) zLbl.textContent = Math.round(zoomFactor * 100) + '%';
              document.querySelectorAll('#pdfCanvasList .pdf-page-canvas').forEach((cv) => {
                cv.style.width = Math.round(zoomFactor * 100) + '%';
                cv.style.height = 'auto';
              });
            }
            bindZoomAndFullscreen(applyPdfZoom);

            const container = document.getElementById('pdfCanvasList');
            const statusEl = document.getElementById('pdfRenderStatus');
            const bytes = dataUrlToUint8Array(rec.attachmentDataUrl);
            if (!bytes || !container) {
              if (statusEl) statusEl.textContent = bi('تعذر قراءة الملف. اضغط زر التحميل بالأعلى لفتحه على جهازك.', 'Unable to read PDF. Tap Download above.');
              return;
            }
            if (window.pdfjsLib) {
              try {
                const pdfDoc = await window.pdfjsLib.getDocument({
                  data: bytes.slice(),
                  cMapUrl: PDFJS_ASSETS_BASE + 'cmaps/',
                  cMapPacked: true,
                  standardFontDataUrl: PDFJS_ASSETS_BASE + 'standard_fonts/'
                }).promise;
                const total = pdfDoc.numPages || 0;
                if (statusEl) statusEl.textContent = bi('📄 عدد الصفحات: ' + total, '📄 Pages: ' + total);
                const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1.5, 2.5));
                const renderScale = 2.0 * Math.max(1.0, dpr / 1.5);
                for (let p = 1; p <= total; p++) {
                  const page = await pdfDoc.getPage(p);
                  const vp = page.getViewport({ scale: renderScale });
                  const canvas = document.createElement('canvas');
                  canvas.className = 'pdf-page-canvas';
                  canvas.width = Math.ceil(vp.width);
                  canvas.height = Math.ceil(vp.height);
                  canvas.style.width = Math.round(zoomFactor * 100) + '%';
                  canvas.style.height = 'auto';
                  canvas.style.display = 'block';
                  container.appendChild(canvas);
                  const ctx = canvas.getContext('2d');
                  await page.render({ canvasContext: ctx, viewport: vp }).promise;
                }
                return;
              } catch (e) { /* fall back to object embed */ }
            }
            if (blobUrl) {
              if (statusEl) statusEl.textContent = bi('تم فتح الملف عبر العارض المدمج — في حال لم يظهر اضغط زر التحميل بالأعلى.', 'Embedded PDF view — tap Download above if needed.');
              container.innerHTML = '<object data="' + esc(blobUrl) + '#toolbar=1" type="application/pdf" style="width:100%;height:58vh;border-radius:10px;background:#fff;">' +
                '<div style="padding:18px;text-align:center;color:var(--text-muted);">' + esc(bi('المتصفح الحالي لا يدعم عرض الـ PDF داخل الإطار، يرجى الضغط على زر تحميل ملف التحليل (PDF) بالأعلى.', 'Inline PDF preview unavailable. Please tap Download PDF Report above.')) + '</div>' +
              '</object>';
            } else {
              if (statusEl) statusEl.textContent = bi('يرجى الضغط على زر التحميل بالأعلى لفتح ملف الـ PDF.', 'Please tap Download above to open the PDF.');
            }
          }
        );
      }

      function openPatientEmrModal(slotId) {
        const slot = db.slots.find((s) => s.id === slotId);
        const memberObj = findMemberBySlotOrId(slot);
        const recs = db.records.filter((r) =>
          (slot.familyMemberId && r.familyMemberId === slot.familyMemberId) ||
          (slot.patientName && r.patientName === slot.patientName)
        ).sort((a, b) => b.createdAtMillis - a.createdAtMillis);

        const permLogs = memberObj
          ? getPermanentLogsForMemberWeb(memberObj)
          : (db.permanentLogs || []).filter((l) =>
              (slot.familyMemberId && l.familyMemberId === slot.familyMemberId) ||
              (slot.patientName && l.patientName === slot.patientName)
            ).slice().sort((a, b) =>
              ui.permanentLogSortOrder === 'ASC'
                ? ((a.eventTimestampMillis || 0) - (b.eventTimestampMillis || 0))
                : ((b.eventTimestampMillis || 0) - (a.eventTimestampMillis || 0))
            );

        openModal(bi('الملف الطبي: ', 'Medical Record: ') + slot.patientName,
          renderDoctorMedicalAlertBannerHtml(memberObj) +
          renderAiMedicalSummaryCardHtml(slot.patientName, recs, memberObj) +
          renderPermanentMedicalLogSectionHtml(slot.patientName, permLogs, memberObj) +
          (recs.length === 0
            ? '<div style="padding:18px;text-align:center;color:var(--text-muted);">' + esc(bi('لا توجد زيارات أو تحاليل مسجلة لهذا المريض.', 'No previous visits or lab reports recorded for this patient.')) + '</div>'
            : recs.map(renderMedicalRecordCardHtml).join('')),
          bindSharedRecordActions
        );
      }

      function openPatientEmrModalByAccountId(accountId, selectedMemberId) {
        const acc = (db.accounts || []).find((a) => a.id === accountId);
        if (!acc) return;
        const members = (db.familyMembers || []).filter((m) =>
          m.accountId === acc.id || (m.phone && normalizePhoneDigits(m.phone) === normalizePhoneDigits(acc.phone))
        );
        const activeMem = members.find((m) => m.id === selectedMemberId) || members[0] || null;
        const targetName = (activeMem && activeMem.fullName) || acc.fullName;
        const recs = db.records.filter((r) =>
          (activeMem && r.familyMemberId === activeMem.id) ||
          (r.patientName === targetName) ||
          (!activeMem && acc.phone && normalizePhoneDigits(r.patientPhone) === normalizePhoneDigits(acc.phone))
        ).sort((a, b) => (b.createdAtMillis || 0) - (a.createdAtMillis || 0));
        const permLogs = activeMem
          ? getPermanentLogsForMemberWeb(activeMem)
          : (db.permanentLogs || []).filter((l) =>
              l.patientName === targetName ||
              (acc.phone && normalizePhoneDigits(l.patientPhone) === normalizePhoneDigits(acc.phone))
            ).slice().sort((a, b) =>
              ui.permanentLogSortOrder === 'ASC'
                ? ((a.eventTimestampMillis || 0) - (b.eventTimestampMillis || 0))
                : ((b.eventTimestampMillis || 0) - (a.eventTimestampMillis || 0))
            );
        const switcherHtml = members.length > 1
          ? '<div class="chips-row" style="margin-bottom:8px;">' +
              members.map((fm) =>
                '<button class="chip ' + (activeMem && fm.id === activeMem.id ? 'active' : '') + '" type="button" data-doc-switch-emr-mem="' + esc(fm.id) + '">' + esc(fm.fullName) + ' (' + esc(fm.relation || '') + ')</button>'
              ).join('') +
            '</div>'
          : '';
        openModal(bi('الملف الطبي: ', 'Medical Record: ') + targetName,
          switcherHtml +
          renderDoctorMedicalAlertBannerHtml(activeMem) +
          renderAiMedicalSummaryCardHtml(targetName, recs, activeMem) +

          (recs.length === 0
            ? '<div style="padding:18px;text-align:center;color:var(--text-muted);">' + esc(bi('لا توجد زيارات أو تحاليل مسجلة لهذا المريض.', 'No previous visits or lab reports recorded for this patient.')) + '</div>'

                renderApp();
              }

          btn.onclick = function () {

              renderApp();

        document.querySelectorAll('[data-toggle-perm-log-sort]').forEach((btn) => {

            ui.permanentLogSortOrder = ui.permanentLogSortOrder === 'DESC' ? 'ASC' : 'DESC';

            if (secEl && ui.lastPermLogContext) {

              const updatedLogs = ctxMem
                ? getPermanentLogsForMemberWeb(ctxMem)
                : (db.permanentLogs || []).filter((l) => l.patientName === ui.lastPermLogContext.memberName).slice().sort((a, b) =>
                    ui.permanentLogSortOrder === 'ASC'

      function bindLabDashboardEvents() {

        let pendingLabFile = { dataUrl: '', mimeType: '', fileName: '' };

        function runLabPatientSearch() {
          const rawQ = (document.getElementById('labPatientPhoneQuery').value || '').trim();
          const digitsQ = normalizePhoneDigits(rawQ);
          ui.labPhoneQuery = rawQ;
          if (!digitsQ) {
            ui.labSearchResults = [];
            ui.labTargetMemberId = '';
            renderApp();
            return;
          }
          const matches = (db.accounts || []).filter((acc) => normalizePhoneDigits(acc.phone).includes(digitsQ));
          ui.labSearchResults = matches.map((acc) => ({
            account: acc,
            members: (db.familyMembers || []).filter((m) => m.accountId === acc.id || normalizePhoneDigits(m.phone) === normalizePhoneDigits(acc.phone))
          }));
          if (ui.labSearchResults.length === 1 && ui.labSearchResults[0].members.length > 0) {
            ui.labTargetMemberId = ui.labSearchResults[0].members[0].id;
            ui.labTargetAccountPhone = ui.labSearchResults[0].account.phone;
          } else {
            ui.labTargetMemberId = '';
            ui.labTargetAccountPhone = '';
          }
          renderApp();
        }

        const queryInp = document.getElementById('labPatientPhoneQuery');

              createdAtMillis: newLabRec.createdAtMillis

            db.notifications.unshift(labNotif);
            saveState(db);
            syncDocToFirestoreNamespace('records', newLabRec.id, newLabRec);
            syncDocToFirestoreNamespace('notifications', String(labNotif.id), labNotif);

        function blockPhoneAndCancel(rawPhone, reason) {

            return;
          }
          if (!isPhoneBlocked(rawPhone)) {
            db.blockedPhones = (db.blockedPhones || []).concat([{
              phone: rawPhone.trim(),
              reason: (reason || '').trim() || bi('حظر إداري بسبب حجز وهمي', 'Blocked for fake booking'),
              blockedAtMillis: Date.now()
            }]);
          }
          db.slots.forEach((s) => {
            if (s.status === 'BOOKED' && normalizePhoneDigits(s.patientPhone) === digits) {
              s.status = 'AVAILABLE';
              s.patientName = '';
              s.patientPhone = '';
              s.familyMemberId = '';
              s.bookingSource = '';
              cancelSlotRemindersWeb(s.id);

          saveState(db);
          showToast(bi('تم حظر الرقم ' + rawPhone.trim() + ' وإلغاء حجوزاته النشطة', 'Blocked ' + rawPhone.trim()));
          renderApp();

        async function saveAllAdminSettingsFromDom() {
          const pinEl = document.getElementById('admSetPin');
          if (pinEl) {
            const newPin = String(pinEl.value || '').trim();
            if (newPin && newPin.length < 4) {
              showToast(bi('الرقم السري (PIN) يجب أن يكون 4 أرقام على الأقل', 'PIN must be at least 4 digits'));
              return;
            }
            if (newPin.length >= 4) db.config.adminPin = newPin;
          }
          const valOr = (id, fb) => {
            const el = document.getElementById(id);
            if (!el) return fb;
            const v = String(el.value || '').trim();
            return v || fb;
          };
          const optOr = (id, fb) => {
            const el = document.getElementById(id);
            return el ? String(el.value || '').trim() : fb;

            showToast(bi('تم حفظ ومزامنة حسابي Google Drive للعيادة بنجاح', 'Saved dual Google Drive URLs for clinic'));
            renderApp();
          };
        }

        const saveDrivePolicyQuickBtn = document.getElementById('btnSaveDrivePolicyQuick');
        if (saveDrivePolicyQuickBtn) {
          saveDrivePolicyQuickBtn.onclick = saveAllAdminSettingsFromDom;
        }

        document.querySelectorAll('[data-admin-clean-drive]').forEach((btn) => {
          btn.onclick = function () {
            const targetId = btn.getAttribute('data-admin-clean-drive');
            const label = btn.getAttribute('data-clean-label') || targetId;
            if (!targetId) return;
            const cleaned = cleanHeavyAttachmentsForStorageTargetWeb(targetId);
            showToast(
              cleaned > 0
                ? bi('تم تفريغ ' + cleaned + ' ملف ثقيل من ' + label + ' مع بقاء السجل الطبي المكتوب محفوظاً 100%', 'Cleaned ' + cleaned + ' heavy files from ' + label + ' (written history 100% preserved)')
                : bi('لا توجد ملفات ثقيلة حالياً في ' + label + ' — التخزين فارغ ونظيف ✓', 'No heavy files currently in ' + label)
            );
            renderApp();
          };
        });

        document.querySelectorAll('[data-preview-proof]').forEach((btn) => {
          btn.onclick = function () {
            const req = (db.familyLinkRequests || []).find((r) => r.id === btn.getAttribute('data-preview-proof'));
            if (!req) return;
            const kind = btn.getAttribute('data-proof-kind');
            if (kind === 'marriage') openProofLightboxModal(bi('💍 صورة قسيمة الزواج', '💍 Marriage Certificate'), req.marriageCertDataUrl);
            else if (kind === 'front') openProofLightboxModal(bi('🪪 صورة البطاقة الشخصية (الوجه)', '🪪 National ID (Front)'), req.idFrontDataUrl);
            else openProofLightboxModal(bi('🪪 صورة البطاقة الشخصية (الظهر)', '🪪 National ID (Back)'), req.idBackDataUrl);
          };
        });

        document.querySelectorAll('[data-approve-fam-link]').forEach((btn) => {
          btn.onclick = function () {
            const req = (db.familyLinkRequests || []).find((r) => r.id === btn.getAttribute('data-approve-fam-link'));
            if (!req) return;
            const accA = (db.accounts || []).find((a) => a.id === req.requesterAccountId);
            const accB = (db.accounts || []).find((a) => a.id === req.targetSpouseAccountId);
            if (!accA || !accB) {
              showToast(bi('تعذر العثور على أحد الحسابين للربط', 'One of the spouse accounts was not found'));
              return;
            }
            req.status = 'APPROVED';
            req.reviewedAtMillis = Date.now();
            accA.spouseAccountId = accB.id;
            accB.spouseAccountId = accA.id;
            if (typeof accA.allowSpouseViewPersonalRecords !== 'boolean') accA.allowSpouseViewPersonalRecords = false;
            if (typeof accB.allowSpouseViewPersonalRecords !== 'boolean') accB.allowSpouseViewPersonalRecords = false;
            if (db.account && db.account.id === accA.id) db.account = accA;
            if (db.account && db.account.id === accB.id) db.account = accB;
            saveState(db);
            showToast(bi('تمت الموافقة وربط الأسرة بنجاح (يظهر الأبناء تلقائياً مع بقاء السجل الشخصي خاصاً)', 'Approved spouse link & shared children automatically'));
            renderApp();
          };
        });

        document.querySelectorAll('[data-reject-fam-link]').forEach((btn) => {
          btn.onclick = function () {
            const req = (db.familyLinkRequests || []).find((r) => r.id === btn.getAttribute('data-reject-fam-link'));
            if (!req) return;
            req.status = 'REJECTED';
            req.reviewedAtMillis = Date.now();
            saveState(db);
            showToast(bi('تم رفض طلب ربط الأسرة', 'Family link request rejected'));
            renderApp();
          };
        });

        bindNotificationStatusCard(document);
        bindPasswordToggleButtons(document);
      }

      function bindDoctorDashboardEvents() {
        const doc = db.doctors.find((d) => d.id === ui.loggedInDoctorId);
        if (!doc) return;

        document.querySelectorAll('[data-doc-tab]').forEach((btn) => {
          btn.onclick = function () {

            ui.docActivateSuccessMsg = '';
            renderApp();
          };
        });

        const docChatAdmBtn = document.getElementById('btnDoctorChatAdmin');
        if (docChatAdmBtn) {
          docChatAdmBtn.onclick = function () {
            openDirectChatModal({
              threadType: 'CLINIC_ADMIN',
              doctorId: doc.id,
              doctorName: getDoctorDisplayName(doc)
            });
          };
        }

        const docChatAdmTopBtn = document.getElementById('btnDoctorChatAdminTop');
        if (docChatAdmTopBtn) {
          docChatAdmTopBtn.onclick = function () {
            openDirectChatModal({
              threadType: 'CLINIC_ADMIN',
              doctorId: doc.id,
              doctorName: getDoctorDisplayName(doc)
            });
          };
        }

        const topQuickActBtn = document.getElementById('btnDocTopQuickActivate');
        if (topQuickActBtn) {
          topQuickActBtn.onclick = function () {
            const inp = document.getElementById('docTopQuickActivatePhone');
            const rawPhone = inp ? inp.value.trim() : '';
            const digits = normalizePhoneDigits(rawPhone);
            if (digits.length < 6) {
              showToast(bi('يرجى إدخال رقم هاتف المريض أولاً', 'Please enter patient phone number first'));
              return;
            }
            const target = (db.accounts || []).find((a) => normalizePhoneDigits(a.phone) === digits || normalizePhoneDigits(a.phone).endsWith(digits));
            if (!target) {
              showToast(bi('لم يتم العثور على حساب مسجل بهذا الرقم', 'No registered patient account found with this phone'));
              return;
            }
            const clinicSource = 'عيادة د. ' + String(doc.doctorName || '').replace(/^د\.?\s*/i, '').trim();
            markAccountVerified(target, clinicSource);
            saveState(db);
            syncAccountToCloudNow(target);
            showToast(bi('تم توثيق وتفعيل حساب ' + target.fullName + ' بنجاح (' + clinicSource + ') ✓', 'Verified ' + target.fullName + ' (' + clinicSource + ') ✓'));
            renderApp();
          };
        }

        const docAlertSel = document.getElementById('docAlertPatientSel');
        if (docAlertSel) {
          docAlertSel.onchange = function () {
            ui.docAlertTargetAccId = docAlertSel.value || '';
          };
        }

        const docAlertBtn = document.getElementById('btnDocSendPatientAlert');
        if (docAlertBtn) {
          docAlertBtn.onclick = function () {
            const targetAccId = (document.getElementById('docAlertPatientSel') || {}).value || '';
            const msg = ((document.getElementById('docAlertMessageInp') || {}).value || '').trim();
            if (!msg) { showToast(bi('اكتب نص الإشعار للمريض أولاً', 'Write alert message first')); return; }
            const patNotif = {
              id: Date.now(),
              message: '🩺 ' + getDoctorDisplayName(doc) + ': ' + msg,
              isRead: false,
              targetAudience: 'PATIENT',
              targetId: targetAccId,
              senderLabel: getClinicDisplayName(doc),
              createdAtMillis: Date.now()
            };
            db.notifications.unshift(patNotif);
            saveState(db);
            syncDocToFirestoreNamespace('notifications', String(patNotif.id), patNotif);
            showToast(bi('تم إرسال الإشعار للمريض بنجاح', 'Alert sent to patient'));
            renderApp();
          };
        }

        document.querySelectorAll('[data-doc-reply-patient]').forEach((btn) => {
          btn.onclick = function () {
            const accId = btn.getAttribute('data-doc-reply-patient');
            const sample = (db.messages || []).find((m) => m.threadType === 'PATIENT_CLINIC' && m.doctorId === doc.id && m.patientAccountId === accId);
            const acc = (db.accounts || []).find((a) => a.id === accId);
            openDirectChatModal({
              threadType: 'PATIENT_CLINIC',
              doctorId: doc.id,
              doctorName: getDoctorDisplayName(doc),
              patientAccountId: accId,
              patientName: (acc && acc.fullName) || (sample && sample.patientName) || bi('مريض', 'Patient'),
              patientPhone: (acc && acc.phone) || (sample && sample.patientPhone) || ''
            });
          };
        });

        const logoutBtn = document.getElementById('btnDoctorLogout');
        if (logoutBtn) {
          logoutBtn.onclick = function () {
            ui.loggedInDoctorId = null;
            ui.docActivatePhoneQuery = '';
            ui.docActivateResults = [];
            ui.docActivateSuccessMsg = '';
            showToast(bi('تم تسجيل خروج الطبيب', 'Doctor signed out'));
            renderApp();
          };
        }

        function runDoctorPatientSearch() {
          const inp = document.getElementById('docActivatePhoneInput');
          const rawQ = inp ? inp.value.trim() : '';
          ui.docActivatePhoneQuery = rawQ;
          ui.docActivateSuccessMsg = '';
          const digitsQ = normalizePhoneDigits(rawQ);
          if (digitsQ.length < 3) {
            ui.docActivateResults = [];
            showToast(bi('أدخل 3 أرقام على الأقل من رقم الهاتف للبحث', 'Enter at least 3 digits of the phone number'));
            renderApp();
            return;
          }
          ui.docActivateResults = (db.accounts || []).filter((acc) => {
            const accDigits = normalizePhoneDigits(acc.phone);
            return accDigits.includes(digitsQ) || digitsQ.includes(accDigits);
          });
          renderApp();
        }

        const docActSearchBtn = document.getElementById('btnDocActivateSearch');
        const docActInp = document.getElementById('docActivatePhoneInput');
        if (docActSearchBtn) docActSearchBtn.onclick = runDoctorPatientSearch;
        if (docActInp) {
          docActInp.onkeydown = function (e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              runDoctorPatientSearch();
            }
          };
        }

        document.querySelectorAll('[data-doc-activate-acc]').forEach((btn) => {
          btn.onclick = function () {
            const accId = btn.getAttribute('data-doc-activate-acc');
            const target = (db.accounts || []).find((a) => a.id === accId);
            if (!target) return;
            const clinicSource = 'عيادة د. ' + String(doc.doctorName || '').replace(/^د\.?\s*/i, '').trim();
            markAccountVerified(target, clinicSource);
            saveState(db);
            syncAccountToCloudNow(target);
            ui.docActivateResults = (db.accounts || []).filter((acc) => {
              const digitsQ = normalizePhoneDigits(ui.docActivatePhoneQuery);
              const accDigits = normalizePhoneDigits(acc.phone);
              return digitsQ ? (accDigits.includes(digitsQ) || digitsQ.includes(accDigits)) : acc.id === target.id;
            });
            ui.docActivateSuccessMsg = bi(
              'تم تفعيل حساب ' + target.fullName + ' (' + target.phone + ') بنجاح بواسطة ' + clinicSource,
              'Activated ' + target.fullName + ' via ' + clinicSource
            );
            showToast(ui.docActivateSuccessMsg);
            renderApp();
          };
        });

        document.querySelectorAll('[data-doc-open-account-emr]').forEach((btn) => {
          btn.onclick = function () {
            openPatientEmrModalByAccountId(btn.getAttribute('data-doc-open-account-emr'));
          };
        });

        document.querySelectorAll('[data-doc-family-link]').forEach((btn) => {
          btn.onclick = function () {
            const acc = (db.accounts || []).find((a) => a.id === btn.getAttribute('data-doc-family-link'));
            if (acc) openFamilyLinkRequestModal(acc, 'عيادة ' + doc.doctorName);
          };
        });

        function applyDelay(mins) {
          doc.currentDelayMinutes += mins;
          db.slots.forEach((s) => {
            if (s.doctorId === doc.id && s.status !== 'COMPLETED') {
              s.delayMinutes += mins;
              if (s.status === 'BOOKED') {
                s.appointmentTimestamp = computeSlotAppointmentTimestampMs(s);
                s.reminded2h = false;
                s.reminded30m = false;
                cancelSlotRemindersWeb(s.id);
                scheduleSlotRemindersWeb(s, doc);
                syncDocToFirestoreNamespace('slots', s.id, s);
              }
            }
          });
          const delayMsg = 'تنبيه عاجل: تم تأخير مواعيد ' + doc.doctorName + ' (' + doc.clinicName + ') لمدة ' + mins + ' دقيقة (الإجمالي: ' + doc.currentDelayMinutes + ' دقيقة).';
          const delayNotif = {
            id: Date.now(),
            message: delayMsg,
            isRead: false,
            targetAudience: 'PATIENT',
            targetId: '',
            senderLabel: getClinicDisplayName(doc),
            createdAtMillis: Date.now()
          };
          db.notifications.unshift(delayNotif);
          saveState(db);
          syncDocToFirestoreNamespace('notifications', String(delayNotif.id), delayNotif);
          triggerPlatformNotification(getClinicDisplayName(doc), delayMsg, 'delay_' + doc.id);
          dispatchWorkerPush('CLINIC_DELAY', getClinicDisplayName(doc), delayMsg, 'PATIENT', '', CLOUD_PATHS.appointments);
          showToast(bi('تم تأخير المواعيد ' + mins + ' دقيقة وإرسال تنبيه فوري للمرضى', 'Delayed slots by ' + mins + ' min'));
          renderApp();
        }

        const delay15Btn = document.getElementById('btnDelay15');
        if (delay15Btn) delay15Btn.onclick = () => applyDelay(15);
        const delay30Btn = document.getElementById('btnDelay30');
        if (delay30Btn) delay30Btn.onclick = () => applyDelay(30);
        const schedGenBtn = document.getElementById('btnOpenScheduleGen');
        if (schedGenBtn) schedGenBtn.onclick = () => openScheduleGenModal(doc);

        document.querySelectorAll('[data-manual-slot]').forEach((btn) => {
          btn.onclick = () => openManualPhoneModal(btn.getAttribute('data-manual-slot'));
        });
        document.querySelectorAll('[data-write-rx]').forEach((btn) => {
          btn.onclick = () => openSmartPrescriptionModal(btn.getAttribute('data-write-rx'));
        });
        document.querySelectorAll('[data-view-emr]').forEach((btn) => {
          btn.onclick = () => openPatientEmrModal(btn.getAttribute('data-view-emr'));
        });
        document.querySelectorAll('[data-cancel-slot]').forEach((btn) => {
          btn.onclick = function () {
            executeCancelSlot(btn.getAttribute('data-cancel-slot'), 'CLINIC');
          };
        });
        document.querySelectorAll('[data-clinic-reschedule-slot]').forEach((btn) => {
          btn.onclick = function () {
            openRescheduleSlotModal(btn.getAttribute('data-clinic-reschedule-slot'), 'CLINIC');
          };
        });
        bindNotificationStatusCard(document);
      }

      // Top Header & Nav Global Listeners
      const langDropdownWrap = document.getElementById('langDropdownWrap');
      const langDropdownMenu = document.getElementById('langDropdownMenu');
      const langToggleBtn = document.getElementById('btnLangToggle');
      function closeLangDropdown() {
        if (langDropdownMenu) langDropdownMenu.classList.remove('open');
        if (langToggleBtn) langToggleBtn.setAttribute('aria-expanded', 'false');
      }
      document.getElementById('btnSmartRefresh').onclick = performSmartHardRefresh;
      const liveBannerBtn = document.getElementById('liveUpdateBanner');
      if (liveBannerBtn) liveBannerBtn.onclick = performSmartHardRefresh;
      langToggleBtn.onclick = function (e) {
        e.stopPropagation();
        const isOpen = langDropdownMenu.classList.toggle('open');
        langToggleBtn.setAttribute('aria-expanded', String(isOpen));
      };
      document.querySelectorAll('[data-set-lang]').forEach(function (item) {
        item.onclick = function (e) {
          e.stopPropagation();
          ui.lang = item.getAttribute('data-set-lang') === 'en' ? 'en' : 'ar';
          try { localStorage.setItem(LANG_KEY, ui.lang); } catch (err) {}
          closeLangDropdown();
          renderApp();
        };
      });
      document.addEventListener('click', function (e) {
        if (langDropdownWrap && !langDropdownWrap.contains(e.target)) {
          closeLangDropdown();
        }
      });
      document.getElementById('rolePatientBtn').onclick = function () {
        ui.roleMode = 'PATIENT';
        renderApp();
      };
      document.getElementById('roleDoctorBtn').onclick = function () {
        ui.roleMode = 'DOCTOR';
        renderApp();
      };
      document.getElementById('btnNotifications').onclick = openNotificationsModal;
      document.getElementById('btnAccount').onclick = function () { openAccountModal(); };

      // Secret 5-tap Super Admin Trigger exclusively on Header Brand Logo (#hdrBrandLogo)
      let adminLogoTapCount = 0;
      let adminLogoTapWindowStart = 0;
      const hdrBrandLogo = document.getElementById('hdrBrandLogo');
      if (hdrBrandLogo) {
        hdrBrandLogo.onclick = function () {
          const now = Date.now();
          if (now - adminLogoTapWindowStart > 3000) {
            adminLogoTapCount = 1;
            adminLogoTapWindowStart = now;
          } else {
            adminLogoTapCount += 1;
          }
          if (adminLogoTapCount >= 5) {
            adminLogoTapCount = 0;
            if (ui.isAdminLoggedIn) {
              ui.roleMode = 'ADMIN';
              try { localStorage.setItem(ADMIN_ROLE_ACTIVE_KEY, '1'); } catch (e) {}
              renderApp();
            } else {
              openAdminPinModal();
            }
          }
        };
      }

      document.getElementById('bottomNav').querySelectorAll('.nav-item').forEach((btn) => {
        btn.onclick = function () {
          ui.bookingDoctorId = null;
          ui.patientTab = btn.getAttribute('data-tab');
          if (ui.patientTab === 'SPECIALTIES') ui.selectedSpecialty = null;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      });

      // Smooth Escape Key Modal & Dropdown Closing
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeLangDropdown();
          const modalRoot = document.getElementById('modalRoot');
          if (modalRoot && modalRoot.innerHTML.trim() !== '') {
            closeModal();
          }
        }
      });

      // Instant Cross-Tab Real-Time Sync via LocalStorage events
      window.addEventListener('storage', function (e) {
        if (e.key === STORAGE_KEY) {
          db = loadState();
          baselineDbSyncSig = computeDbSyncSignature(db);
          renderApp();
        }
      });

      // Background Live Update & OTA Sync Checker (version.json + index.html every 25s & on visibility return)
      let baselineVersionSig = null;
      async function clearAllBrowserCachesSilently() {
        try {
          if ('caches' in window && caches.keys) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => {
              try {
                if (r.active) r.active.postMessage({ type: 'CLEAR_CACHES' });
                return r.update ? r.update().catch(() => {}) : Promise.resolve();
              } catch (err) { return Promise.resolve(); }
            }));
          }
        } catch (e) { /* ignore cache clear failure */ }
      }

      function tryAutoOtaReloadInsideApk() {
        if (!isInsideAndroidApk()) return false;
        try {
          const lastAuto = Number(sessionStorage.getItem('teb_last_auto_ota_ts') || '0');
          if (Date.now() - lastAuto < 15000) return false;
          sessionStorage.setItem('teb_last_auto_ota_ts', String(Date.now()));
        } catch (e) { /* ignore sessionStorage error */ }
        if (window.AndroidAppHost && typeof window.AndroidAppHost.clearCacheAndReload === 'function') {
          window.AndroidAppHost.clearCacheAndReload();
          return true;
        }
        try {
          window.location.reload();
          return true;
        } catch (e) { return false; }
      }

      async function checkForLivePlatformUpdates() {
        try {
          const latestDb = loadState();
          const nextDbSig = computeDbSyncSignature(latestDb);
          if (nextDbSig && baselineDbSyncSig && nextDbSig !== baselineDbSyncSig) {
            ui.hasNewDataBanner = true;
            updateHeader();
          }
          if (typeof fetch === 'function' && /^https?:$/i.test(window.location.protocol)) {
            let remoteUpdated = false;
            try {
              const verResp = await fetch('./version.json?_t=' + Date.now(), { cache: 'no-store' });
              if (verResp && verResp.ok) {
                const verJson = await verResp.json();
                const verSig = [verJson.version || '1.0.0', verJson.versionCode || 1, verJson.updatedAt || ''].join('|');
                if (!baselineVersionSig) {
                  baselineVersionSig = verSig;
                } else if (verSig !== baselineVersionSig) {
                  baselineVersionSig = verSig;
                  remoteUpdated = true;
                }
              }
            } catch (e) { /* ignore version.json fetch if offline */ }

            const resp = await fetch('./index.html?live_check=' + Date.now(), { cache: 'no-store' });
            if (resp && resp.ok) {
              const etag = resp.headers.get('etag') || '';
              const lastMod = resp.headers.get('last-modified') || '';
              const cLen = resp.headers.get('content-length') || '';
              const sig = etag || lastMod || cLen || String((await resp.text()).length);
              if (!baselineRemotePageSig) {
                baselineRemotePageSig = sig;
              } else if (sig && sig !== baselineRemotePageSig) {
                baselineRemotePageSig = sig;
                remoteUpdated = true;
              }
            }

            if (remoteUpdated) {
              await clearAllBrowserCachesSilently();
              if (!tryAutoOtaReloadInsideApk()) {
                ui.hasNewDataBanner = true;
                updateHeader();
              }
            }
          }
        } catch (e) { /* offline-safe ignore */ }
      }

      if (/^https?:$/i.test(window.location.protocol)) {
        setTimeout(checkForLivePlatformUpdates, 2000);
      }
      setInterval(function () {
        if (typeof document !== 'undefined' && document.visibilityState !== 'visible') return;
        checkForLivePlatformUpdates();
      }, 25000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          checkForLivePlatformUpdates();
          if (Date.now() - (tebCloudRuntime.lastPullAt || 0) >= 8000) {
            pullCloudStateViaRestWeb();
          }
        }
      });

      // Clear any stale legacy SW caches automatically while preserving clean v1.0.0 rev4 cache
      if ('caches' in window && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) {
            if (k !== 'teb-alhajayzah-v1.0.0-rev4') {
              caches.delete(k).catch(function () {});
            }
          });
        }).catch(function () {});
      }

      // Service Worker & Dynamic Firebase Cloud Messaging Registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').then(function (reg) {
            if (reg && reg.update) reg.update();
          }).catch(function () {});
          initFirebaseCloudBridge();
        });
      }

      // Initialize App, Record Real Web Hit & Real-Time Multi-Device Cloud Sync immediately on startup
      setGlobalLoading(true, bi('جاري تجهيز منصة طب الحجايزة...', 'Loading Teb Al-Hajayzah...'));
      pruneExpiredHeavyAttachmentsWeb(db);
      recordWebVisitorHitOnce();
      renderApp();
      startRealtimeCloudSync();
      setTimeout(checkUpcomingSlotRemindersWeb, 3000);
      setInterval(checkUpcomingSlotRemindersWeb, 30000);
      refreshMedicationsFromApi().finally(function () {
        setGlobalLoading(false);
        renderApp();
      });
    })();
  </script>
