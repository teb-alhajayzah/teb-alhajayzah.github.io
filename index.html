      function toAsciiDigits(raw) {
        return String(raw || '')
          .replace(/[\u0660-\u0669]/g, (c) => String(c.charCodeAt(0) - 0x0660))
          .replace(/[\u06F0-\u06F9]/g, (c) => String(c.charCodeAt(0) - 0x06F0));
      }

      function normalizePhoneDigits(phone) {
        const digits = toAsciiDigits(phone).replace(/\D/g, '');
        if (digits.startsWith('0020') && digits.length >= 14) return '0' + digits.slice(4);
        if (digits.startsWith('20') && digits.length >= 12) return '0' + digits.slice(2);
        return digits;
      }

      function isPhoneBlocked(phone) {
        const target = normalizePhoneDigits(phone);
        if (!target) return false;
        return (db.blockedPhones || []).some((b) => normalizePhoneDigits(b.phone) === target);
      }

      function verifyAdminPinAttempt(enteredPin) {
        const now = Date.now();
        const sec = db.adminSecurity || { failedAttempts: 0, lockoutUntilMillis: 0 };
        if (sec.lockoutUntilMillis > now) {
          const remMin = Math.ceil((sec.lockoutUntilMillis - now) / 60000);
          return {
            ok: false,
            locked: true,
            error: bi(
              'تم قفل بوابة الإدارة مؤقتاً بسبب 3 محاولات خاطئة. حاول بعد ' + remMin + ' دقيقة.',
              'Admin portal is temporarily locked after 3 failed attempts. Try again in ' + remMin + ' min.'
            )
          };
        }
        const expectedPin = (db.config.adminPin || DEFAULT_CONFIG.adminPin || '202600').trim();
        if (toAsciiDigits(enteredPin).trim() === expectedPin) {
          db.adminSecurity = { failedAttempts: 0, lockoutUntilMillis: 0 };
          saveState(db);
          return { ok: true };
        }
        const currentFails = (sec.lockoutUntilMillis > 0 && sec.lockoutUntilMillis <= now) ? 0 : (sec.failedAttempts || 0);
        const nextFails = currentFails + 1;
        if (nextFails >= MAX_ADMIN_PIN_ATTEMPTS) {
          db.adminSecurity = { failedAttempts: nextFails, lockoutUntilMillis: now + ADMIN_LOCKOUT_MILLIS };
          saveState(db);
          return {
            ok: false,
            locked: true,
            error: bi(
              'تم إدخال رقم سري خاطئ 3 مرات. تم قفل الإدارة لمدة 15 دقيقة.',
              '3 failed PIN attempts. Admin access locked for 15 minutes.'
            )
          };
        }
        db.adminSecurity = { failedAttempts: nextFails, lockoutUntilMillis: 0 };
        saveState(db);
        const left = MAX_ADMIN_PIN_ATTEMPTS - nextFails;
        return {
          ok: false,
          locked: false,
          error: bi(
            'الرقم السري غير صحيح. المحاولات المتبقية قبل القفل: ' + left,
            'Incorrect PIN. Remaining attempts before lockout: ' + left
          )
        };
      }

      function copyTextToClipboard(text, onDone) {
        const str = String(text || '');
        if (!str) return;
        if (typeof navigator !== 'undefined' && navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(str).then(function () {
            if (onDone) onDone(true);
          }).catch(function () {
            fallbackCopyText(str, onDone);
          });
        } else {
          fallbackCopyText(str, onDone);
        }
      }

      function fallbackCopyText(str, onDone) {
        try {
          const ta = document.createElement('textarea');
          ta.value = str;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (onDone) onDone(Boolean(ok));
        } catch (e) {
          if (onDone) onDone(false);
        }
      }

      function verifyAndBurnActivationCode(account, rawCode, nowOverride) {
        const now = typeof nowOverride === 'number' ? nowOverride : Date.now();
        const clean = toAsciiDigits(rawCode).replace(/\D/g, '');
        if (clean.length !== 6) {
          return { ok: false, error: bi('يرجى إدخال كود التفعيل المكون من 6 أرقام', 'Please enter the 6-digit OTP code') };
        }
        if (clean === MASTER_ADMIN_OTP) {
          markAccountVerified(account, 'كود OTP');
          saveState(db);
          return { ok: true, usedMaster: true };
        }

        // 1) Check the unique 24-hour OTP code bound to this specific user account
        const boundAccount = account
          ? ((db.accounts || []).find((a) => a.id === account.id) || account)
          : null;
        if (boundAccount && boundAccount.otpCode) {
          const boundCode = toAsciiDigits(boundAccount.otpCode).replace(/\D/g, '');
          if (boundCode === clean) {
            if (boundAccount.otpUsed) {
              return {
                ok: false,
                error: bi(
                  'تم استخدام هذا الكود من قبل. إذا احتجت كوداً جديداً اضغط "توليد كود جديد".',
                  'This code has already been used. Click "Generate New Code" if needed.'
                )
              };
            }
            if (!boundAccount.otpExpiresAtMillis || now > boundAccount.otpExpiresAtMillis) {
              return {
                ok: false,
                expired: true,
                error: bi(
                  'انتهت صلاحية كود التفعيل الخاص بحسابك (مرت أكثر من 24 ساعة). اضغط على زر "توليد كود جديد".',
                  'Your account activation code has expired (> 24 hours). Click "Generate New Code".'
                )
              };
            }
            boundAccount.otpUsed = true;
            markAccountVerified(boundAccount, 'كود OTP');
            saveState(db);
            return { ok: true, usedMaster: false, usedUserOtp: true };
          }
        }

        // 2) Fallback: Check shared Admin batch single-use codes pool
        const codes = db.activationCodes || [];
        const found = codes.find((c) => toAsciiDigits(c.code).replace(/\D/g, '') === clean);
        if (!found) {
          return { ok: false, error: bi('كود التفعيل غير صحيح أو غير مطابق لكود حسابك. تأكد من الكود أو تواصل على واتساب.', 'Verification code does not match your account code. Contact Admin on WhatsApp.') };
        }
        if (found.isUsed) {
          return {
            ok: false,
            error: bi(
              'هذا الكود تم استخدامه بالفعل ومنتهي الصلاحية' + (found.usedByName ? ' (' + found.usedByName + ')' : '') + '، ولا يمكن إعادة استخدامه.',
              'This code has already been used and expired.'
            )
          };
        }
        found.isUsed = true;
        found.usedByName = (account && account.fullName) ? account.fullName : bi('مريض', 'Patient');
        found.usedByPhone = (account && account.phone) ? account.phone : '';
        found.usedAtMillis = now;
        markAccountVerified(account, 'كود OTP');
        saveState(db);
        return { ok: true, usedMaster: false };
      }

      function formatMinutesAr(totalMinutes) {
        const norm = ((totalMinutes % 1440) + 1440) % 1440;
        const h24 = Math.floor(norm / 60);
        const m = norm % 60;
        const period = ui.lang === 'en' ? (h24 >= 12 ? 'PM' : 'AM') : (h24 >= 12 ? 'م' : 'ص');
        const h12 = h24 === 0 ? 12 : (h24 > 12 ? h24 - 12 : h24);
        return h12 + ':' + (m < 10 ? '0' + m : m) + ' ' + period;
      }

            await Promise.all(regs.map((r) => {
              try {
                if (r.active) r.active.postMessage({ type: 'CLEAR_CACHES' });
                if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });
                return r.update ? r.update().catch(() => {}) : Promise.resolve();

      function isInsideAndroidApk() {
        try {
          if (

            typeof window.AndroidPdfBridge !== 'undefined' ||
            typeof window.AndroidAiBridge !== 'undefined'
          ) {
            return true;
          }
          const ua = (typeof navigator !== 'undefined' && navigator.userAgent) ? String(navigator.userAgent) : '';
          if (/TebAlHajayzahAPK/i.test(ua) || /;\s*wv\)/i.test(ua)) {
            return true;
          }
          if (/\bAndroid\b/i.test(ua) && /\bVersion\/\d/i.test(ua) && !/\bChrome\/\d+.*Mobile Safari/i.test(ua)) {
            return true;
          }
          const search = (typeof window !== 'undefined' && window.location && window.location.search) ? String(window.location.search) : '';
          if (/[?&](?:inApp|apk|webview)=1\b/i.test(search)) {
            return true;
          }
        } catch (e) { /* safe fallback */ }
        return false;
      }

      function compareVersionStrings(a, b) {
        const pa = String(a || '1.0.0').replace(/^v/i, '').split('.').map((n) => parseInt(n, 10) || 0);
        const pb = String(b || '1.0.0').replace(/^v/i, '').split('.').map((n) => parseInt(n, 10) || 0);
        const len = Math.max(pa.length, pb.length);
        for (let i = 0; i < len; i++) {
          const va = pa[i] || 0;
          const vb = pb[i] || 0;
          if (va > vb) return 1;
          if (va < vb) return -1;
        }
        return 0;

        const targetFileName = 'طب الحجايزة.apk';
        if (isInsideAndroidApk() && window.AndroidAppHost && typeof window.AndroidAppHost.downloadAndInstallApk === 'function') {
          window.AndroidAppHost.downloadAndInstallApk(downloadUrl);
          return;
        }
        let triggeredSameOrigin = false;
        try {
          const resolved = new URL(downloadUrl, window.location.href);
          if (resolved.origin === window.location.origin) {
            const tempLink = document.createElement('a');
            tempLink.href = resolved.href;
            tempLink.setAttribute('download', targetFileName);
            tempLink.style.display = 'none';
            document.body.appendChild(tempLink);
            tempLink.click();
            document.body.removeChild(tempLink);
            triggeredSameOrigin = true;
          }
        } catch (e) { /* fallback to hidden frame */ }

        if (!triggeredSameOrigin) {
          const oldFrame = document.getElementById('apkDownloadFrame');
          if (oldFrame && oldFrame.parentNode) {
            oldFrame.parentNode.removeChild(oldFrame);
          }
          const frame = document.createElement('iframe');
          frame.id = 'apkDownloadFrame';
          frame.title = 'تحميل تطبيق طب الحجايزة';
          frame.setAttribute('aria-hidden', 'true');
          frame.tabIndex = -1;
          frame.style.cssText = 'display:none;width:0;height:0;border:0;position:absolute;left:-9999px;';
          frame.src = downloadUrl;
          document.body.appendChild(frame);
        }
      }

      async function handleFooterAppAction(customUrl) {
        const fallbackUrl = (customUrl && String(customUrl).trim()) || DEFAULT_CONFIG.apkDownloadUrl;
        const inApk = isInsideAndroidApk();
        const installedVersion = (
          window.AndroidAppHost &&
          typeof window.AndroidAppHost.getAppVersion === 'function'
        )
          ? String(window.AndroidAppHost.getAppVersion() || '1.0.0')
          : String((db.config.appVersionLabel || 'v1.0.0').replace(/^v/i, ''));
        const installedCode = (
          window.AndroidAppHost &&
          typeof window.AndroidAppHost.getAppVersionCode === 'function'
        )
          ? Number(window.AndroidAppHost.getAppVersionCode() || 1)
          : 1;

        if (inApk) {
          showFooterApkNotice(
            bi('جاري التحقق من التحديثات عبر version.json وتحديث الكاش...', 'Checking version.json for updates & syncing cache...'),
            '🔄'
          );
          let hasNewer = false;
          let latestVersion = installedVersion;
          let targetDownloadUrl = fallbackUrl;
          try {
            if (typeof fetch === 'function' && /^https?:$/i.test(window.location.protocol)) {
              const verResp = await fetch('./version.json?_t=' + Date.now(), { cache: 'no-store' });
              if (verResp && verResp.ok) {
                const verJson = await verResp.json();
                latestVersion = String(verJson.version || verJson.versionName || '1.0.0').replace(/^v/i, '');
                const remoteCode = Number(verJson.versionCode || 1);
                if (verJson.apkDownloadUrl) {
                  targetDownloadUrl = String(verJson.apkDownloadUrl).trim() || fallbackUrl;
                }
                if (remoteCode > installedCode || compareVersionStrings(latestVersion, installedVersion) > 0) {
                  hasNewer = true;
                }
              }
            }
          } catch (e) { /* offline-safe check */ }

          await syncSiteDataAndCacheInPage();
          if (window.AndroidAppHost && typeof window.AndroidAppHost.clearCacheOnly === 'function') {
            window.AndroidAppHost.clearCacheOnly();
          }
          updateHeader();

          if (hasNewer) {
            showFooterApkNotice(
              bi(
                'يتوفر إصدار جديد (v' + latestVersion + ') — جاري التحميل والتثبيت فوراً...',
                'New version available (v' + latestVersion + ') — Downloading & installing...'
              ),
              '⬇️'
            );
            triggerDirectApkFileDownload(targetDownloadUrl);
          } else {
            const upToDateLabel = 'v' + installedVersion.replace(/^v/i, '');
            showFooterApkNotice(
              bi(
                'أنت تستخدم أحدث إصدار بالفعل (' + upToDateLabel + ') ✓',
                'You are already using the latest version (' + upToDateLabel + ') ✓'
              ),
              '✅'
            );
          }
          return;
        }

        // في المتصفح: التحميل المباشر لملف 'طب الحجايزة.apk' + مسح الكاش وتحديث بيانات الصفحة
        startBackgroundApkDownload(fallbackUrl);
      }

      async function refreshMedicationsFromApi() {
        const url = (db.config.medicationsApiUrl || '').trim();
        if (!url) {
          ui.medications = BUILTIN_MEDICATIONS.slice();
          ui.isLiveMedsApi = false;
          return;
        }
        try {
          const res = await fetch(url, { headers: { Accept: 'application/json' } });
          if (res.ok) {
            const json = await res.json();
            const arr = Array.isArray(json) ? json : (json.medications || json.data || []);
            if (Array.isArray(arr) && arr.length > 0) {
              ui.medications = arr.map((item, idx) => ({
                id: item.id || ('remote_' + idx),
                tradeName: item.tradeName || item.name || 'دواء',
                activeIngredient: item.activeIngredient || item.generic || 'مادة فعالة',
                strength: item.strength || item.concentration || '',
                specialty: item.specialty || 'باطنة وجهاز هضمي',
                form: item.form || 'أقراص',
                defaultDosage: item.defaultDosage || 'حسب إرشادات الطبيب'
              }));
              ui.isLiveMedsApi = true;
              return;
            }
          }
        } catch (e) { /* offline fallback */ }
        ui.medications = BUILTIN_MEDICATIONS.slice();
        ui.isLiveMedsApi = false;
      }

      function renderDirectory(title, clinicTypeFilter, showSpecChips) {
        const q = ui.searchQuery.trim().toLowerCase();
        const filtered = db.doctors.filter((doc) => {
          const matchType = !clinicTypeFilter || doc.clinicType === clinicTypeFilter;
          const matchSpec = !showSpecChips || !ui.selectedSpecialty || doctorMatchesSpecialty(doc, ui.selectedSpecialty);
          const allSpecsCombined = allDoctorSpecialties(doc)
            .map((s) => displaySpecialty(s, false) + ' ' + displaySpecialty(s, true))
            .join(' ')
            .toLowerCase();
          const matchQ = !q ||
            doc.doctorName.toLowerCase().includes(q) ||
            (doc.doctorNameEn || '').toLowerCase().includes(q) ||
            doc.clinicName.toLowerCase().includes(q) ||
            (doc.clinicNameEn || '').toLowerCase().includes(q) ||
            allSpecsCombined.includes(q);
          return matchType && matchSpec && matchQ;
        });

        return '<section>' +
            '<h2 style="margin-bottom:10px;">' + esc(title) + '</h2>' +
            '<input class="input" id="dirSearchInput" type="search" placeholder="' + esc(bi('ابحث باسم الدكتور أو التخصص أو العيادة...', 'Search by doctor name, specialty, or clinic...')) + '" value="' + esc(ui.searchQuery) + '" />' +

      function openBookConfirmModal(slotId) {
        const slot = db.slots.find((s) => s.id === slotId);
        if (!slot || slot.status !== 'AVAILABLE') {
          showToast(bi('عذراً، تم حجز هذا الموعد للتو', 'Sorry, this slot was just booked'));
          renderApp();
          return;
        }
        const member = getActiveMember();
        if (!db.account || !member) {
          showToast(bi('يرجى إنشاء حساب أو تسجيل الدخول وتأكيد الهاتف أولاً', 'Please create an account or sign in first'));
          openAccountModal('REGISTER');
          return;
        }
        if (isPhoneBlocked(db.account.phone) || isPhoneBlocked(member.phone)) {
          showToast(bi('عذراً، هذا الرقم محظور من الحجز عبر المنصة', 'Sorry, this phone number is blocked'));
          return;
        }
        if (db.account.isPhoneVerified === false) {
          showToast(bi('يرجى إدخال رمز التحقق (OTP) المكون من 6 أرقام أولاً لمنع الحجوزات الوهمية', 'Please verify the 6-digit OTP code first before booking'));
          openAccountModal();
          return;
        }
        const doc = db.doctors.find((d) => d.id === slot.doctorId);
        openModal(bi('تأكيد حجز الموعد', 'Confirm Appointment'),
          '<div><strong>' + esc(bi('الطبيب:', 'Doctor:')) + '</strong> ' + esc(doc.doctorName) + '</div>' +
          '<div><strong>' + esc(bi('العيادة:', 'Clinic:')) + '</strong> ' + esc(doc.clinicName) + '</div>' +
          '<div><strong>' + esc(bi('الموعد:', 'Time:')) + '</strong> ' + formatMinutesAr(slot.startMinutes + slot.delayMinutes) + '</div>' +
          '<div><strong>' + esc(bi('اسم المريض:', 'Patient:')) + '</strong> ' + esc(member.fullName) + '</div>' +
          '<div style="color:var(--text-muted);font-size:0.86rem;">' + esc(bi('سيتم إغلاق الموعد فوراً باللون الأحمر عند تأكيد الحجز لمنع التضارب.', 'This slot will immediately turn red once confirmed to prevent conflicts.')) + '</div>' +
          '<button class="btn btn-green btn-block" id="btnConfirmBook" type="button">✓ ' + esc(bi('تأكيد الحجز الآن', 'Confirm Booking')) + '</button>',
          function () {
            let isSubmittingBook = false;
            const confirmBtn = document.getElementById('btnConfirmBook');
            confirmBtn.onclick = function () {
              if (isSubmittingBook) return;
              isSubmittingBook = true;
              confirmBtn.disabled = true;
              confirmBtn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span> ' + esc(bi('جاري تأكيد الحجز...', 'Booking...'));

              setTimeout(function () {
                db = loadState();
                const latestSlot = db.slots.find((s) => s.id === slot.id);
                if (!latestSlot || latestSlot.status !== 'AVAILABLE') {
                  isSubmittingBook = false;
                  closeModal();
                  showToast(bi('عذراً، تم حجز هذا الموعد للتو', 'Sorry, this slot was just booked'));
                  renderApp();
                  return;
                }
                if (isPhoneBlocked(db.account.phone) || isPhoneBlocked(member.phone)) {
                  isSubmittingBook = false;
                  closeModal();
                  showToast(bi('عذراً، هذا الرقم محظور من الحجز عبر المنصة', 'Sorry, this phone number is blocked'));
                  return;
                }
                latestSlot.status = 'BOOKED';
                latestSlot.patientName = member.fullName;
                latestSlot.patientPhone = member.phone;

      function openAdminPinModal() {
        function renderPinBody() {
          const now = Date.now();
          const sec = db.adminSecurity || { failedAttempts: 0, lockoutUntilMillis: 0 };
          const isLocked = sec.lockoutUntilMillis > now;
          const remSecs = isLocked ? Math.ceil((sec.lockoutUntilMillis - now) / 1000) : 0;
          const mins = Math.floor(remSecs / 60);
          const secs = remSecs % 60;
          const countdownLabel = (mins < 10 ? '0' + mins : mins) + ':' + (secs < 10 ? '0' + secs : secs);

          return (
            '<div class="card" style="background:var(--teal-soft);border:none;padding:12px;">' +
              '<div style="font-weight:800;color:var(--teal-text);">🛡️ ' + esc(bi('بوابة الإدارة العليا المحمية', 'Protected Super Admin Portal')) + '</div>' +

            '</div>' +
            (isLocked
              ? '<div class="alert-banner" style="background:var(--booked-bg);border-color:var(--booked-border);color:var(--booked-text);">' +
                  '🔒 ' + esc(bi('تم قفل الدخول لمدة 15 دقيقة بعد 3 محاولات خاطئة. الوقت المتبقي:', 'Locked for 15 minutes after 3 wrong attempts. Remaining:')) + ' <strong id="pinLockCountdown" dir="ltr">' + countdownLabel + '</strong>' +
                '</div>'
              : renderPasswordFieldHtml('adminPinInput', '', bi('أدخل الرقم السري للإدارة (Admin PIN)', 'Enter Admin PIN'), 'inputmode="numeric"') +
                (sec.failedAttempts > 0
                  ? '<div style="color:var(--booked-border);font-size:0.84rem;font-weight:700;">' + esc(bi('تنبيه: المحاولات المتبقية قبل القفل (15 دقيقة): ', 'Warning: Remaining attempts before 15-min lock: ')) + Math.max(0, MAX_ADMIN_PIN_ATTEMPTS - sec.failedAttempts) + '</div>'
                  : '') +
                '<button class="btn btn-primary btn-block" id="btnVerifyAdminPin" type="button">🔓 ' + esc(bi('فتح لوحة التحكم', 'Unlock Dashboard')) + '</button>')
          );
        }

        function mountPinHandlers() {
          const now = Date.now();
          const sec = db.adminSecurity || { failedAttempts: 0, lockoutUntilMillis: 0 };
          if (sec.lockoutUntilMillis > now) {
            modalIntervalTimer = setInterval(function () {
              const rem = Math.ceil((db.adminSecurity.lockoutUntilMillis - Date.now()) / 1000);
              const el = document.getElementById('pinLockCountdown');
              if (rem <= 0) {
                clearInterval(modalIntervalTimer);
                modalIntervalTimer = null;
                const body = document.getElementById('modalBody');
                if (body) {
                  body.innerHTML = renderPinBody();
                  mountPinHandlers();
                  bindPasswordToggleButtons(body);
                }
              } else if (el) {
                const m = Math.floor(rem / 60);
                const s = rem % 60;
                el.textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
              }
            }, 1000);
            return;
          }

          const inp = document.getElementById('adminPinInput');
          const btn = document.getElementById('btnVerifyAdminPin');
          function submitPin() {
            const res = verifyAdminPinAttempt(inp ? inp.value : '');
            if (res.ok) {
              ui.isAdminLoggedIn = true;
              ui.roleMode = 'ADMIN';
              closeModal();
              showToast(bi('تم فتح لوحة تحكم الإدارة العليا بنجاح', 'Super Admin dashboard unlocked'));
              renderApp();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
              showToast(res.error);
              const body = document.getElementById('modalBody');
              if (body) {
                body.innerHTML = renderPinBody();
                mountPinHandlers();
                bindPasswordToggleButtons(body);
              }
            }
          }
          if (btn) btn.onclick = submitPin;
          if (inp) {
            inp.focus();
            inp.onkeydown = function (e) { if (e.key === 'Enter') submitPin(); };
          }
        }

        openModal(bi('التحقق الأمني للإدارة العليا (PIN)', 'Super Admin Security Check (PIN)'), renderPinBody(), mountPinHandlers);
      }

        let extAttachment = { dataUrl: '', mimeType: '', fileName: '' };

          const box = document.getElementById('extMedsContainer');

          box.innerHTML = medRows.map((row, idx) =>
            '<div class="card" style="padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:6px;">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                '<strong style="font-size:0.84rem;">💊 ' + esc(bi('دواء #' + (idx + 1), 'Medication #' + (idx + 1))) + '</strong>' +

                  ? '<button class="chip" type="button" data-del-ext-med="' + idx + '" style="min-height:28px;padding:2px 8px;color:var(--booked-border);">' + esc(bi('حذف', 'Remove')) + '</button>'
                  : '') +
              '</div>' +
              '<input class="input" data-ext-med-field="name" data-idx="' + idx + '" value="' + esc(row.name) + '" placeholder="' + esc(bi('اسم الدواء (مثال: أوجمنتين 1 جم)', 'Medication name')) + '" />' +
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">' +
                '<input class="input" data-ext-med-field="dose" data-idx="' + idx + '" value="' + esc(row.dose) + '" placeholder="' + esc(bi('الجرعة (مثال: قرص كل 12 س)', 'Dosage')) + '" />' +
                '<input class="input" data-ext-med-field="duration" data-idx="' + idx + '" value="' + esc(row.duration) + '" placeholder="' + esc(bi('المدة (مثال: 7 أيام)', 'Duration')) + '" />' +
              '</div>' +
            '</div>'
          ).join('');

          box.querySelectorAll('[data-ext-med-field]').forEach((inp) => {
            inp.oninput = function () {
              const i = parseInt(inp.getAttribute('data-idx'), 10);
              const f = inp.getAttribute('data-ext-med-field');
              if (medRows[i]) medRows[i][f] = inp.value;
            };
          });
          box.querySelectorAll('[data-del-ext-med]').forEach((btn) => {
            btn.onclick = function () {
              medRows.splice(parseInt(btn.getAttribute('data-del-ext-med'), 10), 1);
              renderMedRows();
            };
          });

        openModal(
          bi('تسجيل زيارة طبيب خارجي / خاص — ', 'Log External / Private Doctor Visit — ') + member.fullName,
          '<div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:8px;">' +

            '</select>' +
          '</label>' +
          '<input class="input" id="extDiagnosis" placeholder="' + esc(bi('التشخيص أو خلاصة الكشف *', 'Diagnosis or Visit Summary *')) + '" />' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px;">' +
            '<h4>' + esc(bi('الأدوية الموصوفة', 'Prescribed Medications')) + '</h4>' +
            '<button class="btn btn-outline" id="btnAddExtMedRow" type="button" style="min-height:36px;padding:4px 12px;">' + esc(bi('إضافة دواء +', '+ Add Med')) + '</button>' +
          '</div>' +

            esc(bi('إرفاق صورة الروشتة أو ملف PDF (اختياري)', 'Attach Prescription Photo or PDF (optional)')) +

              medRows.push({ name: '', dose: '', duration: '' });

            document.getElementById('extAttachmentInput').onchange = function (e) {
              const file = e.target.files[0];
              if (!file) return;
              readAttachmentWithCompression(file, function (res) {
                extAttachment = res;
                const prev = document.getElementById('extAttachmentPreview');
                if (prev) {
                  prev.innerHTML = res.mimeType === 'application/pdf'
                    ? '📑 ' + esc(bi('تم إرفاق ملف PDF: ', 'PDF attached: ')) + esc(res.fileName)

              const specialty = document.getElementById('extSpecialty').value || 'تخصصات أخرى';

              const notes = document.getElementById('extNotes').value.trim();

              if (!docName || !diagnosis) {
                showToast(bi('يرجى إدخال اسم الطبيب والتشخيص الطبي', 'Please enter doctor name and diagnosis'));
                return;
              }

              const formattedMeds = medRows
                .filter((r) => r.name.trim())
                .map((r) => {
                  const detail = [r.dose.trim(), r.duration.trim()].filter(Boolean).join(' • ');
                  return '• ' + r.name.trim() + (detail ? ' — ' + detail : '');
                })
                .join('\n');

              const bundle = BilingualMedicalTranslator.buildBilingualBundle({
                patientName: member.fullName,
                doctorName: docName,
                specialty: specialty + ' (زيارة خارجية)',
                diagnosisInput: diagnosis,
                medicationsInput: formattedMeds,
                notesInput: notes
              });

              const newExtRecId = 'ext_' + Date.now();
              db.records.unshift({
                id: newExtRecId,
                familyMemberId: member.id,
                patientName: member.fullName,
                patientPhone: member.phone,
                doctorId: '',
                doctorName: docName,
                specialty: specialty + ' (زيارة خارجية)',
                visitDateLabel: visitDate,
                diagnosis: bundle.diagnosisAr,
                medications: bundle.medicationsAr || formattedMeds,
                notes: bundle.notesAr || notes,
                diagnosisEn: bundle.diagnosisEn,
                medicationsEn: bundle.medicationsEn,
                notesEn: bundle.notesEn,
                aiReportAr: bundle.aiReportAr,
                aiReportEn: bundle.aiReportEn,
                attachmentDataUrl: extAttachment.dataUrl || '',
                attachmentMimeType: extAttachment.mimeType || '',
                attachmentName: extAttachment.fileName || '',
                extractedText: extAttachment.extractedText || '',
                recordType: 'EXTERNAL_VISIT',
                createdAtMillis: Date.now()
              });
              saveState(db);
              closeModal();
              showToast(bi('تم حفظ زيارة الطبيب الخارجي وجاري تحديث الملخص الطبي', 'External visit saved; updating AI summary'));
              renderApp();
              refreshMemberAiSummaryAsync(member.id, newExtRecId);
            };
          }
        );
      }

      function openSmartPrescriptionModal(slotId) {
        const slot = db.slots.find((s) => s.id === slotId);
        const doc = db.doctors.find((d) => d.id === slot.doctorId);
        const docMedKeys = medicationCatalogKeysForDoctor(doc);
        let filterMode = 'SPECIALTY';
        let medQuery = '';
        let selectedRx = [];
        let rxAttachmentUrl = '';

        function renderRxModalBody() {
          const favSet = new Set(db.doctorFavorites[doc.id] || []);
          const q = medQuery.trim().toLowerCase();
          const filteredMeds = ui.medications.filter((m) => {
            const matchQ = !q ||
              m.tradeName.toLowerCase().includes(q) ||
              m.activeIngredient.toLowerCase().includes(q) ||
              m.strength.toLowerCase().includes(q);
            if (filterMode === 'FAV') return favSet.has(m.id) && matchQ;
            if (q) return matchQ;
            if (filterMode === 'SPECIALTY') return docMedKeys.size === 0 || docMedKeys.has(m.specialty) || m.specialty === doc.specialty;
            return true;
          });

          document.getElementById('rxCatalogContainer').innerHTML = filteredMeds.length === 0
            ? '<div style="text-align:center;padding:16px;color:var(--text-muted);">' + esc(bi('لا توجد أدوية مطابقة', 'No matching medications')) + '</div>'
            : filteredMeds.map((m) => {
                const isFav = favSet.has(m.id);
                const isAdded = selectedRx.some((x) => x.id === m.id);
                return '<div class="med-item-row">' +
                  '<div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">' +
                    '<button class="chip" type="button" data-fav-med="' + esc(m.id) + '" style="min-height:36px;padding:4px 8px;">' + (isFav ? '⭐' : '☆') + '</button>' +
                    '<div style="min-width:0;">' +
                      '<div style="font-weight:700;font-size:0.92rem;">' + esc(m.tradeName) + '</div>' +
                      '<div style="font-size:0.8rem;color:var(--teal);font-weight:600;">' + esc(m.activeIngredient) + ' • ' + esc(m.strength) + '</div>' +
                    '</div>' +
                  '</div>' +
                  '<button class="btn ' + (isAdded ? 'btn-green' : 'btn-primary') + '" type="button" data-add-med="' + esc(m.id) + '" style="min-height:36px;padding:4px 10px;font-size:0.84rem;" ' + (isAdded ? 'disabled' : '') + '>' +
                    (isAdded ? '✓' : '+ ' + esc(bi('إضافة', 'Add'))) +
                  '</button>' +

                  '</div>' +
                  '<input class="input" data-edit-dose="' + idx + '" value="' + esc(item.dosage) + '" placeholder="' + esc(bi('الجرعة وطريقة الاستخدام', 'Dosage instructions')) + '" />' +
                  '<div class="chips-row" style="margin-top:6px;">' +

                      '<button class="chip" type="button" data-preset-idx="' + idx + '" data-preset-val="' + esc(p) + '" style="min-height:30px;padding:4px 8px;font-size:0.78rem;">' + esc(p) + '</button>'
                    ).join('') +
                  '</div>' +
                '</div>'

          document.querySelectorAll('[data-fav-med]').forEach((btn) => {
            btn.onclick = function () {
              const medId = btn.getAttribute('data-fav-med');
              const arr = db.doctorFavorites[doc.id] || [];
              const idx = arr.indexOf(medId);
              if (idx >= 0) arr.splice(idx, 1); else arr.push(medId);
              db.doctorFavorites[doc.id] = arr;
              saveState(db);
              renderRxModalBody();

            btn.onclick = function () {
              const m = ui.medications.find((x) => x.id === btn.getAttribute('data-add-med'));

      function downloadAttachmentFile(fileObj) {
        if (!fileObj || !fileObj.attachmentDataUrl) {
          showToast(bi('لا يوجد ملف متاح للتحميل', 'No file available to download'));
          return;
        }
        const safeName = fileObj.attachmentName || (fileObj.attachmentMimeType === 'application/pdf' ? 'medical_report.pdf' : 'medical_attachment.jpg');
        const mimeType = fileObj.attachmentMimeType || (String(fileObj.attachmentDataUrl).indexOf('data:application/pdf') === 0 ? 'application/pdf' : 'image/jpeg');

        if (window.AndroidPdfBridge && typeof window.AndroidPdfBridge.saveBase64File === 'function') {
          try {
            window.AndroidPdfBridge.saveBase64File(fileObj.attachmentDataUrl, mimeType, safeName);
            showToast(bi('تم حفظ الملف في مجلد التنزيلات: ' + safeName, 'Saved to Downloads: ' + safeName));
            return;
          } catch (e) { /* fall back to browser blob download */ }
        }

        const blob = dataUrlToBlob(fileObj.attachmentDataUrl, mimeType);
        if (!blob) {
          showToast(bi('تعذر تجهيز الملف للتحميل', 'Unable to prepare file download'));
          return;
        }
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = safeName;
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () {
          try { URL.revokeObjectURL(blobUrl); } catch (e) {}
        }, 6000);
        showToast(bi('جاري تحميل الملف: ' + safeName, 'Downloading file: ' + safeName));
      }

      function executeDeleteRecordFile(recId) {
        const idx = (db.records || []).findIndex((r) => r.id === recId);
        if (idx < 0) return;
        const rec = db.records[idx];
        const affectedMemberId = rec.familyMemberId || '';
        if (rec.recordType === 'PATIENT_UPLOAD' || rec.recordType === 'LAB_RESULT') {
          db.records.splice(idx, 1);
        } else {
          rec.attachmentDataUrl = '';
          rec.attachmentMimeType = '';
          rec.attachmentName = '';
          rec.extractedText = '';
        }
        saveState(db);
        showToast(bi('تم حذف الملف وتحديث الملخص الطبي بنجاح', 'File deleted & AI summary refreshed'));
        renderApp();
        if (affectedMemberId) {
          refreshMemberAiSummaryAsync(affectedMemberId, null);
        }
      }

        if (!isPdf) {
          openModal(

        }

        const blob = dataUrlToBlob(rec.attachmentDataUrl, 'application/pdf');
        const blobUrl = blob ? URL.createObjectURL(blob) : '';
        if (blobUrl) activeModalBlobUrls.push(blobUrl);

        openModal(
          safeName,
          '<div class="pdf-viewer-toolbar">' +
            '<button class="btn btn-primary" id="btnModalDownloadPdf" type="button" style="flex:1;">⬇️ ' + esc(bi('تحميل ملف التحليل (PDF)', 'Download PDF Report')) + '</button>' +
            '<button class="btn btn-danger-outline" id="btnModalDeletePdf" type="button">🗑️ ' + esc(bi('حذف الملف', 'Delete File')) + '</button>' +
          '</div>' +
          '<div id="pdfRenderStatus" style="font-size:0.84rem;color:var(--teal-text);font-weight:700;">⏳ ' + esc(bi('جاري تحميل ومعالجة صفحات الـ PDF...', 'Rendering PDF pages...')) + '</div>' +
          '<div id="pdfCanvasList" class="pdf-canvas-list"></div>' +
          (rec.extractedText
            ? '<details style="margin-top:4px;"><summary style="cursor:pointer;font-weight:700;color:var(--teal-text);font-size:0.86rem;">📄 ' + esc(bi('عرض النص المستخرج من التحليل', 'Show Extracted PDF Text')) + '</summary>' +
                '<div style="white-space:pre-wrap;font-size:0.8rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:6px;max-height:180px;overflow-y:auto;">' + esc(rec.extractedText) + '</div>' +
              '</details>'
            : ''),
          async function () {
            document.getElementById('btnModalDownloadPdf').onclick = function () { downloadAttachmentFile(rec); };
            document.getElementById('btnModalDeletePdf').onclick = function () { openDeleteFileConfirmModal(rec.id); };

            const container = document.getElementById('pdfCanvasList');
            const statusEl = document.getElementById('pdfRenderStatus');
            const bytes = dataUrlToUint8Array(rec.attachmentDataUrl);
            if (!bytes || !container) {
              if (statusEl) statusEl.textContent = bi('تعذر قراءة الملف. اضغط زر التحميل بالأعلى لفتحه على جهازك.', 'Unable to read PDF. Tap Download above.');
              return;
            }
            if (window.pdfjsLib) {
              try {
                const pdfDoc = await window.pdfjsLib.getDocument({ data: bytes.slice() }).promise;
                const total = pdfDoc.numPages || 0;
                if (statusEl) statusEl.textContent = bi('📄 عدد الصفحات: ' + total, '📄 Pages: ' + total);
                const maxWidth = Math.max(container.clientWidth - 24, 320);
                for (let p = 1; p <= total; p++) {
                  const page = await pdfDoc.getPage(p);
                  const unscaledVp = page.getViewport({ scale: 1.0 });
                  const cssScale = maxWidth / (unscaledVp.width || 600);
                  const renderScale = cssScale * Math.min(window.devicePixelRatio || 1.5, 2.0);
                  const vp = page.getViewport({ scale: renderScale });
                  const canvas = document.createElement('canvas');
                  canvas.className = 'pdf-page-canvas';
                  canvas.width = Math.ceil(vp.width);
                  canvas.height = Math.ceil(vp.height);
                  container.appendChild(canvas);
                  const ctx = canvas.getContext('2d');
                  await page.render({ canvasContext: ctx, viewport: vp }).promise;
                }
                return;
              } catch (e) { /* fall back to object embed */ }
            }
            if (blobUrl) {
              if (statusEl) statusEl.textContent = bi('تم فتح الملف عبر العارض المدمج — في حال لم يظهر اضغط زر التحميل بالأعلى.', 'Embedded PDF view — tap Download above if needed.');
              container.innerHTML = '<object data="' + esc(blobUrl) + '#toolbar=1" type="application/pdf" style="width:100%;height:58vh;border-radius:10px;background:#fff;">' +
                '<div style="padding:18px;text-align:center;color:var(--text-muted);">' + esc(bi('المتصفح الحالي لا يدعم عرض الـ PDF داخل الإطار، يرجى الضغط على زر تحميل ملف التحليل (PDF) بالأعلى.', 'Inline PDF preview unavailable. Please tap Download PDF Report above.')) + '</div>' +
              '</object>';
            } else {
              if (statusEl) statusEl.textContent = bi('يرجى الضغط على زر التحميل بالأعلى لفتح ملف الـ PDF.', 'Please tap Download above to open the PDF.');
            }
          }
        );
      }

      function bindLabDashboardEvents() {
        const lab = (db.labs || []).find((l) => l.id === ui.loggedInLabId);
        if (!lab) return;

        let pendingLabFile = { dataUrl: '', mimeType: '', fileName: '' };

        const logoutBtn = document.getElementById('btnLabLogout');
        if (logoutBtn) {
          logoutBtn.onclick = function () {
            ui.loggedInLabId = null;
            ui.labPhoneQuery = '';
            ui.labSearchResults = [];
            ui.labTargetMemberId = '';
            ui.labTargetAccountPhone = '';
            showToast(bi('تم تسجيل خروج المعمل بنجاح', 'Lab signed out'));
            renderApp();
          };
        }

        function runLabPatientSearch() {
          const rawQ = (document.getElementById('labPatientPhoneQuery').value || '').trim();
          const digitsQ = normalizePhoneDigits(rawQ);
          ui.labPhoneQuery = rawQ;
          if (!digitsQ) {
            ui.labSearchResults = [];
            ui.labTargetMemberId = '';
            renderApp();
            return;
          }
          const matches = (db.accounts || []).filter((acc) => normalizePhoneDigits(acc.phone).includes(digitsQ));
          ui.labSearchResults = matches.map((acc) => ({
            account: acc,
            members: (db.familyMembers || []).filter((m) => m.accountId === acc.id || normalizePhoneDigits(m.phone) === normalizePhoneDigits(acc.phone))
          }));
          if (ui.labSearchResults.length === 1 && ui.labSearchResults[0].members.length > 0) {
            ui.labTargetMemberId = ui.labSearchResults[0].members[0].id;
            ui.labTargetAccountPhone = ui.labSearchResults[0].account.phone;
          } else {
            ui.labTargetMemberId = '';
            ui.labTargetAccountPhone = '';
          }
          renderApp();
        }

        const searchBtn = document.getElementById('btnLabPhoneSearch');
        const queryInp = document.getElementById('labPatientPhoneQuery');
        if (searchBtn) searchBtn.onclick = runLabPatientSearch;
        if (queryInp) {
          queryInp.onkeydown = function (e) {
            if (e.key === 'Enter') runLabPatientSearch();
          };
        }

        document.querySelectorAll('[data-lab-pick-member]').forEach((btn) => {
          btn.onclick = function () {
            ui.labTargetMemberId = btn.getAttribute('data-lab-pick-member');
            ui.labTargetAccountPhone = btn.getAttribute('data-lab-acc-phone') || '';
            renderApp();
          };
        });

        const fileInp = document.getElementById('labResultFileInput');
        function renderPendingLabPreview() {
          const prev = document.getElementById('labFilePreview');
          if (!prev) return;
          if (!pendingLabFile.dataUrl) {
            prev.innerHTML = '';
            return;
          }
          prev.innerHTML =
            '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:10px;">' +
              '<span>' +
                (pendingLabFile.mimeType === 'application/pdf'
                  ? '📑 ' + esc(bi('ملف PDF جاهز للرفع: ', 'PDF ready: ')) + esc(pendingLabFile.fileName)
                  : '✓ ' + esc(bi('صورة التحليل مضغوطة وجاهزة للرفع', 'Compressed image ready'))) +
              '</span>' +
              '<button class="btn btn-danger-outline" id="btnClearPendingLabFile" type="button" style="min-height:36px;padding:4px 10px;">🗑️ ' + esc(bi('حذف الملف', 'Remove')) + '</button>' +
            '</div>' +
            (pendingLabFile.mimeType !== 'application/pdf'
              ? '<img class="attach-img" src="' + esc(pendingLabFile.dataUrl) + '" alt="نتيجة التحليل" style="margin-top:6px;" />'
              : '');
          const clr = document.getElementById('btnClearPendingLabFile');
          if (clr) {
            clr.onclick = function () {
              pendingLabFile = { dataUrl: '', mimeType: '', fileName: '', extractedText: '' };
              if (fileInp) fileInp.value = '';
              renderPendingLabPreview();
              showToast(bi('تمت إزالة الملف المختار', 'Cleared selected file'));
            };
          }
        }

        if (fileInp) {
          fileInp.onchange = function (e) {
            const file = e.target.files[0];
            if (!file) return;
            readAttachmentWithCompression(file, function (res) {
              pendingLabFile = res;
              renderPendingLabPreview();
            });
          };
        }

        const uploadSubmitBtn = document.getElementById('btnLabUploadSubmit');
        if (uploadSubmitBtn) {
          uploadSubmitBtn.onclick = function () {
            const member = (db.familyMembers || []).find((m) => m.id === ui.labTargetMemberId);
            if (!member) {
              showToast(bi('يرجى اختيار فرد العائلة أولاً', 'Select a family member first'));
              return;
            }
            const title = (document.getElementById('labTestTitle').value || '').trim();
            const notes = (document.getElementById('labTestNotes').value || '').trim();
            if (!title) {
              showToast(bi('يرجى كتابة اسم التحليل أو الأشعة', 'Please enter test or scan title'));
              return;
            }
            const newLabRecId = 'labrec_' + Date.now();
            db.records.unshift({
              id: newLabRecId,
              familyMemberId: member.id,
              patientName: member.fullName,
              patientPhone: ui.labTargetAccountPhone || member.phone,
              doctorId: lab.id,
              doctorName: lab.labName,
              specialty: bi('تحاليل وأشعة طبية', 'Medical Lab & Imaging'),
              visitDateLabel: formatTodayAr(),
              diagnosis: title,
              medications: '',
              notes: notes,
              attachmentDataUrl: pendingLabFile.dataUrl || '',
              attachmentMimeType: pendingLabFile.mimeType || '',
              attachmentName: pendingLabFile.fileName || '',
              extractedText: pendingLabFile.extractedText || '',
              recordType: 'LAB_RESULT',
              createdAtMillis: Date.now()
            });
            saveState(db);
            showToast(bi('تم إرسال نتيجة ' + title + ' إلى ملف ' + member.fullName + ' وجاري تلخيصها ذكياً!', 'Sent lab report to ' + member.fullName + '; updating AI summary!'));
            pendingLabFile = { dataUrl: '', mimeType: '', fileName: '', extractedText: '' };
            if (fileInp) fileInp.value = '';
            renderApp();
            refreshMemberAiSummaryAsync(member.id, newLabRecId);
          };
        }

        bindSharedRecordActions();
      }

            openModal(
              bi('تعديل بيانات العميل: ' + acc.fullName, 'Edit User: ' + acc.fullName),
              '<label style="font-size:0.84rem;font-weight:700;">' + esc(bi('الاسم الكامل *', 'Full Name *')) +
                '<input class="input" id="admEditUserName" value="' + esc(acc.fullName) + '" /></label>' +
              '<label style="font-size:0.84rem;font-weight:700;">' + esc(bi('رقم الهاتف *', 'Phone Number *')) +
                '<input class="input" id="admEditUserPhone" type="tel" value="' + esc(acc.phone) + '" dir="ltr" /></label>' +
              '<label style="font-size:0.84rem;font-weight:700;">' + esc(bi('إعادة تعيين كلمة المرور (اتركه فارغاً للإبقاء على الحالية)', 'Reset Password (leave blank to keep current)')) +
                renderPasswordFieldHtml('admEditUserPass', '', bi('كلمة مرور جديدة (اختياري)', 'New password (optional)')) + '</label>' +
              '<button class="btn btn-primary btn-block" id="btnAdmSaveEditUser" type="button">💾 ' + esc(bi('حفظ التعديلات', 'Save Changes')) + '</button>',
              function () {
                document.getElementById('btnAdmSaveEditUser').onclick = function () {
                  const newName = (document.getElementById('admEditUserName').value || '').trim();
                  const newPhone = toAsciiDigits(document.getElementById('admEditUserPhone').value || '').trim();
                  const newPass = (document.getElementById('admEditUserPass').value || '').trim();
                  if (!newName || normalizePhoneDigits(newPhone).length < 10) {
                    showToast(bi('يرجى إدخال اسم صحيح ورقم هاتف صالح', 'Enter valid name and phone'));
                    return;
                  }
                  const newPhoneDigits = normalizePhoneDigits(newPhone);
                  const duplicate = (db.accounts || []).find((a) => a.id !== acc.id && normalizePhoneDigits(a.phone) === newPhoneDigits);
                  if (duplicate) {
                    showToast(bi('رقم الهاتف مسجل لحساب آخر بالفعل', 'Phone number belongs to another user'));
                    return;
                  }
                  const oldPhoneDigits = normalizePhoneDigits(acc.phone);
                  acc.fullName = newName;
                  acc.phone = newPhone;
                  if (newPass) acc.password = newPass;
                  (db.familyMembers || []).forEach((m) => {
                    if (m.accountId === acc.id && (m.relation.indexOf('نفسي') >= 0 || normalizePhoneDigits(m.phone) === oldPhoneDigits)) {
                      if (m.relation.indexOf('نفسي') >= 0) m.fullName = newName;
                      m.phone = newPhone;
                    }
                  });
                  if (db.account && db.account.id === acc.id) db.account = acc;
                  saveState(db);
                  closeModal();
                  showToast(bi('تم تحديث بيانات العميل بنجاح', 'Customer details updated'));
                  renderApp();
                };
              }
            );
          };
        });

        document.querySelectorAll('[data-admin-delete-user]').forEach((btn) => {
          btn.onclick = function () {
            const acc = (db.accounts || []).find((a) => a.id === btn.getAttribute('data-admin-delete-user'));
            if (!acc) return;
            openModal(
              bi('تأكيد حذف حساب العميل', 'Confirm User Account Deletion'),
              '<div>' + esc(bi('هل أنت متأكد من حذف حساب ', 'Are you sure you want to delete ')) + '<strong>' + esc(acc.fullName) + '</strong> (' + esc(acc.phone) + ') وجميع أفراد الأسرة المسجلين به؟</div>' +
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">' +
                '<button class="btn btn-outline" id="btnCancelDeleteUser" type="button">' + esc(bi('تراجع', 'Cancel')) + '</button>' +
                '<button class="btn btn-danger-outline" id="btnConfirmDeleteUser" type="button">🗑️ ' + esc(bi('حذف الحساب نهائياً', 'Delete Account')) + '</button>' +
              '</div>',
              function () {
                document.getElementById('btnCancelDeleteUser').onclick = closeModal;
                document.getElementById('btnConfirmDeleteUser').onclick = function () {
                  db.accounts = (db.accounts || []).filter((a) => a.id !== acc.id);
                  db.familyMembers = (db.familyMembers || []).filter((m) => m.accountId !== acc.id);
                  if (db.account && db.account.id === acc.id) {
                    db.account = null;
                    db.activeMemberId = null;
                  }
                  saveState(db);
                  closeModal();
                  showToast(bi('تم حذف حساب ' + acc.fullName + ' نهائياً', 'Deleted ' + acc.fullName));
                  renderApp();
                };
              }
            );
          };
        });

        bindOtpGeneratorEvents('ADMIN');
        bindPasswordToggleButtons(document);
      }

      function bindDoctorDashboardEvents() {
        const doc = db.doctors.find((d) => d.id === ui.loggedInDoctorId);
        if (!doc) return;

        document.querySelectorAll('[data-doc-tab]').forEach((btn) => {
          btn.onclick = function () {
            ui.doctorTab = btn.getAttribute('data-doc-tab');
            ui.docActivateSuccessMsg = '';
            renderApp();
          };
        });

        const logoutBtn = document.getElementById('btnDoctorLogout');
        if (logoutBtn) {
          logoutBtn.onclick = function () {
            ui.loggedInDoctorId = null;
            ui.docActivatePhoneQuery = '';
            ui.docActivateResults = [];
            ui.docActivateSuccessMsg = '';
            showToast(bi('تم تسجيل خروج الطبيب', 'Doctor signed out'));
            renderApp();
          };
        }

        function runDoctorPatientSearch() {
          const inp = document.getElementById('docActivatePhoneInput');
          const rawQ = inp ? inp.value.trim() : '';
          ui.docActivatePhoneQuery = rawQ;
          ui.docActivateSuccessMsg = '';
          const digitsQ = normalizePhoneDigits(rawQ);
          if (digitsQ.length < 3) {
            ui.docActivateResults = [];
            showToast(bi('أدخل 3 أرقام على الأقل من رقم الهاتف للبحث', 'Enter at least 3 digits of the phone number'));
            renderApp();
            return;
          }
          ui.docActivateResults = (db.accounts || []).filter((acc) => {
            const accDigits = normalizePhoneDigits(acc.phone);
            return accDigits.includes(digitsQ) || digitsQ.includes(accDigits);
          });
          renderApp();
        }

        const docActSearchBtn = document.getElementById('btnDocActivateSearch');
        const docActInp = document.getElementById('docActivatePhoneInput');
        if (docActSearchBtn) docActSearchBtn.onclick = runDoctorPatientSearch;
        if (docActInp) {
          docActInp.onkeydown = function (e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              runDoctorPatientSearch();
            }
          };
        }

        document.querySelectorAll('[data-doc-activate-acc]').forEach((btn) => {
          btn.onclick = function () {
            const accId = btn.getAttribute('data-doc-activate-acc');
            const target = (db.accounts || []).find((a) => a.id === accId);
            if (!target) return;
            const clinicSource = 'عيادة ' + doc.doctorName;
            markAccountVerified(target, clinicSource);
            saveState(db);
            ui.docActivateResults = (db.accounts || []).filter((acc) => {
              const digitsQ = normalizePhoneDigits(ui.docActivatePhoneQuery);
              const accDigits = normalizePhoneDigits(acc.phone);
              return digitsQ ? (accDigits.includes(digitsQ) || digitsQ.includes(accDigits)) : acc.id === target.id;
            });
            ui.docActivateSuccessMsg = bi(
              'تم تفعيل حساب ' + target.fullName + ' (' + target.phone + ') بنجاح بواسطة ' + clinicSource,
              'Activated ' + target.fullName + ' via ' + clinicSource
            );
            showToast(ui.docActivateSuccessMsg);
            renderApp();
          };
        });

        function applyDelay(mins) {
          doc.currentDelayMinutes += mins;
          db.slots.forEach((s) => {
            if (s.doctorId === doc.id && s.status !== 'COMPLETED') s.delayMinutes += mins;
          });
          db.notifications.unshift({
            id: Date.now(),
            message: 'تنبيه عاجل: تم تأخير مواعيد ' + doc.doctorName + ' (' + doc.clinicName + ') لمدة ' + mins + ' دقيقة (الإجمالي: ' + doc.currentDelayMinutes + ' دقيقة).',
            isRead: false
          });
          saveState(db);
          showToast(bi('تم تأخير المواعيد ' + mins + ' دقيقة وإرسال تنبيه فوري للمرضى', 'Delayed slots by ' + mins + ' min'));
          renderApp();
        }

        const delay15Btn = document.getElementById('btnDelay15');
        if (delay15Btn) delay15Btn.onclick = () => applyDelay(15);
        const delay30Btn = document.getElementById('btnDelay30');
        if (delay30Btn) delay30Btn.onclick = () => applyDelay(30);
        const schedGenBtn = document.getElementById('btnOpenScheduleGen');
        if (schedGenBtn) schedGenBtn.onclick = () => openScheduleGenModal(doc);

        document.querySelectorAll('[data-manual-slot]').forEach((btn) => {
          btn.onclick = () => openManualPhoneModal(btn.getAttribute('data-manual-slot'));
        });
        document.querySelectorAll('[data-write-rx]').forEach((btn) => {
          btn.onclick = () => openSmartPrescriptionModal(btn.getAttribute('data-write-rx'));
        });
        document.querySelectorAll('[data-view-emr]').forEach((btn) => {
          btn.onclick = () => openPatientEmrModal(btn.getAttribute('data-view-emr'));
        });
        document.querySelectorAll('[data-cancel-slot]').forEach((btn) => {
          btn.onclick = function () {
            const slot = db.slots.find((s) => s.id === btn.getAttribute('data-cancel-slot'));
            if (slot && slot.status === 'BOOKED') {
              slot.status = 'AVAILABLE';
              slot.patientName = '';
              slot.patientPhone = '';
              slot.familyMemberId = '';
              slot.bookingSource = '';
              saveState(db);
              showToast(bi('تم إلغاء الحجز وعاد الموعد متاحاً باللون الأخضر', 'Booking cancelled'));
              renderApp();
            }
          };
        });
      }

      // Top Header & Nav Global Listeners
      const langDropdownWrap = document.getElementById('langDropdownWrap');
      const langDropdownMenu = document.getElementById('langDropdownMenu');
      const langToggleBtn = document.getElementById('btnLangToggle');
      function closeLangDropdown() {
        if (langDropdownMenu) langDropdownMenu.classList.remove('open');
        if (langToggleBtn) langToggleBtn.setAttribute('aria-expanded', 'false');
      }
      document.getElementById('btnSmartRefresh').onclick = performSmartHardRefresh;
      const liveBannerBtn = document.getElementById('liveUpdateBanner');
      if (liveBannerBtn) liveBannerBtn.onclick = performSmartHardRefresh;
      langToggleBtn.onclick = function (e) {
        e.stopPropagation();
        const isOpen = langDropdownMenu.classList.toggle('open');
        langToggleBtn.setAttribute('aria-expanded', String(isOpen));
      };
      document.querySelectorAll('[data-set-lang]').forEach(function (item) {
        item.onclick = function (e) {
          e.stopPropagation();
          ui.lang = item.getAttribute('data-set-lang') === 'en' ? 'en' : 'ar';
          try { localStorage.setItem(LANG_KEY, ui.lang); } catch (err) {}
          closeLangDropdown();
          renderApp();
        };
      });
      document.addEventListener('click', function (e) {
        if (langDropdownWrap && !langDropdownWrap.contains(e.target)) {
          closeLangDropdown();
        }
      });
      document.getElementById('rolePatientBtn').onclick = function () {
        ui.roleMode = 'PATIENT';
        renderApp();
      };
      document.getElementById('roleDoctorBtn').onclick = function () {
        ui.roleMode = 'DOCTOR';
        renderApp();
      };
      document.getElementById('btnNotifications').onclick = openNotificationsModal;
      document.getElementById('btnAccount').onclick = function () { openAccountModal(); };

      document.getElementById('bottomNav').querySelectorAll('.nav-item').forEach((btn) => {
        btn.onclick = function () {
          ui.bookingDoctorId = null;
          ui.patientTab = btn.getAttribute('data-tab');
          if (ui.patientTab === 'SPECIALTIES') ui.selectedSpecialty = null;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      });

      // Smooth Escape Key Modal & Dropdown Closing
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeLangDropdown();
          const modalRoot = document.getElementById('modalRoot');
          if (modalRoot && modalRoot.innerHTML.trim() !== '') {
            closeModal();
          }
        }
      });

      // Instant Cross-Tab Real-Time Sync via LocalStorage events
      window.addEventListener('storage', function (e) {
        if (e.key === STORAGE_KEY) {
          db = loadState();
          baselineDbSyncSig = computeDbSyncSignature(db);
          renderApp();
        }
      });

      // Background Live Update & OTA Sync Checker (version.json + index.html every 25s & on visibility return)
      let baselineVersionSig = null;
      async function clearAllBrowserCachesSilently() {
        try {
          if ('caches' in window && caches.keys) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => {
              try {
                if (r.active) r.active.postMessage({ type: 'CLEAR_CACHES' });
                return r.update ? r.update().catch(() => {}) : Promise.resolve();
              } catch (err) { return Promise.resolve(); }
            }));
          }
        } catch (e) { /* ignore cache clear failure */ }
      }

      function tryAutoOtaReloadInsideApk() {
        if (!isInsideAndroidApk()) return false;
        try {
          const lastAuto = Number(sessionStorage.getItem('teb_last_auto_ota_ts') || '0');
          if (Date.now() - lastAuto < 15000) return false;
          sessionStorage.setItem('teb_last_auto_ota_ts', String(Date.now()));
        } catch (e) { /* ignore sessionStorage error */ }
        if (window.AndroidAppHost && typeof window.AndroidAppHost.clearCacheAndReload === 'function') {
          window.AndroidAppHost.clearCacheAndReload();
          return true;
        }
        try {
          window.location.reload();
          return true;
        } catch (e) { return false; }
      }

      async function checkForLivePlatformUpdates() {
        try {
          const latestDb = loadState();
          const nextDbSig = computeDbSyncSignature(latestDb);
          if (nextDbSig && baselineDbSyncSig && nextDbSig !== baselineDbSyncSig) {
            ui.hasNewDataBanner = true;
            updateHeader();
          }
          if (typeof fetch === 'function' && /^https?:$/i.test(window.location.protocol)) {
            let remoteUpdated = false;
            try {
              const verResp = await fetch('./version.json?_t=' + Date.now(), { cache: 'no-store' });
              if (verResp && verResp.ok) {
                const verJson = await verResp.json();
                const verSig = [verJson.version || '1.0.0', verJson.versionCode || 1, verJson.updatedAt || ''].join('|');
                if (!baselineVersionSig) {
                  baselineVersionSig = verSig;
                } else if (verSig !== baselineVersionSig) {
                  baselineVersionSig = verSig;
                  remoteUpdated = true;
                }
              }
            } catch (e) { /* ignore version.json fetch if offline */ }

            const resp = await fetch('./index.html?live_check=' + Date.now(), { cache: 'no-store' });
            if (resp && resp.ok) {
              const etag = resp.headers.get('etag') || '';
              const lastMod = resp.headers.get('last-modified') || '';
              const cLen = resp.headers.get('content-length') || '';
              const sig = etag || lastMod || cLen || String((await resp.text()).length);
              if (!baselineRemotePageSig) {
                baselineRemotePageSig = sig;
              } else if (sig && sig !== baselineRemotePageSig) {
                baselineRemotePageSig = sig;
                remoteUpdated = true;
              }
            }

            if (remoteUpdated) {
              await clearAllBrowserCachesSilently();
              if (!tryAutoOtaReloadInsideApk()) {
                ui.hasNewDataBanner = true;
                updateHeader();
              }
            }
          }
        } catch (e) { /* offline-safe ignore */ }
      }

      if (/^https?:$/i.test(window.location.protocol)) {
        setTimeout(checkForLivePlatformUpdates, 2000);
      }
      setInterval(checkForLivePlatformUpdates, 25000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          checkForLivePlatformUpdates();
        }
      });

      // Clear any stale legacy SW caches automatically while preserving clean v1.0.0 cache
      if ('caches' in window && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) {
            if (k !== 'teb-alhajayzah-v1.0.0-clean') {
              caches.delete(k).catch(function () {});
            }
          });
        }).catch(function () {});
      }

      // Service Worker Registration for PWA Installability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').then(function (reg) {
            if (reg && reg.update) reg.update();
          }).catch(function () {});
        });
      }

      // Initialize App with brief spinner while loading medications catalog
      setGlobalLoading(true, bi('جاري تجهيز منصة طب الحجايزة...', 'Loading Teb Al-Hajayzah...'));
      renderApp();
      refreshMedicationsFromApi().finally(function () {
        setGlobalLoading(false);
        renderApp();
      });
    })();
  </script>
</body>
</html>
