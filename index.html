      function resolveDriveCandidateUrlsWeb(clinicOrUrl) {
        const list = [];
        function pushValid(u) {
          const s = String(u || '').trim();
          if (/^https?:\/\//i.test(s) && list.indexOf(s) < 0) list.push(s);
        }
        if (clinicOrUrl && typeof clinicOrUrl === 'object') {
          pushValid(clinicOrUrl.driveWebAppUrl);
          pushValid(clinicOrUrl.secondaryDriveWebAppUrl);
        } else {
          pushValid(clinicOrUrl);
        }
        pushValid(db && db.config && db.config.defaultDriveWebAppUrl);
        return list;
      }

      function resolveDriveWebAppUrlWeb(clinicOrUrl) {
        const candidates = resolveDriveCandidateUrlsWeb(clinicOrUrl);
        return candidates[0] || '';
      }

      async function uploadFileToGoogleDriveWebApp(record, clinicOrUrl, clinicName) {
        if (!record || !record.attachmentDataUrl || typeof fetch !== 'function') return '';
        const candidates = resolveDriveCandidateUrlsWeb(clinicOrUrl);
        if (candidates.length === 0) return '';
        const dataStr = String(record.attachmentDataUrl || '');
        const commaIdx = dataStr.indexOf(',');
        const base64Data = commaIdx >= 0 ? dataStr.slice(commaIdx + 1) : dataStr;
        if (!base64Data) return '';
        const payload = {
          fileName: record.attachmentName || ('teb_record_' + record.id + (record.attachmentMimeType === 'application/pdf' ? '.pdf' : '.jpg')),
          mimeType: record.attachmentMimeType || (dataStr.indexOf('data:application/pdf') === 0 ? 'application/pdf' : 'image/jpeg'),
          base64Data: base64Data,
          clinicId: record.doctorId || '',
          clinicName: clinicName || record.doctorName || 'منصة طب الحجايزة',
          patientName: record.patientName || '',
          familyMemberId: record.familyMemberId || '',
          recordId: record.id || '',
          recordType: record.recordType || ''
        };
        for (let i = 0; i < candidates.length; i += 1) {
          const targetUrl = candidates[i];
          try {
            const resp = await fetch(targetUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload)
            });
            if (!resp || !resp.ok) continue;
            const txt = await resp.text();
            let json = null;
            try { json = JSON.parse(txt); } catch (err) { json = null; }
            const driveUrl = json
              ? String(json.fileUrl || json.webViewLink || json.url || '').trim()
              : (/^https?:\/\//i.test(txt.trim()) ? txt.trim() : '');
            if (driveUrl && /^https?:\/\//i.test(driveUrl)) {
              const idx = (db.records || []).findIndex((r) => r.id === record.id);
              if (idx >= 0) {
                db.records[idx].driveFileUrl = driveUrl;
                saveState(db);
                renderApp();
              }
              return driveUrl;
            }
          } catch (e) { /* try next Drive account / fallback */ }
        }
        return '';
      }

      function compressImageFileToCompactDataUri(file, maxDim, quality) {
        const limitDim = maxDim || 720;
        const jpegQ = quality || 0.65;
        return new Promise((resolve) => {
          if (!file) { resolve(''); return; }
          const reader = new FileReader();
          reader.onerror = function () { resolve(''); };
          reader.onload = function () {
            const rawUrl = String(reader.result || '');
            const img = new Image();
            img.onerror = function () { resolve(rawUrl); };
            img.onload = function () {
              let w = img.width || limitDim;
              let h = img.height || limitDim;
              if (w > limitDim || h > limitDim) {
                const ratio = Math.min(limitDim / w, limitDim / h);
                w = Math.max(1, Math.round(w * ratio));
                h = Math.max(1, Math.round(h * ratio));
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              if (!ctx) { resolve(rawUrl); return; }
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              try {
                resolve(canvas.toDataURL('image/jpeg', jpegQ));
              } catch (err) {
                resolve(rawUrl);
              }
            };
            img.src = rawUrl;
          };
          reader.readAsDataURL(file);
        });
      }

      function computeVisitorStats(hits) {
        const list = Array.isArray(hits) ? hits : [];
        const now = new Date();
        const startOfTodayMs = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const dayMs = 24 * 60 * 60 * 1000;
        const weekStartMs = Date.now() - 7 * dayMs;
        const monthStartMs = Date.now() - 30 * dayMs;
        const out = {
          today: { apk: 0, web: 0, total: 0 },
          week: { apk: 0, web: 0, total: 0 },
          month: { apk: 0, web: 0, total: 0 }
        };
        list.forEach((h) => {
          if (!h) return;
          const ts = Number(h.timestampMillis || h.createdAtMillis || 0);
          if (!ts) return;
          const isApk = String(h.platform || '').toUpperCase() === 'APK';
          const key = isApk ? 'apk' : 'web';
          if (ts >= startOfTodayMs) {
            out.today[key] += 1;
            out.today.total += 1;
          }
          if (ts >= weekStartMs) {
            out.week[key] += 1;
            out.week.total += 1;
          }
          if (ts >= monthStartMs) {
            out.month[key] += 1;
            out.month.total += 1;
          }
        });
        return out;
      }

      function isPersonalSelfMemberWeb(member, ownerAccount) {
        if (!member) return false;
        const rel = String(member.relation || '').trim().toLowerCase();
        if (rel.indexOf('نفسي') >= 0 || rel.indexOf('صاحب الحساب') >= 0 || rel === 'self') return true;
        if (ownerAccount && normalizePhoneDigits(member.phone) === normalizePhoneDigits(ownerAccount.phone) &&
            String(member.fullName || '').trim() === String(ownerAccount.fullName || '').trim()) {
          return true;
        }
        return false;
      }

      function getVisibleMembersForActiveAccount() {
        if (!db.account) return [];
        const ownAcc = db.account;
        const ownPhone = normalizePhoneDigits(ownAcc.phone);
        const allMems = (db.familyMembers || []).map(normalizeFamilyMemberObj);
        const result = [];
        const seenIds = {};

        allMems.forEach((m) => {
          if (m.accountId === ownAcc.id || (!m.accountId && normalizePhoneDigits(m.phone) === ownPhone)) {
            if (!seenIds[m.id]) {
              seenIds[m.id] = true;
              result.push(m);
            }
          }
        });

        const spouseId = String(ownAcc.spouseAccountId || '').trim();
        if (spouseId) {
          const spouseAcc = (db.accounts || []).find((a) => a.id === spouseId);
          if (spouseAcc) {
            const allowPersonal = spouseAcc.allowSpouseViewPersonalRecords === true;
            allMems.forEach((m) => {
              if (m.accountId === spouseAcc.id && !seenIds[m.id]) {
                const isSelf = isPersonalSelfMemberWeb(m, spouseAcc);
                if (!isSelf || allowPersonal) {
                  seenIds[m.id] = true;
                  result.push(m);
                }
              }
            });
          }
        }
        return result;
      }

      /**
       * تنظيف المرفقات الثقيلة (PDF / صور) التي تجاوزت مدة الاحتفاظ (90 / 180 / 360 يوماً)
       * مع الحفاظ التام على driveFileUrl وعلى السجل الطبي التاريخي الدائم مدى الحياة (db.permanentLogs).
       */
      function pruneExpiredHeavyAttachmentsWeb(targetState) {
        const st = targetState || db;
        if (!st || !Array.isArray(st.records)) return 0;
        const retentionDays = normalizeRetentionDaysWeb(st.config && st.config.fileRetentionDays);
        const cutoffMillis = Date.now() - (retentionDays * 24 * 60 * 60 * 1000);
        let pruned = 0;
        st.records.forEach((rec) => {
          if (rec && rec.attachmentDataUrl && (Number(rec.createdAtMillis) || Date.now()) < cutoffMillis) {
            rec.attachmentDataUrl = '';
            rec.attachmentMimeType = '';
            rec.attachmentName = '';
            rec.extractedText = '';
            pruned += 1;
          }
        });
        if (pruned > 0 && st === db) {
          saveState(db);
        }
        return pruned;
      }

      const DRIVE_ACCOUNT_CAPACITY_BYTES = 15 * 1024 * 1024 * 1024; // 15 GB

      function estimateRecordHeavyBytesWeb(rec) {
        if (!rec) return 0;
        const dataUrl = String(rec.attachmentDataUrl || '');
        if (dataUrl.length > 0) {
          const commaIdx = dataUrl.indexOf(',');
          const b64Len = commaIdx >= 0 ? (dataUrl.length - commaIdx - 1) : dataUrl.length;
          return Math.max(1024, Math.floor(b64Len * 0.75));
        }
        if (rec.driveFileUrl && String(rec.driveFileUrl).trim()) {
          // Archived remote attachment estimate when inline base64 was cleared locally
          return (rec.attachmentMimeType === 'application/pdf') ? (1200 * 1024) : (650 * 1024);
        }
        return 0;
      }

      function getStorageTargetForRecordWeb(rec) {
        if (!rec) return 'platform_fallback';
        if (rec.storageTargetId) return rec.storageTargetId;
        const docId = String(rec.doctorId || '').trim();
        if (docId) {
          const docObj = (db && db.doctors ? db.doctors : []).find((d) => d.id === docId);
          if (docObj && docObj.driveWebAppUrl) return 'clinic_' + docObj.id + '_primary';
          if (docObj && docObj.secondaryDriveWebAppUrl) return 'clinic_' + docObj.id + '_secondary';
        }
        return 'platform_fallback';
      }

      function computeDriveUsageWeb(storageTargetId) {
        const recs = (db && Array.isArray(db.records)) ? db.records : [];
        let usedBytes = 0;
        let filesCount = 0;
        recs.forEach((r) => {
          if (!r) return;
          const bytes = estimateRecordHeavyBytesWeb(r);
          if (bytes <= 0) return;
          if (getStorageTargetForRecordWeb(r) === storageTargetId) {
            usedBytes += bytes;
            filesCount += 1;
          }
        });
        const usedGb = usedBytes / (1024 * 1024 * 1024);
        const pct = usedBytes > 0 ? Math.min(100, Math.max(1, Math.round((usedBytes / DRIVE_ACCOUNT_CAPACITY_BYTES) * 100))) : 0;
        return { usedBytes: usedBytes, usedGb: usedGb, pct: pct, filesCount: filesCount };
      }

        const alreadyInList = (db.notifications || []).some((n) => n && n.targetAudience === 'ADMIN' && String(n.message || '').indexOf('حساب ' + accountLabel + ' وصل إلى') >= 0 && (Date.now() - (Number(n.createdAtMillis) || 0)) < 3600000);

      function cleanHeavyAttachmentsForStorageTargetWeb(storageTargetId) {
        if (!db || !Array.isArray(db.records)) return 0;
        let cleaned = 0;
        db.records.forEach((rec) => {
          if (!rec) return;
          if (getStorageTargetForRecordWeb(rec) !== storageTargetId) return;
          const hasHeavy = Boolean(rec.attachmentDataUrl || rec.driveFileUrl || rec.attachmentName);
          if (hasHeavy) {
            rec.attachmentDataUrl = '';
            rec.attachmentMimeType = '';
            rec.attachmentName = '';
            rec.driveFileUrl = '';
            rec.extractedText = '';
            cleaned += 1;
          }
        });

          saveState(db);
        }
        return cleaned;
      }

      function toAsciiDigits(raw) {
        return String(raw || '')
          .replace(/[\u0660-\u0669]/g, (c) => String(c.charCodeAt(0) - 0x0660))
          .replace(/[\u06F0-\u06F9]/g, (c) => String(c.charCodeAt(0) - 0x06F0));
      }

      function normalizePhoneDigits(phone) {
        const digits = toAsciiDigits(phone).replace(/\D/g, '');
        if (digits.startsWith('0020') && digits.length >= 14) return '0' + digits.slice(4);
        if (digits.startsWith('20') && digits.length >= 12) return '0' + digits.slice(2);
        return digits;
      }

      function isPhoneBlocked(phone) {
        const target = normalizePhoneDigits(phone);
        if (!target) return false;
        return (db.blockedPhones || []).some((b) => normalizePhoneDigits(b.phone) === target);
      }

      function verifyAdminPinAttempt(enteredPin) {
        const now = Date.now();
        const sec = db.adminSecurity || { failedAttempts: 0, lockoutUntilMillis: 0 };
        if (sec.lockoutUntilMillis > now) {
          const remMin = Math.ceil((sec.lockoutUntilMillis - now) / 60000);
          return {
            ok: false,
            locked: true,
            error: bi(
              'تم قفل بوابة الإدارة مؤقتاً بسبب 3 محاولات خاطئة. حاول بعد ' + remMin + ' دقيقة.',
              'Admin portal is temporarily locked after 3 failed attempts. Try again in ' + remMin + ' min.'
            )
          };
        }
        const expectedPin = (db.config.adminPin || DEFAULT_CONFIG.adminPin || '132027').trim();
        if (toAsciiDigits(enteredPin).trim() === expectedPin) {
          db.adminSecurity = { failedAttempts: 0, lockoutUntilMillis: 0 };
          saveState(db);
          return { ok: true };
        }
        const currentFails = (sec.lockoutUntilMillis > 0 && sec.lockoutUntilMillis <= now) ? 0 : (sec.failedAttempts || 0);
        const nextFails = currentFails + 1;
        if (nextFails >= MAX_ADMIN_PIN_ATTEMPTS) {
          db.adminSecurity = { failedAttempts: nextFails, lockoutUntilMillis: now + ADMIN_LOCKOUT_MILLIS };
          saveState(db);
          return {
            ok: false,
            locked: true,
            error: bi(
              'تم إدخال رقم سري خاطئ 3 مرات. تم قفل الإدارة لمدة 15 دقيقة.',
              '3 failed PIN attempts. Admin access locked for 15 minutes.'
            )
          };
        }
        db.adminSecurity = { failedAttempts: nextFails, lockoutUntilMillis: 0 };
        saveState(db);
        const left = MAX_ADMIN_PIN_ATTEMPTS - nextFails;
        return {
          ok: false,
          locked: false,
          error: bi(
            'الرقم السري غير صحيح. المحاولات المتبقية قبل القفل: ' + left,
            'Incorrect PIN. Remaining attempts before lockout: ' + left
          )
        };
      }

      function copyTextToClipboard(text, onDone) {
        const str = String(text || '');

          navigator.clipboard.writeText(str).then(function () {
            if (onDone) onDone(true);
          }).catch(function () {
            fallbackCopyText(str, onDone);
          });
        } else {
          fallbackCopyText(str, onDone);
        }
      }

      function fallbackCopyText(str, onDone) {
        try {
          const ta = document.createElement('textarea');
          ta.value = str;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (onDone) onDone(Boolean(ok));
        } catch (e) {
          if (onDone) onDone(false);
        }
      }

      function verifyAndBurnActivationCode(account, rawCode, nowOverride) {

        const clean = toAsciiDigits(rawCode).replace(/\D/g, '');

          saveState(db);
          syncAccountToCloudNow(db.account && db.account.id === (account && account.id) ? db.account : account);

        // 1) Check the unique 24-hour OTP code bound to this specific user account
        const boundAccount = account
          ? ((db.accounts || []).find((a) => a.id === account.id || normalizePhoneDigits(a.phone) === normalizePhoneDigits(account.phone)) || account)
          : null;
        if (boundAccount && boundAccount.otpCode) {
          const boundCode = toAsciiDigits(boundAccount.otpCode).replace(/\D/g, '');
          if (boundCode === clean) {
            if (boundAccount.otpUsed) {
              return {
                ok: false,
                error: bi(
                  'تم استخدام هذا الكود من قبل. إذا احتجت كوداً جديداً اضغط "توليد كود جديد".',
                  'This code has already been used. Click "Generate New Code" if needed.'
                )
              };
            }
            if (!boundAccount.otpExpiresAtMillis || now > boundAccount.otpExpiresAtMillis) {
              return {
                ok: false,
                expired: true,
                error: bi(
                  'انتهت صلاحية كود التفعيل الخاص بحسابك (مرت أكثر من 24 ساعة). اضغط على زر "توليد كود جديد".',
                  'Your account activation code has expired (> 24 hours). Click "Generate New Code".'
                )
              };
            }
            boundAccount.otpUsed = true;
            markAccountVerified(boundAccount, 'كود OTP');
            saveState(db);
            syncAccountToCloudNow(boundAccount);
            return { ok: true, usedMaster: false, usedUserOtp: true };
          }
        }

        // 2) Fallback: Check shared Admin batch single-use codes pool
        const codes = db.activationCodes || [];
        const found = codes.find((c) => toAsciiDigits(c.code).replace(/\D/g, '') === clean);
        if (!found) {
          return { ok: false, error: bi('كود التفعيل غير صحيح أو غير مطابق لكود حسابك. تأكد من الكود أو تواصل على واتساب.', 'Verification code does not match your account code. Contact Admin on WhatsApp.') };
        }
        if (found.isUsed) {
          return {
            ok: false,
            error: bi(
              'هذا الكود تم استخدامه بالفعل ومنتهي الصلاحية' + (found.usedByName ? ' (' + found.usedByName + ')' : '') + '، ولا يمكن إعادة استخدامه.',
              'This code has already been used and expired.'
            )
          };
        }
        found.isUsed = true;
        found.usedByName = (account && account.fullName) ? account.fullName : bi('مريض', 'Patient');
        found.usedByPhone = (account && account.phone) ? account.phone : '';
        found.usedAtMillis = now;
        markAccountVerified(account, 'كود OTP');
        saveState(db);
        syncAccountToCloudNow(db.account && db.account.id === (account && account.id) ? db.account : account);
        syncDocToFirestoreNamespace('activation_codes', found.code, found);
        return { ok: true, usedMaster: false };
      }

      function formatMinutesAr(totalMinutes) {
        const norm = ((totalMinutes % 1440) + 1440) % 1440;

        const m = norm % 60;
        const period = ui.lang === 'en' ? (h24 >= 12 ? 'PM' : 'AM') : (h24 >= 12 ? 'م' : 'ص');
        const h12 = h24 === 0 ? 12 : (h24 > 12 ? h24 - 12 : h24);
        return h12 + ':' + (m < 10 ? '0' + m : m) + ' ' + period;
      }

          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => {
              try {
                if (r.active) r.active.postMessage({ type: 'CLEAR_CACHES' });
                if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });
                return r.update ? r.update().catch(() => {}) : Promise.resolve();
              } catch (err) {
                return Promise.resolve();

      function compareVersionStrings(a, b) {
        const pa = String(a || '1.0.0').replace(/^v/i, '').split('.').map((n) => parseInt(n, 10) || 0);
        const pb = String(b || '1.0.0').replace(/^v/i, '').split('.').map((n) => parseInt(n, 10) || 0);
        const len = Math.max(pa.length, pb.length);
        for (let i = 0; i < len; i++) {
          const va = pa[i] || 0;
          const vb = pb[i] || 0;
          if (va > vb) return 1;
          if (va < vb) return -1;
        }
        return 0;
      }

      function triggerDirectApkFileDownload(downloadUrl) {
        const targetFileName = 'طب الحجايزة.apk';
        if (isInsideAndroidApk() && window.AndroidAppHost && typeof window.AndroidAppHost.downloadAndInstallApk === 'function') {
          window.AndroidAppHost.downloadAndInstallApk(downloadUrl);
          return;
        }
        let triggeredSameOrigin = false;
        try {
          const resolved = new URL(downloadUrl, window.location.href);
          if (resolved.origin === window.location.origin) {
            const tempLink = document.createElement('a');
            tempLink.href = resolved.href;
            tempLink.setAttribute('download', targetFileName);
            tempLink.style.display = 'none';
            document.body.appendChild(tempLink);
            tempLink.click();
            document.body.removeChild(tempLink);
            triggeredSameOrigin = true;
          }
        } catch (e) { /* fallback to hidden frame */ }

        if (!triggeredSameOrigin) {
          const oldFrame = document.getElementById('apkDownloadFrame');
          if (oldFrame && oldFrame.parentNode) {
            oldFrame.parentNode.removeChild(oldFrame);
          }
          const frame = document.createElement('iframe');
          frame.id = 'apkDownloadFrame';
          frame.title = 'تحميل تطبيق طب الحجايزة';
          frame.setAttribute('aria-hidden', 'true');
          frame.tabIndex = -1;
          frame.style.cssText = 'display:none;width:0;height:0;border:0;position:absolute;left:-9999px;';
          frame.src = downloadUrl;
          document.body.appendChild(frame);
        }
      }

      async function refreshMedicationsFromApi() {
        const url = (db.config.medicationsApiUrl || '').trim();
        if (!url) {
          ui.medications = BUILTIN_MEDICATIONS.slice();
          ui.isLiveMedsApi = false;
          return;
        }
        let abortCtrl = null;
        let fetchTimer = null;
        try {
          abortCtrl = typeof AbortController === 'function' ? new AbortController() : null;
          if (abortCtrl) {
            fetchTimer = setTimeout(function () {
              try { abortCtrl.abort(); } catch (err) {}
            }, 3000);
          }
          const res = await fetch(url, {
            headers: { Accept: 'application/json' },
            signal: abortCtrl ? abortCtrl.signal : undefined
          });
          if (fetchTimer) clearTimeout(fetchTimer);
          if (res.ok) {
            const json = await res.json();
            const arr = Array.isArray(json) ? json : (json.medications || json.data || []);
            if (Array.isArray(arr) && arr.length > 0) {
              ui.medications = arr.map((item, idx) => ({
                id: item.id || ('remote_' + idx),
                tradeName: item.tradeName || item.name || 'دواء',
                activeIngredient: item.activeIngredient || item.generic || 'مادة فعالة',
                strength: item.strength || item.concentration || '',
                specialty: item.specialty || 'باطنة وجهاز هضمي',
                form: item.form || 'أقراص',
                defaultDosage: item.defaultDosage || 'حسب إرشادات الطبيب'
              }));
              ui.isLiveMedsApi = true;
              return;
            }
          }
        } catch (e) {
          if (fetchTimer) clearTimeout(fetchTimer);
        }
        ui.medications = BUILTIN_MEDICATIONS.slice();
        ui.isLiveMedsApi = false;
      }

      function canPatientChatWith(doc) {

      function isNotificationVisibleForRole(n) {
        if (!n) return false;
        const aud = String(n.targetAudience || 'ALL').toUpperCase();
        const tid = String(n.targetId || '').trim();
        if (ui.roleMode === 'ADMIN') {
          return aud === 'ADMIN' || aud === 'ALL';
        }
        if (ui.roleMode === 'DOCTOR') {
          return aud === 'ALL' || (aud === 'CLINIC' && (!tid || tid === ui.loggedInDoctorId));
        }
        if (aud === 'ALL') return true;
        if (aud === 'PATIENT') {
          if (!tid) return true;
          if (db.account && (tid === db.account.id || normalizePhoneDigits(tid) === normalizePhoneDigits(db.account.phone))) return true;
          return getVisibleMembersForActiveAccount().some((m) => m.id === tid);
        }
        return false;
      }

      function getVisibleNotificationsForRole() {
        return (db.notifications || [])
          .filter(isNotificationVisibleForRole)
          .slice()
          .sort((a, b) => (Number(b.createdAtMillis || b.id) || 0) - (Number(a.createdAtMillis || a.id) || 0));
      }

      function isMessageReadForRole(msg, roleModeOverride) {
        if (!msg) return true;
        const mode = roleModeOverride || ui.roleMode;
        if (msg.isRead) return true;
        if (mode === 'PATIENT' && typeof msg.isReadByPatient === 'boolean') return msg.isReadByPatient;
        if (mode === 'DOCTOR' && typeof msg.isReadByClinic === 'boolean') return msg.isReadByClinic;
        if (mode === 'ADMIN' && typeof msg.isReadByAdmin === 'boolean') return msg.isReadByAdmin;
        return false;
      }

      function isIncomingMessageForRole(msg, roleModeOverride) {
        if (!msg) return false;
        const mode = roleModeOverride || ui.roleMode;
        if (isMessageReadForRole(msg, mode)) return false;
        if (mode === 'PATIENT') {
          if (!db.account) return false;
          if (msg.patientAccountId !== db.account.id) return false;
          return (msg.threadType === 'PATIENT_CLINIC' && msg.senderRole === 'CLINIC') ||
            (msg.threadType === 'PATIENT_ADMIN' && msg.senderRole === 'ADMIN');
        }
        if (mode === 'DOCTOR') {
          if (!ui.loggedInDoctorId || msg.doctorId !== ui.loggedInDoctorId) return false;
          return (msg.threadType === 'PATIENT_CLINIC' && msg.senderRole === 'PATIENT') ||
            (msg.threadType === 'CLINIC_ADMIN' && msg.senderRole === 'ADMIN');
        }
        if (mode === 'ADMIN') {
          if (!ui.isAdminLoggedIn) return false;
          return (msg.threadType === 'PATIENT_ADMIN' && msg.senderRole === 'PATIENT') ||
            (msg.threadType === 'CLINIC_ADMIN' && msg.senderRole === 'CLINIC');
        }
        return false;
      }

      function getUnreadMessagesCountForRole() {
        return (db.messages || []).filter((m) => isIncomingMessageForRole(m, ui.roleMode)).length;
      }

      function getUnreadMessagesForPatientSupport() {
        if (!db.account) return 0;
        return (db.messages || []).filter((m) =>
          !isMessageReadForRole(m, 'PATIENT') && m.threadType === 'PATIENT_ADMIN' && m.patientAccountId === db.account.id && m.senderRole === 'ADMIN'
        ).length;
      }

      function getUnreadMessagesForDoctor(docId) {
        if (!docId) return 0;
        return (db.messages || []).filter((m) =>
          !isMessageReadForRole(m, 'DOCTOR') && m.doctorId === docId && (
            (m.threadType === 'PATIENT_CLINIC' && m.senderRole === 'PATIENT') ||
            (m.threadType === 'CLINIC_ADMIN' && m.senderRole === 'ADMIN')
          )
        ).length;
      }

      function getUnreadSupportInboxForAdmin() {
        return (db.messages || []).filter((m) =>
          !isMessageReadForRole(m, 'ADMIN') && (
            (m.threadType === 'PATIENT_ADMIN' && m.senderRole === 'PATIENT') ||

      function formatMessageTime(ms) {

      function pushDirectMessage(payload) {
        if (!Array.isArray(db.messages)) db.messages = [];
        const nowMs = Date.now();
        const tType = payload.threadType;
        const sRole = payload.senderRole;
        const msgObj = {
          id: 'msg_' + nowMs + '_' + Math.floor(Math.random() * 10000),
          threadType: tType,
          senderRole: sRole,
          senderName: payload.senderName || '',
          patientAccountId: payload.patientAccountId || '',
          patientName: payload.patientName || '',
          patientPhone: payload.patientPhone || '',
          doctorId: payload.doctorId || '',
          doctorName: payload.doctorName || '',
          body: payload.body || '',
          isRead: false,
          isReadByPatient: sRole === 'PATIENT' || tType === 'CLINIC_ADMIN',
          isReadByClinic: sRole === 'CLINIC' || tType === 'PATIENT_ADMIN',
          isReadByAdmin: sRole === 'ADMIN' || tType === 'PATIENT_CLINIC',
          createdAtMillis: nowMs
        };
        db.messages.push(msgObj);

        let adminAlertNotif = null;
        if (tType === 'PATIENT_ADMIN' && sRole === 'PATIENT') {
          const senderTitle = msgObj.patientName || msgObj.senderName || bi('عميل', 'Customer');
          adminAlertNotif = {
            id: nowMs,
            message: '💬 رسالة دعم جديدة من ' + senderTitle + (msgObj.patientPhone ? ' (' + msgObj.patientPhone + ')' : '') + ': ' + msgObj.body,
            isRead: false,
            targetAudience: 'ADMIN',
            targetId: msgObj.patientAccountId || '',
            senderLabel: bi('رسالة دعم فني جديدة', 'New Support Message'),
            createdAtMillis: nowMs
          };
          db.notifications.unshift(adminAlertNotif);
        } else if (tType === 'CLINIC_ADMIN' && sRole === 'CLINIC') {
          adminAlertNotif = {
            id: nowMs,
            message: '🩺 رسالة من عيادة ' + (msgObj.doctorName || msgObj.senderName || '') + ': ' + msgObj.body,
            isRead: false,
            targetAudience: 'ADMIN',
            targetId: msgObj.doctorId || '',
            senderLabel: bi('رسالة عيادة للإدارة', 'Clinic Message to Admin'),
            createdAtMillis: nowMs
          };
          db.notifications.unshift(adminAlertNotif);
        }

        saveState(db);
        syncDocToFirestoreNamespace('messages', msgObj.id, msgObj);
        if (adminAlertNotif) {
          syncDocToFirestoreNamespace('notifications', String(adminAlertNotif.id), adminAlertNotif);
        }

        const isToAdmin = (tType === 'PATIENT_ADMIN' && sRole === 'PATIENT') || (tType === 'CLINIC_ADMIN' && sRole === 'CLINIC');
        const pushAud = isToAdmin
          ? 'ADMIN'
          : (sRole === 'ADMIN'
              ? (tType === 'CLINIC_ADMIN' ? 'CLINIC' : 'PATIENT')
              : (sRole === 'PATIENT' ? 'CLINIC' : 'PATIENT'));
        const pushTargetId = isToAdmin
          ? (msgObj.patientAccountId || msgObj.doctorId || '')
          : (pushAud === 'CLINIC' ? (msgObj.doctorId || '') : (msgObj.patientAccountId || ''));
        const pushEvent = isToAdmin && tType === 'PATIENT_ADMIN' ? 'PATIENT_SUPPORT_MESSAGE' : 'DIRECT_MESSAGE';
        const pushTitle = isToAdmin
          ? ('💬 رسالة دعم جديدة من ' + (msgObj.patientName || msgObj.doctorName || msgObj.senderName || 'طب الحجايزة'))
          : ('💬 ' + (msgObj.senderName || 'طب الحجايزة'));

        triggerPlatformNotification(
          '💬 ' + (msgObj.senderName || bi('رسالة جديدة', 'New Message')),
          msgObj.body,
          'msg_' + msgObj.threadType
        );
        dispatchWorkerPush(
          pushEvent,
          pushTitle,
          msgObj.body,
          pushAud,
          pushTargetId,
          CLOUD_PATHS.messages
        );
      }

      function deleteDirectMessageByAdmin(msgId) {
        if (!msgId) return;
        tebCloudRuntime.deletedMsgIds[safeCloudDocId(msgId)] = true;
        tebCloudRuntime.deletedMsgIds[String(msgId)] = true;
        db.messages = (db.messages || []).filter((m) => m.id !== msgId);
        saveState(db);
        deleteDocFromFirestoreNamespace('messages', msgId);
      }

      function deleteChatThreadByAdmin(threadType, patientAccountId, doctorId) {
        const toDelete = (db.messages || []).filter((m) => {
          if (!m || m.threadType !== threadType) return false;
          if (threadType === 'PATIENT_CLINIC') {
            return (m.patientAccountId || '') === (patientAccountId || '') && (m.doctorId || '') === (doctorId || '');
          }
          if (threadType === 'PATIENT_ADMIN') {
            return (m.patientAccountId || '') === (patientAccountId || '');
          }
          if (threadType === 'CLINIC_ADMIN') {
            return (m.doctorId || '') === (doctorId || '');
          }
          return false;
        });
        const delSet = {};
        toDelete.forEach((m) => {
          delSet[m.id] = true;
          tebCloudRuntime.deletedMsgIds[safeCloudDocId(m.id)] = true;
          tebCloudRuntime.deletedMsgIds[String(m.id)] = true;
          deleteDocFromFirestoreNamespace('messages', m.id);
        });
        db.messages = (db.messages || []).filter((m) => !delSet[m.id]);
        saveState(db);
        return toDelete.length;
      }

        const q = ui.searchQuery.trim().toLowerCase();

          const matchSpec = !showSpecChips || !ui.selectedSpecialty || doctorMatchesSpecialty(doc, ui.selectedSpecialty);
          const allSpecsCombined = allDoctorSpecialties(doc)
            .map((s) => displaySpecialty(s, false) + ' ' + displaySpecialty(s, true))
            .join(' ')
            .toLowerCase();
          const matchQ = !q ||
            doc.doctorName.toLowerCase().includes(q) ||
            (doc.doctorNameEn || '').toLowerCase().includes(q) ||
            doc.clinicName.toLowerCase().includes(q) ||
            (doc.clinicNameEn || '').toLowerCase().includes(q) ||
            allSpecsCombined.includes(q);
          return matchType && matchSpec && matchQ;

            '<h2 style="margin-bottom:10px;">' + esc(title) + '</h2>' +

      function openBookConfirmModal(slotId) {
        const slot = db.slots.find((s) => s.id === slotId);
        if (!slot || slot.status !== 'AVAILABLE') {
          showToast(bi('عذراً، تم حجز هذا الموعد للتو', 'Sorry, this slot was just booked'));
          renderApp();
          return;
        }
        const member = getActiveMember();
        if (!db.account || !member) {
          showToast(bi('يرجى إنشاء حساب أو تسجيل الدخول وتأكيد الهاتف أولاً', 'Please create an account or sign in first'));
          openAccountModal('REGISTER');
          return;
        }
        if (isPhoneBlocked(db.account.phone) || isPhoneBlocked(member.phone)) {
          showToast(bi('عذراً، هذا الرقم محظور من الحجز عبر المنصة', 'Sorry, this phone number is blocked'));
          return;
        }
        if (db.account.isPhoneVerified === false) {
          showToast(bi('يرجى إدخال رمز التحقق (OTP) المكون من 6 أرقام أولاً لمنع الحجوزات الوهمية', 'Please verify the 6-digit OTP code first before booking'));
          openAccountModal();
          return;
        }
        const doc = db.doctors.find((d) => d.id === slot.doctorId);
        openModal(bi('تأكيد حجز الموعد', 'Confirm Appointment'),
          '<div><strong>' + esc(bi('الطبيب:', 'Doctor:')) + '</strong> ' + esc(doc.doctorName) + '</div>' +
          '<div><strong>' + esc(bi('العيادة:', 'Clinic:')) + '</strong> ' + esc(doc.clinicName) + '</div>' +
          '<div><strong>' + esc(bi('الموعد:', 'Time:')) + '</strong> ' + formatMinutesAr(slot.startMinutes + slot.delayMinutes) + '</div>' +
          '<div><strong>' + esc(bi('اسم المريض:', 'Patient:')) + '</strong> ' + esc(member.fullName) + '</div>' +
          '<div style="color:var(--text-muted);font-size:0.86rem;">' + esc(bi('سيتم إغلاق الموعد فوراً باللون الأحمر عند تأكيد الحجز لمنع التضارب.', 'This slot will immediately turn red once confirmed to prevent conflicts.')) + '</div>' +
          '<button class="btn btn-green btn-block" id="btnConfirmBook" type="button">✓ ' + esc(bi('تأكيد الحجز الآن', 'Confirm Booking')) + '</button>',
          function () {
            let isSubmittingBook = false;
            const confirmBtn = document.getElementById('btnConfirmBook');
            confirmBtn.onclick = function () {
              if (isSubmittingBook) return;
              isSubmittingBook = true;
              confirmBtn.disabled = true;
              confirmBtn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span> ' + esc(bi('جاري تأكيد الحجز...', 'Booking...'));

              setTimeout(function () {
                try {
                  db = loadState();
                  const latestSlot = db.slots.find((s) => s.id === slot.id);
                  if (!latestSlot || latestSlot.status !== 'AVAILABLE') {
                    closeModal();
                    showToast(bi('عذراً، تم حجز هذا الموعد للتو', 'Sorry, this slot was just booked'));
                    renderApp();
                    return;
                  }
                  if (isPhoneBlocked(db.account.phone) || isPhoneBlocked(member.phone)) {
                    closeModal();
                    showToast(bi('عذراً، هذا الرقم محظور من الحجز عبر المنصة', 'Sorry, this phone number is blocked'));
                    return;
                  }
                  latestSlot.status = 'BOOKED';
                  latestSlot.patientName = member.fullName;
                  latestSlot.patientPhone = member.phone;
                  latestSlot.familyMemberId = member.id;
                  latestSlot.bookingSource = 'APP';
                  latestSlot.appointmentTimestamp = computeSlotAppointmentTimestampMs(latestSlot);
                  latestSlot.reminded2h = false;
                  latestSlot.reminded30m = false;
                  const newBookTime = formatMinutesAr((latestSlot.startMinutes || 0) + (latestSlot.delayMinutes || 0));
                  const bookAlert = '🩺 حجز جديد في ' + getClinicDisplayName(doc) + ': ' + member.fullName + ' (' + newBookTime + ')';
                  db.notifications.unshift({
                    id: Date.now(),
                    message: bookAlert,
                    isRead: false,
                    targetAudience: 'CLINIC',
                    targetId: doc.id,
                    senderLabel: member.fullName,
                    createdAtMillis: Date.now()
                  });
                  saveState(db);
                  scheduleSlotRemindersWeb(latestSlot, doc);
                  syncDocToFirestoreNamespace('slots', latestSlot.id, latestSlot);
                  syncDocToFirestoreNamespace('notifications', String(db.notifications[0].id), db.notifications[0]);
                  dispatchWorkerPush('NEW_BOOKING', getClinicDisplayName(doc), bookAlert, 'CLINIC', doc.id, CLOUD_PATHS.appointments);
                  triggerPlatformNotification(getClinicDisplayName(doc), bookAlert, 'book_' + latestSlot.id);
                  closeModal();
                  showToast(bi('تم تأكيد الحجز باسم ' + member.fullName + ' بنجاح', 'Appointment booked for ' + member.fullName));
                  renderApp();
                } finally {
                  isSubmittingBook = false;
                  if (confirmBtn) confirmBtn.disabled = false;
                }
              }, 160);
            };
          }
        );
      }

      function openAdminPinModal() {
        function renderPinBody() {
          const now = Date.now();
          const sec = db.adminSecurity || { failedAttempts: 0, lockoutUntilMillis: 0 };
          const isLocked = sec.lockoutUntilMillis > now;
          const remSecs = isLocked ? Math.ceil((sec.lockoutUntilMillis - now) / 1000) : 0;
          const mins = Math.floor(remSecs / 60);
          const secs = remSecs % 60;
          const countdownLabel = (mins < 10 ? '0' + mins : mins) + ':' + (secs < 10 ? '0' + secs : secs);

          return (
            '<div class="card" style="background:var(--teal-soft);border:none;padding:12px;">' +
              '<div style="font-weight:800;color:var(--teal-text);">🛡️ ' + esc(bi('بوابة الإدارة العليا المحمية', 'Protected Super Admin Portal')) + '</div>' +
              '<div style="font-size:0.84rem;color:var(--teal-text);">' + esc(db.config.adminOwnerName || 'المدير العام') + ' • ' + esc(bi('حماية مزدوجة برقم سري (PIN)', 'Double PIN Protection')) + '</div>' +
            '</div>' +
            (isLocked
              ? '<div class="alert-banner" style="background:var(--booked-bg);border-color:var(--booked-border);color:var(--booked-text);">' +
                  '🔒 ' + esc(bi('تم قفل الدخول لمدة 15 دقيقة بعد 3 محاولات خاطئة. الوقت المتبقي:', 'Locked for 15 minutes after 3 wrong attempts. Remaining:')) + ' <strong id="pinLockCountdown" dir="ltr">' + countdownLabel + '</strong>' +
                '</div>'
              : renderPasswordFieldHtml('adminPinInput', '', bi('أدخل الرقم السري للإدارة (Admin PIN)', 'Enter Admin PIN'), 'inputmode="numeric"') +
                (sec.failedAttempts > 0
                  ? '<div style="color:var(--booked-border);font-size:0.84rem;font-weight:700;">' + esc(bi('تنبيه: المحاولات المتبقية قبل القفل (15 دقيقة): ', 'Warning: Remaining attempts before 15-min lock: ')) + Math.max(0, MAX_ADMIN_PIN_ATTEMPTS - sec.failedAttempts) + '</div>'
                  : '') +
                '<button class="btn btn-primary btn-block" id="btnVerifyAdminPin" type="button">🔓 ' + esc(bi('فتح لوحة التحكم', 'Unlock Dashboard')) + '</button>')
          );
        }

        function mountPinHandlers() {
          const now = Date.now();
          const sec = db.adminSecurity || { failedAttempts: 0, lockoutUntilMillis: 0 };
          if (sec.lockoutUntilMillis > now) {
            modalIntervalTimer = setInterval(function () {
              const rem = Math.ceil((db.adminSecurity.lockoutUntilMillis - Date.now()) / 1000);
              const el = document.getElementById('pinLockCountdown');
              if (rem <= 0) {
                clearInterval(modalIntervalTimer);
                modalIntervalTimer = null;
                const body = document.getElementById('modalBody');
                if (body) {
                  body.innerHTML = renderPinBody();
                  mountPinHandlers();
                  bindPasswordToggleButtons(body);
                }
              } else if (el) {
                const m = Math.floor(rem / 60);
                const s = rem % 60;
                el.textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
              }
            }, 1000);
            return;
          }

          const inp = document.getElementById('adminPinInput');
          const btn = document.getElementById('btnVerifyAdminPin');
          function submitPin() {
            const res = verifyAdminPinAttempt(inp ? inp.value : '');
            if (res.ok) {
              ui.isAdminLoggedIn = true;
              ui.roleMode = 'ADMIN';
              try {
                localStorage.setItem(ADMIN_SESSION_KEY, '1');
                localStorage.setItem(ADMIN_ROLE_ACTIVE_KEY, '1');
              } catch (e) {}
              closeModal();
              showToast(bi('تم فتح لوحة تحكم الإدارة العليا بنجاح', 'Super Admin dashboard unlocked'));
              syncFcmTokenToFirestore();
              renderApp();
              pullCloudStateViaRestWeb(['accounts', 'messages', 'notifications', 'slots']);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
              showToast(res.error);
              const body = document.getElementById('modalBody');
              if (body) {
                body.innerHTML = renderPinBody();
                mountPinHandlers();
                bindPasswordToggleButtons(body);
              }
            }
          }
          if (btn) btn.onclick = submitPin;
          if (inp) {
            inp.focus();
            inp.onkeydown = function (e) { if (e.key === 'Enter') submitPin(); };
          }
        }

        openModal(bi('التحقق الأمني للإدارة العليا (PIN)', 'Super Admin Security Check (PIN)'), renderPinBody(), mountPinHandlers);
      }

                    '<button class="legal-link-btn" type="button" data-acc-legal="TERMS" style="font-size:0.76rem;padding:4px 10px;">⚖️ ' + esc(bi('شروط الاستخدام', 'Terms of Use')) + '</button>' +
                  '</div>' +
                  '<div id="regCloudErrorBox" style="display:none;background:#FEF2F2;border:1.5px solid #DC2626;color:#991B1B;border-radius:10px;padding:8px 10px;font-size:0.84rem;font-weight:700;"></div>' +
                  '<button class="btn btn-primary btn-block" id="btnSubmitRegister" type="button">' + esc(bi('إنشاء الحساب والانتقال للتفعيل', 'Register & Proceed to Activation')) + '</button>' +
                '</div>'
              : (authMode === 'LOGIN'
                  ? '<div class="card" style="background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px;">' +
                      '<input class="input" id="loginPhoneInp" type="tel" inputmode="numeric" placeholder="' + esc(bi('رقم الهاتف أو الرقم القومي', 'Phone or National ID')) + '" dir="ltr" />' +
                      renderPasswordFieldHtml('loginPassInp', '', bi('الرقم السري (أرقام فقط - PIN)', 'Numeric PIN'), 'inputmode="numeric" data-pin-numeric="1" autocomplete="current-password"') +
                      '<button class="btn btn-primary btn-block" id="btnSubmitLogin" type="button">' + esc(bi('تسجيل الدخول', 'Sign In')) + '</button>' +
                    '</div>'
                  : ''));

          const linkedSpouse = (hasAcc && db.account.spouseAccountId)
            ? (db.accounts || []).find((a) => a.id === db.account.spouseAccountId)
            : null;
          const pendingSpouseReq = hasAcc
            ? (db.familyLinkRequests || []).find((r) =>
                r.status === 'PENDING' && (r.requesterAccountId === db.account.id || r.targetSpouseAccountId === db.account.id)
              )
            : null;
          const familyLinkHtml = hasAcc
            ? '<div class="card" style="background:#F8FAFC;border:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:8px;">' +
                '<div style="font-weight:800;color:var(--teal-text);font-size:0.92rem;">👨‍👩‍👧‍👦 ' + esc(bi('ربط حسابات الأسرة (الزوج / الزوجة)', 'Family Spouse Account Linking')) + '</div>' +
                (linkedSpouse
                  ? '<div style="font-size:0.84rem;color:var(--avail-text);font-weight:700;">✓ ' + esc(bi('مربوط بحساب: ', 'Linked with: ')) + esc(linkedSpouse.fullName) + ' (<span dir="ltr">' + esc(linkedSpouse.phone) + '</span>)</div>' +
                    '<div style="font-size:0.78rem;color:var(--text-muted);">' + esc(bi('ملفات الأبناء مشتركة تلقائياً. ملفك الطبي الشخصي خاص وسري افتراضياً.', 'Children profiles sync automatically. Your personal profile stays private by default.')) + '</div>' +
                    '<label style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;background:#fff;border:1px solid var(--border);border-radius:10px;cursor:pointer;">' +
                      '<span style="font-size:0.82rem;font-weight:700;">🔓 ' + esc(bi('السماح للزوج/الزوجة بالاطلاع على ملفي الطبي الشخصي', 'Allow spouse to view my personal medical file')) + '</span>' +
                      '<input type="checkbox" id="chkSpouseViewPersonalRecords"' + (db.account.allowSpouseViewPersonalRecords === true ? ' checked' : '') + ' />' +
                    '</label>'
                  : (pendingSpouseReq
                      ? '<div class="badge badge-booked" style="width:fit-content;">⏳ ' + esc(bi('يوجد طلب ربط أسرة قيد مراجعة الإدارة', 'Family link request pending Admin review')) + '</div>'
                      : '') +
                    '<button class="btn btn-outline btn-block" id="btnOpenPatientFamilyLink" type="button">👨‍👩‍👧‍👦 ' + esc(bi('ربط حساب الزوج / الزوجة (رفع الإثباتات)', 'Link Spouse Account (Upload Proofs)')) + '</button>') +
              '</div>'
            : '';

          return (
            (hasAcc
              ? '<div class="card" style="background:' + (isVerified ? 'var(--avail-bg)' : 'var(--teal-soft)') + ';border:' + (isVerified ? '1.5px solid var(--avail-border)' : 'none') + ';padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">' +
                  '<div>' +
                    '<div><strong>' + esc(bi('الحساب النشط:', 'Active Account:')) + '</strong> ' + esc(db.account.fullName) + '</div>' +
                    '<div style="font-size:0.84rem;">' + esc(bi('الهاتف:', 'Phone:')) + ' <span dir="ltr">' + esc(db.account.phone) + '</span>' + (db.account.nationalId ? ' • ' + esc(db.account.nationalId) : '') + '</div>' +
                  '</div>' +
                  '<span id="accountVerificationBadge" class="badge ' + (isVerified ? 'badge-avail' : 'badge-booked') + '">' + esc(getVerificationBadgeText(db.account)) + '</span>' +
                '</div>'
              : '<div class="card" style="background:var(--teal-soft);border:none;padding:12px;">' +
                  '<div style="font-weight:700;color:var(--teal-text);">' + esc(bi('لا يوجد حساب مسجل الدخول حالياً', 'No account signed in yet')) + '</div>' +
                  '<div style="font-size:0.84rem;color:var(--teal-text);">' + esc(bi('سجّل دخولك أو أنشئ حساباً جديداً لتأكيد الحجز وإدارة ملفك الطبي وملفات أسرتك.', 'Sign in or create a new account to book appointments and manage family records.')) + '</div>' +
                '</div>') +
            otpSuccessHtml +
            otpCardHtml +
            authTabsHtml +
            (hasAcc
              ? '<button class="btn btn-primary btn-block" id="btnPatientSupportChat" type="button" style="background:linear-gradient(135deg,#3730A3 0%,#4F46E5 100%);">' +
                  '💬 ' + esc(bi('مراسلة الإدارة / الدعم الفني', 'Message Admin / Support')) +
                  (getUnreadMessagesForPatientSupport() > 0 ? ' (' + getUnreadMessagesForPatientSupport() + ')' : '') +
                '</button>' +
                familyLinkHtml +
                '<h4>' + esc(bi('أفراد العائلة المسجلون', 'Registered Family Members')) + '</h4>' + mHtml +
                '<h4 style="margin-top:6px;">' + esc(bi('إضافة فرد جديد من العائلة', 'Add Family Member')) + '</h4>' +
                '<input class="input" id="newMemName" placeholder="' + esc(bi('الاسم الكامل', 'Full Name')) + '" />' +
                '<div style="display:grid;grid-template-columns:1.3fr 0.7fr;gap:8px;">' +
                  '<input class="input" id="newMemRel" value="' + esc(bi('الابن', 'Child')) + '" placeholder="' + esc(bi('صلة القرابة', 'Relation')) + '" />' +
                  '<input class="input" id="newMemAge" type="number" placeholder="' + esc(bi('العمر', 'Age')) + '" />' +
                '</div>' +
                '<input class="input" id="newMemNationalId" type="text" inputmode="numeric" maxlength="14" placeholder="' + esc(bi('الرقم القومي (14 رقم - اختياري)', 'National ID (14 digits - optional)')) + '" dir="ltr" />' +
                '<input class="input" id="newMemPhone" value="' + esc(db.account.phone) + '" placeholder="' + esc(bi('رقم الهاتف', 'Phone')) + '" dir="ltr" />' +
                '<button class="btn btn-primary btn-block" id="btnSubmitFamily" type="button">+ ' + esc(bi('إضافة إلى العائلة', 'Add to Family')) + '</button>' +
                '<button class="btn btn-danger-outline btn-block" id="btnPatientLogout" type="button" style="min-height:40px;">🚪 ' + esc(bi('تسجيل خروج من الحساب', 'Sign Out')) + '</button>'
              : '') +
            renderNotificationStatusCardHtml('account_notif') +
            '<div style="text-align:center;color:var(--text-muted);font-size:0.82rem;padding:8px 4px 2px;user-select:none;">' +
              esc(bi('إصدار التطبيق: ', 'App Version: ')) + esc(db.config.appVersionLabel || 'v1.0.0') +
            '</div>'
          );
        }

        function refreshAccountModal() {
          const body = document.getElementById('modalBody');
          if (!body) return;
          body.innerHTML = renderAccountBody();
          mountAccountHandlers();
          bindPasswordToggleButtons(body);
          bindNotificationStatusCard(body);
        }

        function mountAccountHandlers() {
          document.querySelectorAll('[data-pick-mem]').forEach((el) => {
            el.onclick = function () {
              db.activeMemberId = el.getAttribute('data-pick-mem');
              saveState(db);
              closeModal();
              renderApp();
            };
          });

          const otpInp = document.getElementById('otpCodeInput');
          const verifyBtn = document.getElementById('btnVerifyOtpSubmit');
          function submitOtpVerification() {
            const activeAcc = db.account;
            if (!activeAcc) {
              showToast(bi('يرجى تسجيل الدخول أولاً', 'Please sign in first'));
              return;
            }
            const rawVal = otpInp ? otpInp.value : '';
            const check = verifyAndBurnActivationCode(activeAcc, rawVal);
            if (!check.ok) {
              ui.otpErrorMsg = check.error;
              ui.otpSuccessMsg = '';
              showToast(check.error);
              refreshAccountModal();
              return;
            }
            ui.otpErrorMsg = '';
            ui.otpSuccessMsg = bi('تم تفعيل حسابك بنجاح! يمكنك الآن حجز المواعيد فوراً.', 'Account verified & activated! You can now book appointments.');
            showToast(ui.otpSuccessMsg);
            refreshAccountModal();
            renderApp();
          }
          if (verifyBtn) {
            verifyBtn.onclick = submitOtpVerification;
          }
          if (otpInp) {
            otpInp.onkeydown = function (e) {
              if (e.key === 'Enter') {
                e.preventDefault();
                submitOtpVerification();
              }
            };
          }

          const regenOtpBtn = document.getElementById('btnRegenUserOtp');
          if (regenOtpBtn) {
            regenOtpBtn.onclick = function () {
              if (!db.account) return;
              assignFreshUserOtp(db.account, db);
              const idx = (db.accounts || []).findIndex((a) => a.id === db.account.id || normalizePhoneDigits(a.phone) === normalizePhoneDigits(db.account.phone));
              if (idx >= 0) db.accounts[idx] = db.account;
              const otpReqMsg = '🔑 طلب كود تفعيل (OTP) جديد للعميل ' + db.account.fullName + ' (' + db.account.phone + '): ' + db.account.otpCode;
              const otpNotif = {
                id: Date.now(),
                message: otpReqMsg,
                isRead: false,
                targetAudience: 'ADMIN',
                targetId: db.account.id,
                senderLabel: bi('طلب كود تفعيل OTP', 'OTP Activation Request'),
                createdAtMillis: Date.now()
              };
              db.notifications.unshift(otpNotif);
              saveState(db);
              syncAccountToCloudNow(db.account);
              syncDocToFirestoreNamespace('notifications', String(otpNotif.id), otpNotif);
              dispatchWorkerPush('OTP_REQUESTED', '🔑 طلب كود تفعيل OTP جديد', otpReqMsg, 'ADMIN', db.account.id, CLOUD_PATHS.users);
              ui.otpErrorMsg = '';
              showToast(bi('تم توليد كود تفعيل جديد صالح لمدة 24 ساعة. اطلبه الآن عبر واتساب.', 'Generated a new 24h activation code. Request it via WhatsApp.'));
              refreshAccountModal();
            };
          }

          const regTabBtn = document.getElementById('btnShowRegTab');
          if (regTabBtn) {
            regTabBtn.onclick = function () {
              authMode = authMode === 'REGISTER' ? 'NONE' : 'REGISTER';
              refreshAccountModal();
            };
          }

          const loginTabBtn = document.getElementById('btnShowLoginTab');
          if (loginTabBtn) {
            loginTabBtn.onclick = function () {
              authMode = authMode === 'LOGIN' ? 'NONE' : 'LOGIN';
              refreshAccountModal();
            };
          }

          const submitRegBtn = document.getElementById('btnSubmitRegister');
          if (submitRegBtn) {
            let isRegSubmitting = false;
            submitRegBtn.onclick = async function () {
              if (isRegSubmitting) return;
              const errBox = document.getElementById('regCloudErrorBox');
              function showRegErr(msg) {
                if (errBox) {
                  errBox.textContent = msg;
                  errBox.style.display = 'block';
                }
                showToast(msg, 4500);
              }
              if (errBox) errBox.style.display = 'none';

              const fullName = document.getElementById('regFullName').value.trim();
              const phone = toAsciiDigits(document.getElementById('regPhone').value.trim());
              const nationalId = toAsciiDigits(document.getElementById('regNationalId').value.trim());
              const password = toAsciiDigits(document.getElementById('regPassword').value.trim());
              if (!fullName || normalizePhoneDigits(phone).length < 10 || !password) {
                showRegErr(bi('يرجى إدخال الاسم ورقم هاتف صحيح (11 رقم) والرقم السري', 'Enter full name, valid phone number, and Numeric PIN'));
                return;
              }
              if (!/^\d{4,}$/.test(password)) {
                showRegErr(bi('الرقم السري (PIN) يجب أن يتكون من أرقام فقط (4 أرقام على الأقل)', 'PIN must be numeric digits only (4+ digits)'));
                return;
              }
              if (isPhoneBlocked(phone)) {
                showRegErr(bi('عذراً، هذا الرقم محظور من التسجيل في المنصة', 'Sorry, this phone number is blocked'));
                return;
              }
              const duplicate = (db.accounts || []).find((a) => normalizePhoneDigits(a.phone) === normalizePhoneDigits(phone));
              if (duplicate) {
                showRegErr(bi('رقم الهاتف مسجل بالفعل، يمكنك تسجيل الدخول', 'Phone number already registered. Sign in instead.'));
                return;
              }

              isRegSubmitting = true;
              const origBtnText = submitRegBtn.textContent;
              submitRegBtn.disabled = true;
              submitRegBtn.textContent = bi('⏳ جاري إنشاء حسابك...', '⏳ Creating your account...');

              try {
                ui.otpSuccessMsg = '';
                ui.otpErrorMsg = '';
                const newAccId = 'acc_' + Date.now();
                const nowMs = Date.now();
                const newAcc = assignFreshUserOtp({
                  id: newAccId,
                  fullName: fullName,
                  phone: phone,
                  nationalId: nationalId,
                  password: password,
                  isPhoneVerified: false,
                  isVerified: false,
                  verifiedBy: '',
                  verifiedAtMillis: 0
                }, db, nowMs);
                const newSelfMem = normalizeFamilyMemberObj({
                  id: 'mem_' + nowMs,
                  accountId: newAccId,
                  fullName: fullName,
                  relation: 'نفسي (صاحب الحساب)',
                  age: 30,
                  phone: phone,
                  nationalId: nationalId
                });

                db.accounts = (db.accounts || []).concat([newAcc]);
                db.account = newAcc;
                db.familyMembers.push(newSelfMem);
                db.activeMemberId = newSelfMem.id;

                const regAlertMsg = '👤 عميل جديد سجل الآن: ' + fullName + ' - ' + phone + ' (OTP: ' + newAcc.otpCode + ')';
                const regNotif = {
                  id: nowMs,
                  message: regAlertMsg,
                  isRead: false,
                  targetAudience: 'ADMIN',
                  targetId: newAccId,
                  senderLabel: bi('تسجيل عميل جديد', 'New Customer Registration'),
                  createdAtMillis: nowMs
                };
                db.notifications.unshift(regNotif);

                saveState(db, { skipCloudSync: true });

                // Background Firestore sync (non-blocking, 3s max timeout, console-only error reporting)
                Promise.allSettled([
                  syncAccountToCloudNow(newAcc),
                  syncDocToFirestoreNamespace('family_members', newSelfMem.id, newSelfMem),
                  syncDocToFirestoreNamespace('notifications', String(regNotif.id), regNotif),
                  syncFcmTokenToFirestore(),
                  dispatchWorkerPush('NEW_USER_REGISTERED', '👤 عميل جديد سجل الآن', regAlertMsg, 'ADMIN', newAccId, CLOUD_PATHS.users)
                ]).then(function (results) {
                  results.forEach(function (r, idx) {
                    if (r.status === 'rejected') {
                      console.error('[TebFirestore] Background registration sync rejected #' + idx + ':', r.reason);
                    }
                  });
                }).catch(function (bgErr) {
                  console.error('[TebFirestore] Background registration sync error:', bgErr);
                });

                triggerPlatformNotification('👤 عميل جديد — طب الحجايزة', regAlertMsg, 'new_user_' + newAccId);

                await new Promise(function (resolve) { setTimeout(resolve, 120); });
                authMode = 'NONE';
                showToast(bi('تم إنشاء الحساب وتوليد كود تفعيل صالح لمدة 24 ساعة! اطلبه عبر واتساب أو فعّل من العيادة.', 'Account created with a 24h activation code! Request it via WhatsApp or verify at clinic.'));
                refreshAccountModal();
                renderApp();
              } catch (err) {
                console.error('[TebAuth] Registration unexpected error:', err);
                showRegErr(bi('حدث خطأ أثناء إنشاء الحساب، يرجى المحاولة مرة أخرى', 'Error creating account, please try again'));
              } finally {
                isRegSubmitting = false;
                if (submitRegBtn) {
                  submitRegBtn.disabled = false;
                  submitRegBtn.textContent = origBtnText;
                }
              }
            };
          }

          const submitLoginBtn = document.getElementById('btnSubmitLogin');
          if (submitLoginBtn) {
            submitLoginBtn.onclick = function () {
              const ident = toAsciiDigits(document.getElementById('loginPhoneInp').value.trim());
              const pass = toAsciiDigits(document.getElementById('loginPassInp').value.trim());
              if (isPhoneBlocked(ident)) {
                showToast(bi('عذراً، هذا الرقم محظور من استخدام المنصة', 'Sorry, this phone number is blocked'));
                return;
              }
              const found = (db.accounts || []).find((a) =>
                normalizePhoneDigits(a.phone) === normalizePhoneDigits(ident) ||
                (a.nationalId && toAsciiDigits(a.nationalId) === ident)
              );
              if (!found) {
                showToast(bi('لم يتم العثور على حساب بهذا الرقم', 'No account found with this number'));
                return;
              }
              if (isPhoneBlocked(found.phone)) {
                showToast(bi('عذراً، هذا الرقم محظور من استخدام المنصة', 'Sorry, this phone number is blocked'));
                return;
              }
              if (found.password && toAsciiDigits(found.password) !== pass && found.password !== pass) {
                showToast(bi('الرقم السري غير صحيح', 'Incorrect PIN'));
                return;
              }
              db.account = found;
              const ownMember = db.familyMembers.find((m) => m.accountId === found.id || normalizePhoneDigits(m.phone) === normalizePhoneDigits(found.phone));
              if (ownMember) db.activeMemberId = ownMember.id;
              if (found.isPhoneVerified === false) {
                showToast(bi('الحساب غير مفعّل: يرجى إدخال كود التفعيل ذي الاستخدام الواحد (6 أرقام)', 'Unverified account: enter 6-digit OTP'));
              } else {
                showToast(bi('تم تسجيل الدخول: ' + found.fullName, 'Signed in: ' + found.fullName));
              }
              saveState(db);
              syncFcmTokenToFirestore();
              authMode = 'NONE';
              refreshAccountModal();
              renderApp();
            };
          }

          const addFamSubmit = document.getElementById('btnSubmitFamily');
          if (addFamSubmit && db.account) {
            addFamSubmit.onclick = function () {
              const name = document.getElementById('newMemName').value.trim();
              if (!name) { showToast(bi('يرجى كتابة اسم فرد العائلة', 'Enter family member name')); return; }
              const natEl = document.getElementById('newMemNationalId');
              const natId = toAsciiDigits(natEl ? natEl.value : '').replace(/\D/g, '');
              if (natId && natId.length !== 14) {
                showToast(bi('الرقم القومي يجب أن يكون 14 رقماً أو اتركه فارغاً', 'National ID must be 14 digits or empty'));
                return;
              }
              const mem = normalizeFamilyMemberObj({
                id: 'mem_' + Date.now(),
                accountId: db.account.id,
                fullName: name,
                relation: document.getElementById('newMemRel').value.trim() || 'فرد عائلة',
                age: parseInt(document.getElementById('newMemAge').value, 10) || 25,
                phone: document.getElementById('newMemPhone').value.trim() || db.account.phone,
                nationalId: natId
              });
              db.familyMembers.push(mem);
              db.activeMemberId = mem.id;
              saveState(db);
              syncDocToFirestoreNamespace('family_members', mem.id, mem);
              closeModal();
              showToast(bi('تمت إضافة ' + name + ' إلى قائمة العائلة', 'Added ' + name + ' to family list'));
              renderApp();
            };
          }

          document.querySelectorAll('[data-acc-legal]').forEach((btn) => {
            btn.onclick = function () {
              openLegalFloatingModal(btn.getAttribute('data-acc-legal') === 'TERMS' ? 'TERMS' : 'PRIVACY');
            };
          });

          const openFamLinkBtn = document.getElementById('btnOpenPatientFamilyLink');
          if (openFamLinkBtn && db.account) {
            openFamLinkBtn.onclick = function () {
              const acc = db.account;
              closeModal();
              openFamilyLinkRequestModal(acc, acc.fullName);
            };
          }

          const spousePrivacyChk = document.getElementById('chkSpouseViewPersonalRecords');
          if (spousePrivacyChk && db.account) {
            spousePrivacyChk.onchange = function () {
              db.account.allowSpouseViewPersonalRecords = Boolean(spousePrivacyChk.checked);
              const idx = (db.accounts || []).findIndex((a) => a.id === db.account.id);
              if (idx >= 0) db.accounts[idx].allowSpouseViewPersonalRecords = db.account.allowSpouseViewPersonalRecords;
              saveState(db);
              syncAccountToCloudNow(db.account);
              showToast(bi(
                db.account.allowSpouseViewPersonalRecords
                  ? 'تم السماح للزوج/الزوجة بالاطلاع على ملفك الطبي الشخصي'

      function openExternalVisitModal(member) {
        if (!member) return;
        const todayIso = new Date().toISOString().slice(0, 10);
        let medRows = [{ name: '', dose: '', duration: '' }];
        let extAttachment = { dataUrl: '', mimeType: '', fileName: '' };

        function renderMedRows() {
          const box = document.getElementById('extMedsContainer');
          if (!box) return;
          box.innerHTML = medRows.map((row, idx) =>
            '<div class="card" style="padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:6px;">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                '<strong style="font-size:0.84rem;">💊 ' + esc(bi('دواء #' + (idx + 1), 'Medication #' + (idx + 1))) + '</strong>' +
                (medRows.length > 1
                  ? '<button class="chip" type="button" data-del-ext-med="' + idx + '" style="min-height:28px;padding:2px 8px;color:var(--booked-border);">' + esc(bi('حذف', 'Remove')) + '</button>'
                  : '') +
              '</div>' +
              '<input class="input" data-ext-med-field="name" data-idx="' + idx + '" value="' + esc(row.name) + '" placeholder="' + esc(bi('اسم الدواء (مثال: أوجمنتين 1 جم)', 'Medication name')) + '" />' +
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">' +
                '<input class="input" data-ext-med-field="dose" data-idx="' + idx + '" value="' + esc(row.dose) + '" placeholder="' + esc(bi('الجرعة (مثال: قرص كل 12 س)', 'Dosage')) + '" />' +
                '<input class="input" data-ext-med-field="duration" data-idx="' + idx + '" value="' + esc(row.duration) + '" placeholder="' + esc(bi('المدة (مثال: 7 أيام)', 'Duration')) + '" />' +
              '</div>' +
            '</div>'
          ).join('');

          box.querySelectorAll('[data-ext-med-field]').forEach((inp) => {
            inp.oninput = function () {
              const i = parseInt(inp.getAttribute('data-idx'), 10);
              const f = inp.getAttribute('data-ext-med-field');
              if (medRows[i]) medRows[i][f] = inp.value;
            };
          });
          box.querySelectorAll('[data-del-ext-med]').forEach((btn) => {
            btn.onclick = function () {
              medRows.splice(parseInt(btn.getAttribute('data-del-ext-med'), 10), 1);
              renderMedRows();
            };
          });
        }

        openModal(
          bi('تسجيل زيارة طبيب خارجي / خاص — ', 'Log External / Private Doctor Visit — ') + member.fullName,
          '<div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:8px;">' +
            '<input class="input" id="extDocName" placeholder="' + esc(bi('اسم الطبيب الخارجي *', 'Doctor Name *')) + '" />' +
            '<input class="input" id="extVisitDate" type="date" value="' + esc(todayIso) + '" dir="ltr" />' +
          '</div>' +
          '<label style="font-size:0.84rem;font-weight:700;">' + esc(bi('تخصص الطبيب *', 'Medical Specialty *')) +
            '<select class="select" id="extSpecialty">' +
              EXTERNAL_SPECIALTIES.map((s) => '<option value="' + esc(s.ar) + '">' + esc(bi(s.ar, s.en + ' (' + s.ar + ')')) + '</option>').join('') +
            '</select>' +
          '</label>' +
          '<input class="input" id="extDiagnosis" placeholder="' + esc(bi('التشخيص أو خلاصة الكشف *', 'Diagnosis or Visit Summary *')) + '" />' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px;">' +
            '<h4>' + esc(bi('الأدوية الموصوفة', 'Prescribed Medications')) + '</h4>' +
            '<button class="btn btn-outline" id="btnAddExtMedRow" type="button" style="min-height:36px;padding:4px 12px;">' + esc(bi('إضافة دواء +', '+ Add Med')) + '</button>' +
          '</div>' +
          '<div id="extMedsContainer" style="display:flex;flex-direction:column;gap:8px;"></div>' +
          '<textarea class="textarea" id="extNotes" placeholder="' + esc(bi('ملاحظات أو تعليمات إضافية (اختياري)', 'Extra clinical notes (optional)')) + '"></textarea>' +
          '<label class="btn btn-outline btn-block" style="cursor:pointer;">📎 ' +
            esc(bi('إرفاق صورة الروشتة أو ملف PDF (اختياري)', 'Attach Prescription Photo or PDF (optional)')) +
            '<input type="file" id="extAttachmentInput" accept="image/*,application/pdf" style="display:none;" />' +
          '</label>' +
          '<div id="extAttachmentPreview" style="font-size:0.84rem;color:var(--teal-text);"></div>' +
          '<button class="btn btn-primary btn-block" id="btnSaveExternalVisit" type="button">✓ ' + esc(bi('حفظ الزيارة في الملف الطبي', 'Save External Visit to Record')) + '</button>',
          function () {
            renderMedRows();

            document.getElementById('btnAddExtMedRow').onclick = function () {
              medRows.push({ name: '', dose: '', duration: '' });
              renderMedRows();
            };

            document.getElementById('extAttachmentInput').onchange = function (e) {
              const file = e.target.files[0];
              if (!file) return;
              readAttachmentWithCompression(file, function (res) {
                extAttachment = res;
                const prev = document.getElementById('extAttachmentPreview');
                if (prev) {
                  prev.innerHTML = res.mimeType === 'application/pdf'
                    ? '📑 ' + esc(bi('تم إرفاق ملف PDF: ', 'PDF attached: ')) + esc(res.fileName)
                    : '✓ ' + esc(bi('تم ضغط وإرفاق الصورة بنجاح', 'Image compressed & attached')) + '<br/><img class="attach-img" src="' + esc(res.dataUrl) + '" alt="معاينة" style="margin-top:6px;" />';
                }
              });
            };

            document.getElementById('btnSaveExternalVisit').onclick = function () {
              const docName = document.getElementById('extDocName').value.trim();
              const visitDate = (document.getElementById('extVisitDate').value || '').trim() || formatTodayAr();
              const specialty = document.getElementById('extSpecialty').value || 'تخصصات أخرى';
              const diagnosis = document.getElementById('extDiagnosis').value.trim();
              const notes = document.getElementById('extNotes').value.trim();

              if (!docName || !diagnosis) {
                showToast(bi('يرجى إدخال اسم الطبيب والتشخيص الطبي', 'Please enter doctor name and diagnosis'));
                return;
              }

              const formattedMeds = medRows
                .filter((r) => r.name.trim())
                .map((r) => {
                  const detail = [r.dose.trim(), r.duration.trim()].filter(Boolean).join(' • ');
                  return '• ' + r.name.trim() + (detail ? ' — ' + detail : '');
                })
                .join('\n');

              const bundle = BilingualMedicalTranslator.buildBilingualBundle({
                patientName: member.fullName,
                doctorName: docName,
                specialty: specialty + ' (زيارة خارجية)',
                diagnosisInput: diagnosis,
                medicationsInput: formattedMeds,
                notesInput: notes
              });

              const newExtRecId = 'ext_' + Date.now();
              const newExtRec = {
                id: newExtRecId,
                familyMemberId: member.id,
                patientName: member.fullName,
                patientPhone: member.phone,
                doctorId: '',
                doctorName: docName,
                specialty: specialty + ' (زيارة خارجية)',
                visitDateLabel: visitDate,
                diagnosis: bundle.diagnosisAr,
                medications: bundle.medicationsAr || formattedMeds,
                notes: bundle.notesAr || notes,
                diagnosisEn: bundle.diagnosisEn,
                medicationsEn: bundle.medicationsEn,
                notesEn: bundle.notesEn,
                aiReportAr: bundle.aiReportAr,
                aiReportEn: bundle.aiReportEn,
                attachmentDataUrl: extAttachment.dataUrl || '',
                attachmentMimeType: extAttachment.mimeType || '',
                attachmentName: extAttachment.fileName || '',
                extractedText: extAttachment.extractedText || '',
                driveFileUrl: '',
                recordType: 'EXTERNAL_VISIT',
                createdAtMillis: Date.now()
              };
              db.records.unshift(newExtRec);
              saveState(db);
              createAndSyncPermanentMedicalLogWeb(newExtRec, 'EXTERNAL_VISIT', docName);
              if (newExtRec.attachmentDataUrl) {
                uploadFileToGoogleDriveWebApp(newExtRec, '', 'زيارة طبية خارجية');
              }
              closeModal();
              showToast(bi('تم حفظ زيارة الطبيب الخارجي وتدوينها في السجل الدائم مدى الحياة', 'External visit saved & permanently logged'));
              renderApp();
              refreshMemberAiSummaryAsync(member.id, newExtRecId);
            };
          }
        );
      }
