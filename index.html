      let __isRestPullInFlight = false;
      async function pullCloudStateViaRestWeb(onlyFsCollections, opts) {
        if (__isRestPullInFlight) return false;
        const force = Boolean(opts && opts.force);
        if (force) {
          tebCloudRuntime.quotaBackoffUntil = 0;
        } else if (Date.now() < (tebCloudRuntime.quotaBackoffUntil || 0)) {
          return false;
        }
        const cfg = (db && db.config) || DEFAULT_CONFIG;
        if (!isFirebaseCloudConfigured(cfg)) return false;
        __isRestPullInFlight = true;
        tebCloudRuntime.lastPullAt = Date.now();
        let anyChanged = false;
        try {
          if (!onlyFsCollections) {
            const remoteCfg = await fetchSettingsViaRestWeb(cfg);
            if (remoteCfg) applyRemoteSettingsObject(remoteCfg);
          }
          const cols = Array.isArray(onlyFsCollections) && onlyFsCollections.length > 0
            ? CLOUD_SYNC_COLLECTIONS.filter((c) => onlyFsCollections.includes(c.fsCollection) || onlyFsCollections.includes(c.stateKey))
            : CLOUD_SYNC_COLLECTIONS;
          const fsDb = getOrCreateFirestore(cfg);
          await Promise.all(cols.map(async function (colDef) {
            if (!force && Date.now() < (tebCloudRuntime.quotaBackoffUntil || 0)) return;
            const remoteDocs = await fetchCollectionViaRestWeb(cfg, colDef.fsCollection);
            if (Array.isArray(remoteDocs)) {
              if (applyRemoteCollectionItems(colDef, remoteDocs, fsDb)) {
                anyChanged = true;
              }
            }
          }));
        } catch (e) { /* offline-safe REST pull */ }
        finally {
          __isRestPullInFlight = false;
        }
        return anyChanged;
      }

      function queueCloudSyncFromLocal(nextState) {
        if (tebCloudRuntime.pushTimer) clearTimeout(tebCloudRuntime.pushTimer);
        tebCloudRuntime.pushTimer = setTimeout(async function () {
          try {
            const st = nextState || db;
            if (!st || !isFirebaseCloudConfigured(st.config)) return;
            const fsDb = getOrCreateFirestore(st.config);

            const cfgJson = JSON.stringify(st.config || {});
            if (cfgJson !== tebCloudRuntime.lastSettingsJson) {
              await pushSettingsToCloudNow(st.config);
            }

            for (let i = 0; i < CLOUD_SYNC_COLLECTIONS.length; i++) {
              const colDef = CLOUD_SYNC_COLLECTIONS[i];
              await pushCollectionChangesToFirestore(fsDb, colDef, st[colDef.stateKey]);
            }
          } catch (e) { /* offline-safe background cloud push */ }
        }, 120);
      }

      function ensureRestFallbackPollingLoop() {
        if (tebCloudRuntime.restPollTimer) return;
        tebCloudRuntime.restPollTimer = setInterval(function () {
          if (typeof document !== 'undefined' && document.visibilityState !== 'visible') return;
          if (Date.now() < (tebCloudRuntime.quotaBackoffUntil || 0)) return;
          pullCloudStateViaRestWeb([
            'accounts',
            'family_members',
            'messages',
            'notifications',
            'slots',
            'doctors',
            'labs',
            'family_link_requests'
          ]);
        }, 45000);
      }

      function stopRealtimeCloudSync() {
        (tebCloudRuntime.unsubscribers || []).forEach((unsub) => {
          try { if (typeof unsub === 'function') unsub(); } catch (e) {}
        });
        tebCloudRuntime.unsubscribers = [];
        tebCloudRuntime.hydratedCols = {};
        tebCloudRuntime.isConnected = false;
        tebCloudRuntime.sdkHealthyCount = 0;
        if (tebCloudRuntime.restPollTimer) {
          clearInterval(tebCloudRuntime.restPollTimer);
          tebCloudRuntime.restPollTimer = null;
        }
      }

      function startRealtimeCloudSync() {
        const cfg = (db && db.config) || DEFAULT_CONFIG;
        if (!isFirebaseCloudConfigured(cfg)) {
          updateCloudStatusWeb(false, 'Firebase Config Incomplete');
          return;
        }

        const sig = getCloudConfigSig(cfg) + '|REST_45S';
        if (tebCloudRuntime.isConnected && tebCloudRuntime.activeConfigSig === sig) return;

        stopRealtimeCloudSync();
        tebCloudRuntime.activeConfigSig = sig;
        tebCloudRuntime.isConnected = true;
        getOrCreateFirestore(cfg);

        // Pure direct HTTPS REST API sync (45s foreground-only polling, immune to WebChannel hang)
        pullCloudStateViaRestWeb();
        ensureRestFallbackPollingLoop();
      }

      function saveState(nextState, opts) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
          if (!opts || !opts.skipCloudSync) {
            queueCloudSyncFromLocal(nextState);
          }
          return true;
        } catch (e) {
          showToast(bi('تنبيه لطيف: مساحة التخزين المحلية ممتلئة — جاري فتح خيار التنظيف الذكي', 'Storage warning: Local storage is full'));
          setTimeout(function () {
            if (typeof openModal === 'function') {
              openStorageQuotaRecoveryModal(nextState);
            }
          }, 60);
          return false;
        }
      }

      async function resolveTargetFcmTokens(targetAudience, targetId) {
        try {
          const cfg = (db && db.config) || DEFAULT_CONFIG;
          if (!Array.isArray(tebCloudRuntime.fcmTokensList) || Date.now() - (tebCloudRuntime.lastFcmFetchAt || 0) > 60000) {
            if (Date.now() >= (tebCloudRuntime.quotaBackoffUntil || 0)) {
              const rows = await fetchCollectionViaRestWeb(cfg, 'fcm_tokens');
              if (Array.isArray(rows)) {
                tebCloudRuntime.fcmTokensList = rows;
                tebCloudRuntime.lastFcmFetchAt = Date.now();
              }
            }
          }
          const aud = String(targetAudience || 'ALL').toUpperCase();
          const tid = String(targetId || '').trim();
          const tokensSet = new Set();
          (tebCloudRuntime.fcmTokensList || []).forEach((row) => {
            const tok = String((row && row.fcmToken) || '').trim();
            if (!tok) return;
            const rRole = String((row && row.role) || '').toUpperCase();
            const rUid = String((row && row.userId) || '');
            const rAcc = String((row && row.accountId) || '');
            if (aud === 'ALL') {
              tokensSet.add(tok);
            } else if (aud === 'ADMIN' && rRole === 'ADMIN') {
              tokensSet.add(tok);
            } else if (aud === 'CLINIC' && rRole === 'CLINIC' && (!tid || rUid === 'doctor_' + safeCloudDocId(tid) || rUid === tid)) {
              tokensSet.add(tok);
            } else if (aud === 'PATIENT' && (!tid || rAcc === tid || rUid === safeCloudDocId(tid) || rUid === tid || rRole === 'PATIENT')) {
              if (!tid || rAcc === tid || rUid === safeCloudDocId(tid) || rUid === tid) {
                tokensSet.add(tok);
              }
            }
          });
          return Array.from(tokensSet);
        } catch (e) {
          return [];
        }
      }

      async function dispatchWorkerPush(eventType, title, body, targetAudience, targetId, collectionPath) {
        try {
          const cfg = (db && db.config) || {};
          const wUrl = String(cfg.workerUrl || DEFAULT_CONFIG.workerUrl || '').trim();
          if (!wUrl || typeof fetch !== 'function') return;
          const cleanTitle = String(title || 'طب الحجايزة');
          const cleanBody = String(body || '');
          const tokens = await resolveTargetFcmTokens(targetAudience, targetId);
          await fetch(wUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tokens: tokens,
              title: cleanTitle,
              message: cleanBody,
              body: cleanBody,
              data: {
                namespace: CLOUD_NAMESPACE,
                collectionPath: collectionPath || CLOUD_PATHS.notifications,
                eventType: String(eventType || 'PLATFORM_ALERT'),
                targetAudience: String(targetAudience || 'ALL'),
                targetId: String(targetId || ''),
                title: cleanTitle,
                body: cleanBody
              },
              namespace: CLOUD_NAMESPACE,
              collectionPath: collectionPath || CLOUD_PATHS.notifications,
              eventType: eventType || 'PLATFORM_ALERT',
              targetAudience: String(targetAudience || 'ALL'),
              targetId: String(targetId || ''),
              fcmToken: String(tebCloudRuntime.fcmToken || ''),
              projectId: String(cfg.firebaseProjectId || DEFAULT_CONFIG.firebaseProjectId || ''),
              createdAtMillis: Date.now()
            })
          });
        } catch (e) { /* offline-safe worker dispatch */ }
      }

      function getFcmTokenOwnerKey() {
        try {
          if (ui && ui.isAdminLoggedIn) return 'admin';
          if (ui && ui.loggedInDoctorId) return 'doctor_' + safeCloudDocId(ui.loggedInDoctorId);
          if (ui && ui.loggedInLabId) return 'lab_' + safeCloudDocId(ui.loggedInLabId);
          if (db && db.account) return safeCloudDocId(getAccountCloudDocId(db.account) || db.account.id);
        } catch (e) {}
        return 'guest_device';
      }

      function getFcmTokenOwnerRole() {
        if (ui && ui.isAdminLoggedIn) return 'ADMIN';
        if (ui && ui.loggedInDoctorId) return 'CLINIC';
        if (ui && ui.loggedInLabId) return 'LAB';
        if (db && db.account) return 'PATIENT';
        return 'GUEST';
      }

      async function syncFcmTokenToFirestore(tokenOverride) {
        try {
          let token = String(tokenOverride || tebCloudRuntime.fcmToken || '').trim();
          if (!token && window.AndroidBridge && typeof window.AndroidBridge.getFcmToken === 'function') {
            token = String(window.AndroidBridge.getFcmToken() || '').trim();
            if (token) tebCloudRuntime.fcmToken = token;
          }
          if (!token) return false;
          const cfg = (db && db.config) || DEFAULT_CONFIG;
          if (!isFirebaseCloudConfigured(cfg)) return false;
          const ownerKey = getFcmTokenOwnerKey();
          const role = getFcmTokenOwnerRole();
          const payload = {
            id: ownerKey,
            userId: ownerKey,
            accountId: (db && db.account && db.account.id) || '',
            phone: (db && db.account && db.account.phone) || '',
            role: role,
            fcmToken: token,
            platform: (window.AndroidBridge ? 'ANDROID_WEBVIEW' : 'WEB'),
            updatedAtMillis: Date.now()
          };
          return await syncDocToFirestoreNamespace('fcm_tokens', ownerKey, payload);
        } catch (e) {
          return false;
        }
      }

      function initFirebaseCloudBridge() {
        try {
          const cfg = (db && db.config) || DEFAULT_CONFIG;
          if (!isFirebaseCloudConfigured(cfg)) return;
          const webCfg = {
            apiKey: String(cfg.firebaseApiKey || DEFAULT_CONFIG.firebaseApiKey).trim(),
            authDomain: String(cfg.firebaseAuthDomain || DEFAULT_CONFIG.firebaseAuthDomain).trim(),
            projectId: String(cfg.firebaseProjectId || DEFAULT_CONFIG.firebaseProjectId).trim(),
            storageBucket: String(cfg.firebaseStorageBucket || DEFAULT_CONFIG.firebaseStorageBucket).trim(),
            messagingSenderId: String(cfg.firebaseMessagingSenderId || DEFAULT_CONFIG.firebaseMessagingSenderId).trim(),
            appId: String(cfg.firebaseAppId || DEFAULT_CONFIG.firebaseAppId).trim(),
            vapidKey: String(cfg.firebaseVapidKey || DEFAULT_CONFIG.firebaseVapidKey).trim()
          };
          getOrCreateFirestore(cfg);
          if (window.AndroidBridge && typeof window.AndroidBridge.getFcmToken === 'function') {
            const apkTok = String(window.AndroidBridge.getFcmToken() || '').trim();
            if (apkTok) {
              tebCloudRuntime.fcmToken = apkTok;
              syncFcmTokenToFirestore(apkTok);
            }
          }
          function acquireAndSyncToken(msgSdk, reg) {
            if (!msgSdk || !webCfg.vapidKey || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
            msgSdk.getToken({ vapidKey: webCfg.vapidKey, serviceWorkerRegistration: reg })
              .then((token) => {
                if (token) {
                  tebCloudRuntime.fcmToken = token;
                  syncFcmTokenToFirestore(token);
                }
              })
              .catch(() => {});
          }
          if ('serviceWorker' in navigator && /^https?:$/i.test(window.location.protocol)) {
            navigator.serviceWorker.register('./firebase-messaging-sw.js').then((reg) => {
              const targetWorker = reg.active || reg.waiting || reg.installing;
              if (targetWorker && targetWorker.postMessage) {
                targetWorker.postMessage({ type: 'TEB_INIT_FIREBASE', config: webCfg });
              }
              if (typeof firebase !== 'undefined' && firebase.messaging && tebCloudRuntime.firebaseApp) {
                try {
                  const msgSdk = firebase.messaging(tebCloudRuntime.firebaseApp);
                  acquireAndSyncToken(msgSdk, reg);
                  if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission().then((perm) => {
                      if (perm === 'granted') acquireAndSyncToken(msgSdk, reg);
                    }).catch(() => {});
                  }
                  if (!tebCloudRuntime._boundOnMsg && msgSdk.onMessage) {
                    tebCloudRuntime._boundOnMsg = true;
                    msgSdk.onMessage((payload) => {
                      const notif = (payload && payload.notification) || {};
                      if (notif.title || notif.body) {
                        showToast((notif.title ? notif.title + ': ' : '') + (notif.body || ''));
                      }
                    });
                  }
                } catch (err) {}
              }
            }).catch(() => {});
          }
          startRealtimeCloudSync();
          if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission().catch(() => {});
          }
        } catch (e) { /* safe fallback */ }
      }

      function isNotifPermissionGrantedWeb() {
        try {
          if (window.AndroidBridge && typeof window.AndroidBridge.areNotificationsEnabled === 'function') {
            return Boolean(window.AndroidBridge.areNotificationsEnabled());
          }
          if (window.AndroidBridge && typeof window.AndroidBridge.isNotificationPermissionGranted === 'function') {
            return Boolean(window.AndroidBridge.isNotificationPermissionGranted());
          }
          if (window.AndroidNotifBridge && typeof window.AndroidNotifBridge.hasPermission === 'function') {
            return Boolean(window.AndroidNotifBridge.hasPermission());
          }
          return typeof Notification !== 'undefined' && Notification.permission === 'granted';
        } catch (e) {
          return false;
        }
      }

      function triggerPlatformNotification(title, body, tag) {
        const cleanTitle = String(title || 'طب الحجايزة');
        const cleanBody = String(body || '');
        if (!cleanBody) return false;
        try {
          if (window.AndroidBridge && typeof window.AndroidBridge.showNativeNotification === 'function') {
            window.AndroidBridge.showNativeNotification(cleanTitle, cleanBody);
            return true;
          }
          if (window.AndroidNotifBridge && typeof window.AndroidNotifBridge.showNotification === 'function') {
            return Boolean(window.AndroidNotifBridge.showNotification(cleanTitle, cleanBody));
          }
          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistration) {
              navigator.serviceWorker.getRegistration().then((reg) => {
                if (reg && reg.showNotification) {
                  reg.showNotification(cleanTitle, { body: cleanBody, tag: tag || 'teb-alert', dir: 'rtl' });
                } else {
                  new Notification(cleanTitle, { body: cleanBody, tag: tag || 'teb-alert', dir: 'rtl' });
                }
              }).catch(() => {
                try { new Notification(cleanTitle, { body: cleanBody, tag: tag || 'teb-alert' }); } catch (e2) {}
              });
            } else {
              new Notification(cleanTitle, { body: cleanBody, tag: tag || 'teb-alert' });
            }
            return true;
          }
        } catch (e) { /* safe fallback */ }
        return false;
      }

      function scheduleSlotRemindersWeb(slot, docObj) {
        if (!slot || slot.status !== 'BOOKED') return;
        const effMin = (slot.startMinutes || 0) + (slot.delayMinutes || 0);
        const docName = docObj ? getDoctorDisplayName(docObj) : 'الطبيب';
        const clinicName = docObj ? getClinicDisplayName(docObj) : 'العيادة';
        try {
          if (window.AndroidNotifBridge && typeof window.AndroidNotifBridge.scheduleAppointmentReminders === 'function') {
            window.AndroidNotifBridge.scheduleAppointmentReminders(String(slot.id), String(docName), String(clinicName), Number(effMin));
          }
        } catch (e) {}
      }

      function cancelSlotRemindersWeb(slotId) {
        if (!slotId) return;
        try {
          if (window.AndroidNotifBridge && typeof window.AndroidNotifBridge.cancelReminder === 'function') {
            window.AndroidNotifBridge.cancelReminder(String(slotId));
          }
        } catch (e) {}
      }

      function computeSlotAppointmentTimestampMs(slot) {
        if (!slot) return 0;
        const effMin = (Number(slot.startMinutes) || 0) + (Number(slot.delayMinutes) || 0);
        const d = new Date();
        d.setHours(Math.floor(effMin / 60), effMin % 60, 0, 0);
        return d.getTime();
      }

      function checkUpcomingSlotRemindersWeb() {
        try {
          if (!db || !Array.isArray(db.slots) || !db.account) return;
          const accDigits = normalizePhoneDigits(db.account.phone);
          const nowMin = getCurrentLocalMinutesOfDay();
          const dayKey = new Date().toISOString().slice(0, 10);
          let firedMap = {};
          try { firedMap = JSON.parse(localStorage.getItem('teb_web_reminders_fired_v1') || '{}'); } catch (e) { firedMap = {}; }

          let changed = false;
          db.slots.forEach((s) => {
            if (s.status !== 'BOOKED') return;
            const slotDigits = normalizePhoneDigits(s.patientPhone);
            if (accDigits && slotDigits && slotDigits !== accDigits) return;
            const effMin = (s.startMinutes || 0) + (s.delayMinutes || 0);
            const remMin = effMin - nowMin;
            const docObj = (db.doctors || []).find((d) => d.id === s.doctorId);
            const clinicLabel = docObj ? getClinicDisplayName(docObj) : bi('العيادة', 'Clinic');
            let winTag = '';
            let bodyMsg = '';
            let is2hWin = false;
            let is30mWin = false;
            if (remMin > 55 && remMin <= 125 && !s.reminded2h) {
              winTag = 'early_' + dayKey + '_' + s.id;
              is2hWin = true;
              bodyMsg = bi('تذكير: موعدك في ' + clinicLabel + ' بعد ' + (remMin >= 90 ? 'ساعتين' : 'ساعة') + ' (' + formatMinutesAr(effMin) + ')', 'Reminder: Your appointment at ' + clinicLabel + ' is soon (' + formatMinutesAr(effMin) + ')');
            } else if (remMin > 0 && remMin <= 35 && !s.reminded30m) {
              winTag = '30m_' + dayKey + '_' + s.id;
              is30mWin = true;
              bodyMsg = bi('اقترب موعدك: متبقي نصف ساعة تقريباً على الكشف في ' + clinicLabel + ' (' + formatMinutesAr(effMin) + ')', 'Appointment in ~30 min at ' + clinicLabel + ' (' + formatMinutesAr(effMin) + ')');
            }
            if (winTag && !firedMap[winTag]) {
              firedMap[winTag] = Date.now();
              changed = true;
              if (is2hWin) s.reminded2h = true;
              if (is30mWin) s.reminded30m = true;
              syncDocToFirestoreNamespace('slots', s.id, s);
              triggerPlatformNotification('⏰ ' + bi('تذكير بموعد الكشف — طب الحجايزة', 'Appointment Reminder'), bodyMsg, winTag);
              showToast('⏰ ' + bodyMsg);
            }
          });
          if (changed) {
            saveState(db, { skipCloudSync: true });
            try { localStorage.setItem('teb_web_reminders_fired_v1', JSON.stringify(firedMap)); } catch (e) {}
          }
        } catch (e) {}
      }

      window.__onAndroidNotifPermissionUpdated = function () {
        document.querySelectorAll('[data-notif-status-card]').forEach((wrap) => {
          const tag = wrap.getAttribute('data-notif-status-card') || 'card';
          const parent = wrap.parentElement;
          if (parent) {
            const temp = document.createElement('div');
            temp.innerHTML = renderNotificationStatusCardHtml(tag);
            const nextCard = temp.firstElementChild;
            if (nextCard) {
              parent.replaceChild(nextCard, wrap);
              bindNotificationStatusCard(parent);
            }
          }
        });
      };

      function getCurrentLocalMinutesOfDay() {
        const now = new Date();
        return now.getHours() * 60 + now.getMinutes();
      }

      function getPatientModifyEligibility(slot) {
        const effectiveMin = (slot.startMinutes || 0) + (slot.delayMinutes || 0);
        const nowMin = getCurrentLocalMinutesOfDay();
        const remainingMin = effectiveMin - nowMin;
        return {
          allowed: remainingMin >= PATIENT_MODIFY_CUTOFF_MINUTES,
          remainingMinutes: remainingMin
        };
      }

      function executeCancelSlot(slotId, actorRole) {
        const slot = db.slots.find((s) => s.id === slotId);
        if (!slot || slot.status !== 'BOOKED') return false;
        const isPatient = actorRole === 'PATIENT';
        if (isPatient) {
          const gate = getPatientModifyEligibility(slot);
          if (!gate.allowed) {
            showToast(bi(
              'عذراً، لا يمكن إلغاء الموعد قبل الكشف بأقل من ساعتين (' + Math.max(0, gate.remainingMinutes) + ' دقيقة متبقية) — تواصل مع سكرتيرة العيادة',
              'Patients cannot cancel within 2 hours of the appointment — please contact the clinic secretary'
            ));
            return false;
          }
        }
        const prevPatientName = slot.patientName || bi('مريض', 'Patient');
        const prevPatientPhone = slot.patientPhone || '';
        const prevTimeLabel = formatMinutesAr((slot.startMinutes || 0) + (slot.delayMinutes || 0));
        const docObj = db.doctors.find((d) => d.id === slot.doctorId);
        const clinicLabel = docObj ? getClinicDisplayName(docObj) : bi('العيادة', 'Clinic');

        slot.status = 'AVAILABLE';
        slot.patientName = '';
        slot.patientPhone = '';
        slot.familyMemberId = '';
        slot.bookingSource = '';
        slot.appointmentTimestamp = 0;
        slot.reminded2h = false;
        slot.reminded30m = false;

        let alertMsg = '';
        if (isPatient) {
          alertMsg = '🗓️ تم إلغاء موعد المريض ' + prevPatientName + ' (الساعة ' + prevTimeLabel + ') بواسطة المريض وأصبح الموعد متاحاً.';
          db.notifications.unshift({
            id: Date.now(),
            message: alertMsg,
            isRead: false,
            targetAudience: 'CLINIC',
            targetId: slot.doctorId,
            senderLabel: prevPatientName,
            createdAtMillis: Date.now()
          });
          dispatchWorkerPush('APPOINTMENT_CANCELLED_BY_PATIENT', clinicLabel, alertMsg, 'CLINIC', slot.doctorId, CLOUD_PATHS.appointments);
        } else {
          const targetAcc = (db.accounts || []).find((a) => normalizePhoneDigits(a.phone) === normalizePhoneDigits(prevPatientPhone));
          alertMsg = '🗓️ إشعار من ' + clinicLabel + ': تم إلغاء موعد ' + prevPatientName + ' (الساعة ' + prevTimeLabel + ') وإتاحته بالجدول.';
          db.notifications.unshift({
            id: Date.now(),
            message: alertMsg,
            isRead: false,
            targetAudience: 'PATIENT',
            targetId: targetAcc ? targetAcc.id : '',
            senderLabel: clinicLabel,
            createdAtMillis: Date.now()
          });
          dispatchWorkerPush('APPOINTMENT_CANCELLED_BY_CLINIC', clinicLabel, alertMsg, 'PATIENT', targetAcc ? targetAcc.id : '', CLOUD_PATHS.appointments);
        }
        saveState(db);
        cancelSlotRemindersWeb(slot.id);
        syncDocToFirestoreNamespace('slots', slot.id, slot);
        triggerPlatformNotification(clinicLabel, alertMsg, 'cancel_' + slot.id);
        showToast(bi('تم إلغاء الحجز وإعادة الموعد متاحاً باللون الأخضر', 'Booking cancelled; slot is open again'));
        renderApp();
        return true;
      }

      function executeRescheduleSlot(fromSlotId, toSlotId, actorRole) {
        const fromSlot = db.slots.find((s) => s.id === fromSlotId);
        const toSlot = db.slots.find((s) => s.id === toSlotId);
        if (!fromSlot || fromSlot.status !== 'BOOKED' || !toSlot || toSlot.status !== 'AVAILABLE') {
          showToast(bi('الموعد المختار لم يعد متاحاً للتحويل', 'Target slot is no longer available'));
          return false;
        }
        const isPatient = actorRole === 'PATIENT';
        if (isPatient) {
          const gate = getPatientModifyEligibility(fromSlot);
          if (!gate.allowed) {
            showToast(bi(
              'عذراً، لا يمكن تعديل الموعد قبل الكشف بأقل من ساعتين — يرجى التواصل مع سكرتيرة العيادة',
              'Patients cannot reschedule within 2 hours of the appointment — please contact the clinic secretary'
            ));
            return false;
          }
        }
        const patientName = fromSlot.patientName;
        const patientPhone = fromSlot.patientPhone;
        const familyMemberId = fromSlot.familyMemberId;
        const bookingSource = fromSlot.bookingSource;
        const oldTimeLabel = formatMinutesAr((fromSlot.startMinutes || 0) + (fromSlot.delayMinutes || 0));
        const newTimeLabel = formatMinutesAr((toSlot.startMinutes || 0) + (toSlot.delayMinutes || 0));
        const docObj = db.doctors.find((d) => d.id === fromSlot.doctorId);
        const clinicLabel = docObj ? getClinicDisplayName(docObj) : bi('العيادة', 'Clinic');

        fromSlot.status = 'AVAILABLE';
        fromSlot.patientName = '';
        fromSlot.patientPhone = '';
        fromSlot.familyMemberId = '';
        fromSlot.bookingSource = '';
        fromSlot.appointmentTimestamp = 0;
        fromSlot.reminded2h = false;
        fromSlot.reminded30m = false;

        toSlot.status = 'BOOKED';
        toSlot.patientName = patientName;
        toSlot.patientPhone = patientPhone;
        toSlot.familyMemberId = familyMemberId;
        toSlot.bookingSource = bookingSource;
        toSlot.appointmentTimestamp = computeSlotAppointmentTimestampMs(toSlot);
        toSlot.reminded2h = false;
        toSlot.reminded30m = false;

        let alertMsg = '';
        if (isPatient) {
          alertMsg = '🔄 قام المريض ' + patientName + ' بتعديل موعده من ' + oldTimeLabel + ' إلى ' + newTimeLabel + '.';
          db.notifications.unshift({
            id: Date.now(),
            message: alertMsg,
            isRead: false,
            targetAudience: 'CLINIC',
            targetId: fromSlot.doctorId,
            senderLabel: patientName,
            createdAtMillis: Date.now()
          });
          dispatchWorkerPush('APPOINTMENT_RESCHEDULED_BY_PATIENT', clinicLabel, alertMsg, 'CLINIC', fromSlot.doctorId, CLOUD_PATHS.appointments);
        } else {
          const targetAcc = (db.accounts || []).find((a) => normalizePhoneDigits(a.phone) === normalizePhoneDigits(patientPhone));
          alertMsg = '🔄 تنبيه من ' + clinicLabel + ': تم تعديل موعد كشف ' + patientName + ' من ' + oldTimeLabel + ' إلى الساعة ' + newTimeLabel + '.';
          db.notifications.unshift({
            id: Date.now(),
            message: alertMsg,
            isRead: false,
            targetAudience: 'PATIENT',
            targetId: targetAcc ? targetAcc.id : '',
            senderLabel: clinicLabel,
            createdAtMillis: Date.now()
          });
          dispatchWorkerPush('APPOINTMENT_RESCHEDULED_BY_CLINIC', clinicLabel, alertMsg, 'PATIENT', targetAcc ? targetAcc.id : '', CLOUD_PATHS.appointments);
        }
        saveState(db);
        cancelSlotRemindersWeb(fromSlot.id);
        scheduleSlotRemindersWeb(toSlot, docObj);
        syncDocToFirestoreNamespace('slots', fromSlot.id, fromSlot);
        syncDocToFirestoreNamespace('slots', toSlot.id, toSlot);

      function dataUrlToUint8Array(dataUrl) {
        try {
          const str = String(dataUrl || '');
          const commaIdx = str.indexOf(',');
          const b64 = commaIdx >= 0 ? str.slice(commaIdx + 1) : str;
          const bin = atob(b64.replace(/\s+/g, ''));
          const len = bin.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = bin.charCodeAt(i);
          }
          return bytes;
        } catch (e) {
          return null;
        }
      }

      function dataUrlToBlob(dataUrl, fallbackMime) {
        const bytes = dataUrlToUint8Array(dataUrl);
        if (!bytes) return null;
        const mimeMatch = String(dataUrl || '').match(/^data:([^;]+);/i);
        const mime = (mimeMatch && mimeMatch[1]) || fallbackMime || 'application/octet-stream';
        return new Blob([bytes], { type: mime });
      }

      async function extractTextFromPdfBytes(bytes) {
        if (!bytes || !window.pdfjsLib) return '';
        try {
          const loadingTask = window.pdfjsLib.getDocument({
            data: bytes.slice(),
            cMapUrl: PDFJS_ASSETS_BASE + 'cmaps/',
            cMapPacked: true,
            standardFontDataUrl: PDFJS_ASSETS_BASE + 'standard_fonts/'
          });
          const pdfDoc = await loadingTask.promise;
          const pageLimit = Math.min(pdfDoc.numPages || 0, 15);
          const pagesOut = [];
          for (let p = 1; p <= pageLimit; p++) {
            const page = await pdfDoc.getPage(p);
            const tc = await page.getTextContent();
            const items = (tc && Array.isArray(tc.items)) ? tc.items : [];
            const lines = [];
            let currentLine = [];
            let lastY = null;
            for (let i = 0; i < items.length; i++) {
              const item = items[i];
              const str = String(item && item.str ? item.str : '').trim();
              const y = item && Array.isArray(item.transform) ? item.transform[5] : null;
              if (lastY !== null && y !== null && Math.abs(y - lastY) > 3.5 && currentLine.length > 0) {
                lines.push(currentLine.join(' ').replace(/\s+/g, ' ').trim());
                currentLine = [];
              }
              if (str) currentLine.push(str);
              if (item && item.hasEOL && currentLine.length > 0) {
                lines.push(currentLine.join(' ').replace(/\s+/g, ' ').trim());
                currentLine = [];
                lastY = null;
              } else if (y !== null) {
                lastY = y;
              }
            }
            if (currentLine.length > 0) {
              lines.push(currentLine.join(' ').replace(/\s+/g, ' ').trim());
            }
            const pageText = lines.filter(Boolean).join('\n');
            if (pageText) pagesOut.push(pageText);
          }
          return pagesOut.join('\n').slice(0, 12000);
        } catch (e) {
          return '';
        }
      }

      function readAttachmentWithCompression(file, onDone) {
        if (!file) return;
        const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
        if (isPdf) {
          if (file.size > 3 * 1024 * 1024) {
            showToast(bi('حجم ملف الـ PDF كبير جداً للتخزين المحلي (الحد الأقصى 3 ميجا)', 'PDF file exceeds 3MB browser storage limit'));
            return;
          }
          const reader = new FileReader();
          reader.onload = async function () {
            const dataUrl = reader.result;
            let extractedText = '';
            try {
              setGlobalLoading(true, bi('جاري قراءة واستخراج نتائج ملف الـ PDF...', 'Reading & extracting PDF clinical content...'));
              const bytes = dataUrlToUint8Array(dataUrl);
              extractedText = await extractTextFromPdfBytes(bytes);
            } catch (e) { /* safe fallback */ }
            setGlobalLoading(false);
            onDone({
              dataUrl: dataUrl,
              mimeType: 'application/pdf',
              fileName: file.name || 'report.pdf',
              extractedText: extractedText
            });
          };
          reader.readAsDataURL(file);
          return;
        }
        const reader = new FileReader();
        reader.onload = function () {
          const img = new Image();
          img.onload = function () {
            const maxDim = 1024;
            let w = img.width || 800;
            let h = img.height || 600;
            if (w > maxDim || h > maxDim) {
              if (w >= h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            try {
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              let quality = 0.72;
              let compressedUrl = canvas.toDataURL('image/jpeg', quality);
              while (compressedUrl.length > 220000 && quality > 0.42) {
                quality = Math.max(0.42, quality - 0.1);
                compressedUrl = canvas.toDataURL('image/jpeg', quality);
              }
              onDone({
                dataUrl: compressedUrl,
                mimeType: 'image/jpeg',
                fileName: file.name || 'image.jpg',
                extractedText: ''
              });
            } catch (err) {
              onDone({
                dataUrl: reader.result,
                mimeType: file.type || 'image/jpeg',
                fileName: file.name || 'image.jpg',
                extractedText: ''
              });
            }
          };
          img.onerror = function () {
            onDone({
              dataUrl: reader.result,
              mimeType: file.type || 'image/jpeg',
              fileName: file.name || 'image.jpg',
              extractedText: ''
            });
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      }

      function isLabMetadataHeaderLine(line) {
        const lower = String(line || '').toLowerCase().trim();
        const headerTokens = [
          'patient name', 'patient id', 'patient no', 'sample date', 'report date', 'reporting date',
          'reported on', 'reported at', 'request date', 'request id', 'request no', 'ordered date',
          'collection date', 'collection time', 'printed on', 'printed at', 'print date',
          'referred by', 'ref. by', 'ref by', 'ref. no', 'ref no', 'doctor name', 'physician',
          'lab name', 'laboratory', 'branch', 'accession', 'specimen', 'barcode', 'serial',
          'receipt', 'invoice', 'gender', 'sex:', 'age:', 'age ', 'dob', 'date of birth',
          'national id', 'passport', 'page ', 'tel:', 'phone:', 'mobile:', 'address:',
          'اسم المريض', 'تاريخ التقرير', 'تاريخ الطلب', 'تاريخ الطباعة', 'تاريخ العينة',
          'تاريخ التحليل', 'اسم المعمل', 'الطبيب المعالج', 'رقم الهاتف', 'العنوان',
          'رقم العينة', 'رقم الطلب', 'كود المريض', 'الباركود', 'السن:', 'العمر:', 'النوع:'
        ];
        if (headerTokens.some((tok) => lower.includes(tok))) return true;
        if (/^(?:date|reporting|reported|request|ordered|received|registered|sample|specimen|accession|barcode|id|code|age|gender|sex|name|patient|doctor|dr\.?|time|tel|mobile|fax)\b\s*[:\-#/]/i.test(lower)) {
          return true;
        }
        const withoutDates = lower
          .replace(/\b\d{1,4}[\/\-]\d{1,2}[\/\-](?:19|20)\d{2}\b/g, '')
          .replace(/\b(?:19|20)\d{2}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/g, '')
          .replace(/\b\d{1,2}:\d{2}(?::\d{2})?\s*(?:am|pm)?\b/gi, '')
          .replace(/[\s\-\/:.,]+/g, '');
        return withoutDates.length === 0;
      }

      function isLabMetadataTestName(testName) {
        const lower = String(testName || '').toLowerCase().trim();
        return /\b(?:date|report|reporting|reported|request|requested|order|ordered|collect|collection|sample|specimen|accession|barcode|serial|receipt|invoice|age|gender|sex|dob|birth|patient|doctor|lab|page|tel|phone|mobile|address|time|year|month|day|code|id|no)\b|\b20(?:2[0-9]|3[0-9])\b/i.test(lower);
      }

      function translateLabTermToAr(testName) {
        const lower = String(testName || '').toLowerCase().trim();
        if (lower.includes('wbc') || lower.includes('leuk') || lower.includes('leuc') || lower.includes('white')) return 'كرات الدم البيضاء';

        if (lower.includes('alt') || lower.includes('sgpt') || lower.includes('ast') || lower.includes('sgot')) return 'إنزيمات الكبد';
        if (lower.includes('bilirubin')) return 'نسبة الصفراء';
        if (lower.includes('cholest')) return 'نسبة الكوليسترول';
        if (lower.includes('triglycer')) return 'الدهون الثلاثية';
        if (lower.includes('tsh') || lower.includes('thyroid')) return 'هرمون الغدة الدرقية';
        if (lower.includes('vit') && lower.includes('d')) return 'فيتامين د';
        if (lower.includes('calcium') || lower === 'ca') return 'نسبة الكالسيوم';
        if (lower.includes('iron') || lower === 'fe') return 'نسبة الحديد';
        if (lower.includes('ferritin')) return 'مخزون الحديد';
        if (lower.includes('esr')) return 'سرعة الترسيب';
        if (lower.includes('crp')) return 'معامل الالتهاب';
        if (lower.includes('specific gravity') || lower === 'sg') return 'كثافة البول';
        if (lower === 'ph') return 'درجة حموضة البول';
        if (lower.includes('epithel')) return 'الخلايا الطلائية في البول';
        if (lower.includes('mucus')) return 'المخاط في البول';
        if (lower.includes('ketone')) return 'الأسيتون في البول';
        if (lower.includes('sodium') || lower === 'na') return 'الصوديوم';
        if (lower.includes('potassium') || lower === 'k') return 'البوتاسيوم';
        return 'أحد مؤشرات التحليل';
      }

      function extractInlineRefRangeFromTail(line, startIdx) {
        const tail = typeof startIdx === 'number' && startIdx >= 0 && startIdx < line.length ? line.slice(startIdx) : line;
        const sanitizedTail = tail
          .replace(/\b\d{1,4}[\/\-]\d{1,2}[\/\-](?:19|20)\d{2}\b/g, ' ')
          .replace(/\b(?:19|20)\d{2}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/g, ' ');
        const m = sanitizedTail.match(/(?:\(|\[|ref\.?\s*range\s*[:=]?)?\s*(\d+(?:\.\d+)?)\s*(?:-|to|–|~)\s*(\d+(?:\.\d+)?)/i);
        if (!m) return null;
        const low = parseFloat(m[1]);
        const high = parseFloat(m[2]);
        if (low >= 1900 || high >= 1900) return null;
        return (!isNaN(low) && !isNaN(high) && high >= low) ? [low, high] : null;
      }

      function evaluateSemiQuantOrRange(rawVal, lowNormal, highNormal) {
        const lower = String(rawVal || '').trim().toLowerCase();
        if (['nil', 'absent', 'negative', 'neg', 'none', 'normal'].includes(lower)) return 0;
        if (lower.startsWith('+') || ['positive', 'pos', 'present', 'many', 'heavy', 'moderate', 'few', 'rare', 'trace'].includes(lower)) {
          return (lower === 'few' || lower === 'rare' || lower === 'trace') ? 1 : 2;
        }
        const nums = (lower.match(/\d+(?:\.\d+)?/g) || []).map(parseFloat).filter((n) => !isNaN(n));
        if (nums.length === 0) return -1;
        const maxVal = Math.max.apply(null, nums);
        const minVal = Math.min.apply(null, nums);
        return (maxVal > highNormal || minVal < lowNormal) ? 1 : 0;
      }

      function extractClinicalLabFindingsFromRecords(records, memberObj, isEn) {
        const normalHighlights = [];
        const followUpPoints = [];
        const alerts = [];
        const seenKeys = new Set();

        const chronicKeys = memberObj && Array.isArray(memberObj.chronicConditions)
          ? memberObj.chronicConditions.map((x) => String(x).toLowerCase())
          : [];
        const hasDiabetes = chronicKeys.some((k) => k.includes('diabetes') || k.includes('سكر'));
        const hasKidney = chronicKeys.some((k) => k.includes('kidney') || k.includes('كل'));
        const hasHeartOrBp = chronicKeys.some((k) => k.includes('heart') || k.includes('hyper') || k.includes('قلب') || k.includes('ضغط'));

        function addNormal(key, arText, enText) {
          if (!seenKeys.has('N:' + key) && normalHighlights.length < 8) {
            seenKeys.add('N:' + key);
            normalHighlights.push(isEn ? enText : arText);
          }
        }
        function addFollowUp(key, arText, enText) {
          if (!seenKeys.has('A:' + key) && followUpPoints.length < 8) {
            seenKeys.add('A:' + key);
            followUpPoints.push(isEn ? enText : arText);
          }
        }
        function addAlert(ar, en) {
          const val = isEn ? en : ar;
          if (!alerts.includes(val) && alerts.length < 5) alerts.push(val);
        }

        const allLines = [];
        (records || []).forEach((rec) => {
          [rec.extractedText, rec.notes, rec.diagnosis].forEach((chunk) => {
            if (!chunk) return;
            String(chunk)
              .replace(/\r\n/g, '\n')
              .split(/[\n;|•]+/)
              .map((l) => l.replace(/\s+/g, ' ').trim())
              .filter((l) => l.length >= 3 && !isLabMetadataHeaderLine(l))
              .forEach((l) => allLines.push(l));
          });
        });

        allLines.forEach((line) => {
          // 1) Pus Cells / WBCs in urine microscopy
          const pusMatch = line.match(/(?:pus\s*cells?|p\.?u\.?s\.?\s*cells?|leucocytes?|leukocytes?|صديد|خلايا\s*صديدية)\s*[:=\-]?\s*([0-9]+(?:\s*[-–]\s*[0-9]+)?|\+{1,4}|positive|pos|present|many|heavy|moderate|few|rare|trace|nil|absent|negative|neg|none|normal)/i);
          if (pusMatch) {
            const rawVal = pusMatch[1].trim();
            const tailStart = (pusMatch.index || 0) + pusMatch[0].length;
            const inlineRef = extractInlineRefRangeFromTail(line, tailStart);
            const highRef = inlineRef ? inlineRef[1] : 5;
            const refLabel = inlineRef ? (inlineRef[0] + ' - ' + inlineRef[1]) : '0 - 5 /HPF';
            const evalRes = evaluateSemiQuantOrRange(rawVal, 0, highRef);
            if (evalRes > 0) {
              addFollowUp(
                'pus',
                'وجود نسبة بسيطة من خلايا الصديد في البول، وتحتاج للمتابعة مع الطبيب لوصف العلاج المناسب',
                'Elevated Pus Cells (' + rawVal + ' vs Ref ' + refLabel + '): may suggest urinary inflammation or infection; discuss with your doctor.'
              );
              addAlert('وجود نسبة بسيطة من خلايا الصديد في البول تستدعي متابعة الطبيب.', 'Elevated pus cells (' + rawVal + ') require physician review.');
            } else if (evalRes === 0) {
              addNormal(
                'pus',
                isQualitativeNegVal(rawVal) ? 'خلايا الصديد: سلبية / طبيعية ولا يوجد بها أي مشكلة' : ('خلايا الصديد: طبيعية (' + rawVal + ') ولا يوجد بها أي مشكلة'),
                'Pus Cells (' + rawVal + ' — Normal)'
              );
            }
          }

          // 2) RBCs
          const rbcMatch = line.match(/(?:r\.?b\.?c\.?s?|red\s*(?:blood\s*)?cells?|كرات\s*(?:الدم\s*)?الحمراء|خلايا\s*دم\s*حمراء)\s*[:=\-]?\s*([0-9]+(?:\.[0-9]+)?(?:\s*[-–]\s*[0-9]+(?:\.[0-9]+)?)?|\+{1,4}|positive|pos|present|many|heavy|moderate|few|rare|trace|nil|absent|negative|neg|none|normal)/i);
          if (rbcMatch) {
            const rawVal = rbcMatch[1].trim();
            const tailStart = (rbcMatch.index || 0) + rbcMatch[0].length;
            const inlineRef = extractInlineRefRangeFromTail(line, tailStart);
            const firstNum = parseFloat(rawVal);
            const isQual = isNaN(firstNum);
            const isUrine = /\/hpf/i.test(line) || rawVal.includes('-') || (inlineRef && inlineRef[1] <= 10) || (!inlineRef && !isNaN(firstNum) && firstNum > 6.5) || rawVal.startsWith('+') || isQual;
            if (isUrine) {
              const highRef = inlineRef ? inlineRef[1] : 3;
              const refLabel = inlineRef ? (inlineRef[0] + ' - ' + inlineRef[1]) : '0 - 3 /HPF';
              const evalRes = evaluateSemiQuantOrRange(rawVal, 0, highRef);
              if (evalRes > 0) {
                addFollowUp(
                  'rbc_urine',
                  'وجود نسبة بسيطة من كرات الدم الحمراء في البول، وتحتاج للمتابعة مع الطبيب للاطمئنان',
                  'Elevated RBCs (' + rawVal + ' vs Ref ' + refLabel + '): microscopic red cells noted; share with your physician.'
                );
              } else if (evalRes === 0) {
                addNormal(
                  'rbc_urine',
                  isQualitativeNegVal(rawVal) ? 'كرات الدم الحمراء: سلبية / طبيعية ولا يوجد بها أي مشكلة' : ('كرات الدم الحمراء: طبيعية (' + rawVal + ') ولا يوجد بها أي مشكلة'),
                  'Urine RBCs (' + rawVal + ' — Normal)'
                );
              }
            } else if (!isNaN(firstNum)) {
              const low = inlineRef ? inlineRef[0] : 3.8;
              const high = inlineRef ? inlineRef[1] : 5.8;
              const refLabel = low + ' - ' + high;
              if (firstNum < low || firstNum > high) {
                addFollowUp(
                  'rbc_cbc',
                  'عدد كرات الدم الحمراء خارج المعدل الطبيعي المعتاد، ويُنصح بمراجعة الطبيب للاطمئنان',
                  'RBC Count out of range (' + rawVal + ' vs Ref ' + refLabel + '): review with physician.'
                );
              } else {
                addNormal('rbc_cbc', 'كرات الدم الحمراء: ضمن المعدل الطبيعي (' + rawVal + ')', 'RBCs (' + rawVal + ' — Normal)');
              }
            }
          }

          // 3) Crystals / Calcium Oxalate / Urate / Phosphates
          const crystalMatch = line.match(/(?:calcium\s*oxalate|ca\.?\s*oxalate|oxalate|uric\s*acid\s*crystals?|amorphous\s*(?:urates?|phosphates?)|crystals?|أملاح|اوكسالات|أوكسالات|بلورات|يورات)\s*[:=\-]?\s*(\+{1,4}|positive|pos|present|many|heavy|moderate|few|rare|trace|nil|absent|negative|neg|none|normal|[0-9]+(?:\s*[-–]\s*[0-9]+)?)/i);
          if (crystalMatch) {
            const rawVal = crystalMatch[1].trim();
            const evalRes = evaluateSemiQuantOrRange(rawVal, 0, 0);
            const isOxalate = /oxalate|أوكسالات|اوكسالات/i.test(line);
            if (evalRes > 0) {
              addFollowUp(
                'crystals',
                isOxalate
                  ? 'وجود نسبة أملاح (أوكسالات) في البول، ويُنصح بشرب كميات كافية من الماء ومراجعة الطبيب'
                  : 'وجود نسبة أملاح في البول، ويُنصح بشرب كميات كافية من الماء ومراجعة الطبيب',
                (isOxalate ? 'Calcium Oxalate Crystals detected' : 'Urinary Crystals / Salts detected') + ' (' + rawVal + ' vs Ref Nil): stay well hydrated and discuss with your doctor.'
              );
            } else if (evalRes === 0) {
              addNormal('crystals', 'الأملاح والبلورات: سلبية / طبيعية ولا يوجد بها أي مشكلة', 'Crystals (' + rawVal + ' — Normal)');
            }
          }

          // 4) Bacteria / Yeast / Casts
          const bactMatch = line.match(/(?:bacteria|bacteriuria|casts?|yeast|فطريات|بكتيريا)\s*[:=\-]?\s*(\+{1,4}|positive|pos|present|many|heavy|moderate|few|rare|trace|nil|absent|negative|neg|none|normal)/i);
          if (bactMatch) {
            const rawVal = bactMatch[1].trim();
            const evalRes = evaluateSemiQuantOrRange(rawVal, 0, 0);
            if (evalRes > 0) {
              addFollowUp(
                'bacteria',
                'وجود بكتيريا أو مكونات بسيطة في عينة البول، وتحتاج للمتابعة مع الطبيب لوصف العلاج المناسب',
                'Microbial / Bacteria finding (' + rawVal + ' vs Ref Nil): warrants physician review.'
              );
            } else if (evalRes === 0) {
              addNormal('bacteria', 'البكتيريا: سلبية / طبيعية ولا يوجد بها أي مشكلة', 'Bacteria (' + rawVal + ' — Normal)');
            }
          }

          // 5) Hemoglobin (Hb)
          const hbMatch = line.match(/(?:hemoglobin|haemoglobin|hgb|\bhb\b|الهيموجلوبين)\s*[:=\-]?\s*(\d{1,2}(?:\.\d+)?)/i);
          if (hbMatch && !/hba1c|a1c/i.test(line)) {
            const hb = parseFloat(hbMatch[1]);
            if (hb > 2 && hb < 25) {
              const tailStart = (hbMatch.index || 0) + hbMatch[0].length;
              const inlineRef = extractInlineRefRangeFromTail(line, tailStart);
              const low = inlineRef ? inlineRef[0] : 11.5;
              const high = inlineRef ? inlineRef[1] : 17.5;
              const refLabel = low + ' - ' + high;
              if (hb < low) {
                addFollowUp(
                  'hb',
                  'نسبة الهيموجلوبين (الأنيميا) أقل من المعدل الطبيعي وتحتاج لمتابعة الطبيب',
                  'Low Hemoglobin (' + hb + ' vs Ref ' + refLabel + ' g/dL): below reference range — check with doctor.'
                );
              } else if (hb > high) {
                addFollowUp(
                  'hb',
                  'نسبة الهيموجلوبين أعلى قليلاً من المعدل الطبيعي (' + hb + ')، ويُنصح بمراجعة الطبيب',
                  'Elevated Hemoglobin (' + hb + ' vs Ref ' + refLabel + ' g/dL): review with doctor.'
                );
              } else {
                addNormal('hb', 'الهيموجلوبين: ضمن المعدل الطبيعي (' + hb + ')', 'Hemoglobin (' + hb + ' — Normal)');
              }
            }
          }

          // 6) Glucose (Blood or Urine)
          const gluMatch = line.match(/(?:glucose|fbs|rbs|ppbs|blood\s*sugar|urine\s*sugar|sugar|الجلوكوز|سكر\s*الدم|السكر)\s*[:=\-]?\s*(\d{2,3}(?:\.\d+)?|\+{1,4}|trace|positive|pos|present|nil|absent|negative|neg|none|normal)/i);
          if (gluMatch && !/hba1c/i.test(line)) {
            const rawVal = gluMatch[1].trim();
            const numVal = parseFloat(rawVal);
            if (!isNaN(numVal)) {
              const tailStart = (gluMatch.index || 0) + gluMatch[0].length;
              const inlineRef = extractInlineRefRangeFromTail(line, tailStart);
              const upperMatch = line.slice(tailStart).match(/(?:<|<=|up\s*to)\s*(\d+(?:\.\d+)?)/i);
              const low = inlineRef ? inlineRef[0] : 70;
              const high = inlineRef ? inlineRef[1] : (upperMatch ? parseFloat(upperMatch[1]) : 139);
              const refLabel = inlineRef ? (low + ' - ' + high) : ('< ' + high);
              if (numVal > high || numVal < low) {
                addFollowUp(
                  'glucose',
                  (numVal > high ? 'ارتفاع' : 'انخفاض') + ' نسبة السكر في الدم (' + numVal + ')' + (hasDiabetes ? ' — مهم جداً مع سجل السكري' : '') + '، وتحتاج للمتابعة مع الطبيب',
                  (numVal > high ? 'Elevated' : 'Low') + ' Glucose (' + numVal + ' vs Ref ' + refLabel + ')' + (hasDiabetes ? ' — diabetes history' : '') + ': review with doctor.'
                );
                if (numVal > high && hasDiabetes) {
                  addAlert('ارتفاع نسبة السكر (' + numVal + ') مع سجل السكري يستدعي مراجعة الطبيب.', 'Elevated glucose (' + numVal + ') with diabetes history needs physician review.');
                }
              } else {
                addNormal('glucose', 'مستوى السكر: ضمن المعدل الطبيعي (' + numVal + ')', 'Glucose (' + numVal + ' — Normal)');
              }
            } else {
              const evalRes = evaluateSemiQuantOrRange(rawVal, 0, 0);
              if (evalRes > 0) {
                addFollowUp(
                  'glucose_urine',
                  'وجود نسبة سكر في البول، ويستلزم المتابعة مع الطبيب للاطمئنان',
                  'Sugar detected in urine (' + rawVal + ' vs Ref Nil): consult your doctor.'
                );
              } else if (evalRes === 0) {
                addNormal('glucose_urine', 'سكر البول: سلبية / طبيعية ولا يوجد بها أي مشكلة', 'Urine Glucose (' + rawVal + ' — Normal)');
              }
            }
          }

          // 7) HbA1c
          const a1cMatch = line.match(/(?:hba1c|a1c|السكر\s*التراكمي)\s*[:=\-]?\s*(\d{1,2}(?:\.\d+)?)/i);
          if (a1cMatch) {
            const a1c = parseFloat(a1cMatch[1]);
            if (a1c >= 2 && a1c <= 20) {
              const tailStart = (a1cMatch.index || 0) + a1cMatch[0].length;
              const inlineRef = extractInlineRefRangeFromTail(line, tailStart);
              const high = inlineRef ? inlineRef[1] : 5.7;
              const refLabel = inlineRef ? (inlineRef[0] + ' - ' + inlineRef[1] + '%') : '4.0 - 5.7%';
              if (a1c > high) {
                addFollowUp(
                  'hba1c',
                  'ارتفاع نسبة السكر التراكمي (' + a1c + '%) عن المعدل الطبيعي، وتحتاج للمتابعة مع الطبيب',
                  'Elevated HbA1c (' + a1c + '% vs Ref ' + refLabel + '): discuss glycemic control with your doctor.'
                );
              } else {
                addNormal('hba1c', 'السكر التراكمي: ضمن المعدل الطبيعي (' + a1c + '%)', 'HbA1c (' + a1c + '% — Normal)');
              }
            }
          }

          // 8) Albumin / Protein
          const albMatch = line.match(/(?:albumin|protein|الألبيومين|زلال|بروتين)\s*[:=\-]?\s*(\+{1,4}|trace|positive|pos|present|nil|absent|negative|neg|none|normal|\d+(?:\.\d+)?)/i);
          if (albMatch) {
            const rawVal = albMatch[1].trim();
            const evalRes = evaluateSemiQuantOrRange(rawVal, 0, 0);
            if (evalRes > 0) {
              addFollowUp(
                'albumin',
                'وجود نسبة زلال أو بروتين في البول' + (hasHeartOrBp || hasKidney ? ' (يستدعي انتباهاً خاصاً مع الضغط أو الكلى)' : '') + '، وتحتاج للمتابعة مع الطبيب',
                'Albumin / Protein detected (' + rawVal + ' vs Ref Nil)' + (hasHeartOrBp || hasKidney ? ' — important with BP/renal history' : '') + ': physician review advised.'
              );
              if (hasHeartOrBp || hasKidney) {
                addAlert('وجود نسبة زلال بالتحليل مع ضغط الدم أو الكلى يستدعي تقييم الطبيب.', 'Albuminuria with hypertension/renal history warrants physician review.');
              }
            } else if (evalRes === 0) {
              addNormal('albumin', 'الزلال والبروتين: سلبية / طبيعية ولا يوجد بها أي مشكلة', 'Albumin/Protein (' + rawVal + ' — Normal)');
            }
          }

          // 9) Generic Ref-Range Comparator (strictly excludes dates, barcodes, ages, years, & admin metadata)
          const genMatch = line.match(/^([A-Za-z][A-Za-z0-9\s\/\-\.\(\)]{1,34}?)\s*[:=\-]?\s*(\d+(?:\.\d+)?)\s*(?:[A-Za-z%\/\^0-9µμ]+)?\s*(?:\(|\[|ref\.?\s*range\s*[:=]?)?\s*(\d+(?:\.\d+)?)\s*(?:-|to|–|~)\s*(\d+(?:\.\d+)?)\s*(?:\)|\])?/i);
          if (genMatch) {
            const testName = genMatch[1].trim();
            const val = parseFloat(genMatch[2]);
            const low = parseFloat(genMatch[3]);
            const high = parseFloat(genMatch[4]);
            const normKey = testName.toLowerCase().replace(/[^a-z0-9]/g, '');
            const handled = /pus|rbc|hb|hemoglob|haemoglob|gluc|sugar|a1c|albumin|protein|crystal|oxalate|bacteria/.test(normKey);
            const looksLikeDateNums = val >= 1900 || low >= 1900 || high >= 1900 || /\b\d{1,4}[\/\-]\d{1,2}[\/\-](?:19|20)\d{2}\b/.test(line);
            if (!handled && !isLabMetadataTestName(testName) && !looksLikeDateNums && normKey.length >= 2 && !isNaN(val) && !isNaN(low) && !isNaN(high) && high >= low) {
              const refLabel = low + ' - ' + high;
              if (val < low) {
                addFollowUp(
                  'gen_' + normKey,
                  'انخفاض ' + translateLabTermToAr(testName) + ' (' + val + ') أقل من المعدل الطبيعي، ويُنصح بعرضه على الطبيب',
                  'Low ' + testName + ' (' + val + ' vs Ref ' + refLabel + '): bring to your doctor\'s attention.'
                );
              } else if (val > high) {
                addFollowUp(
                  'gen_' + normKey,
                  'ارتفاع ' + translateLabTermToAr(testName) + ' (' + val + ') أعلى من المعدل الطبيعي، ويحتاج لمتابعة الطبيب',
                  'Elevated ' + testName + ' (' + val + ' vs Ref ' + refLabel + '): requires physician review.'
                );
              } else {
                addNormal('gen_' + normKey, translateLabTermToAr(testName) + ': ضمن المعدل الطبيعي (' + val + ')', testName + ' (' + val + ' — Normal)');
              }
            }
          }
        });

        const allergyStr = memberObj && memberObj.drugAllergies ? memberObj.drugAllergies.trim() : '';
        if (allergyStr) {
          addFollowUp(
            'allergy',
            'تنبيه حساسية الأدوية: المريض لديه حساسية مسجلة تجاه (' + allergyStr + ')؛ يجب إبلاغ الطبيب قبل صرف أي دواء.',
            'Drug Allergy Reminder: Recorded allergy to (' + allergyStr + ') — always inform the prescribing doctor.'
          );
        }

        return {
          normalCount: normalHighlights.length,
          normalHighlights: normalHighlights,
          findings: followUpPoints,
          alerts: alerts
        };
      }

      // Bridge & Callback registry for real Gemini API execution inside Android APK WebView (Firebase.ai)
      const __pendingAndroidAiCallbacks = {};
      window.__onAndroidAiSummaryResult = function (callbackId, rawJson) {
        const entry = __pendingAndroidAiCallbacks[callbackId];
        if (!entry) return;
        delete __pendingAndroidAiCallbacks[callbackId];
        clearTimeout(entry.timer);
        try {
          entry.resolve(JSON.parse(rawJson));
        } catch (e) {
          entry.resolve({ ok: false });
        }
      };

      function callAndroidGeminiBridge(payloadObj) {
        return new Promise((resolve) => {
          if (!window.AndroidAiBridge || typeof window.AndroidAiBridge.analyzeMedicalSummary !== 'function') {
            resolve({ ok: false });
            return;
          }
          const cbId = 'ai_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
          const timer = setTimeout(function () {
            if (__pendingAndroidAiCallbacks[cbId]) {
              delete __pendingAndroidAiCallbacks[cbId];
              resolve({ ok: false });
            }
          }, 58000);
          __pendingAndroidAiCallbacks[cbId] = { resolve: resolve, timer: timer };
          try {
            window.AndroidAiBridge.analyzeMedicalSummary(cbId, JSON.stringify(payloadObj));
          } catch (e) {
            clearTimeout(timer);
            delete __pendingAndroidAiCallbacks[cbId];
            resolve({ ok: false });
          }
        });
      }

      function buildLocalStructuredNarrative(mem, records, isEn) {
        const parsed = extractClinicalLabFindingsFromRecords(records, mem, isEn);
        let generalPart = '';
        if (parsed.normalCount > 0 && parsed.findings.length === 0) {
          generalPart = isEn
            ? 'Most readable lab indicators (' + parsed.normalCount + ') are within normal reference limits: ' + parsed.normalHighlights.slice(0, 4).join(' • ') + '.'
            : 'معظم مؤشرات التحليل المقروءة (' + parsed.normalCount + ') ضمن المعدل الطبيعي: ' + parsed.normalHighlights.slice(0, 4).join(' • ') + '.';
        } else if (parsed.normalCount > 0 && parsed.findings.length > 0) {
          generalPart = isEn
            ? parsed.normalCount + ' indicators are within normal limits (' + parsed.normalHighlights.slice(0, 3).join(' • ') + '), while the numbered points below require physician attention.'
            : 'يوجد ' + parsed.normalCount + ' مؤشرات ضمن المعدل الطبيعي (' + parsed.normalHighlights.slice(0, 3).join(' • ') + ')، مع وجود النقاط المرقمة أدناه التي تحتاج لمتابعة الطبيب.';
        } else if (parsed.findings.length > 0) {
          generalPart = isEn
            ? 'Specific clinical indicators or precautions were detected in the uploaded report for physician review.'
            : 'تم رصد مؤشرات وتنبيهات مهمة في التقرير المرفوع تستدعي انتباه الطبيب المعالج.';
        } else {
          generalPart = isEn
            ? 'Patient bio profile, chronic history, and uploaded files are organized below for clinical review.'
            : 'البيانات الحيوية والأمراض المزمنة والملفات المرفوعة منظمة أدناه لمراجعة الطبيب المعالج.';
        }

        const followUpsText = parsed.findings.length > 0
          ? parsed.findings.map((pt, idx) => (idx + 1) + '. ' + pt).join('\n')
          : (isEn
              ? '1. No out-of-range numeric flags were found in the readable text; please show the original report to your doctor.'
              : '1. لم تُرصد قيم خارجة عن المعدل الطبيعي في النص المقروء، ويُنصح بعرض أصل التقرير على الطبيب في الزيارة القادمة.');

        return (isEn ? '✅ Overall Status & Normal Values:\n' : '✅ الحالة العامة والقيم الطبيعية:\n') +
          generalPart + '\n\n' +
          (isEn ? '📌 Points Requiring Physician Follow-Up:\n' : '📌 نقاط تحتاج لمتابعة أو انتباه الطبيب:\n') +
          followUpsText;
      }

      async function refreshMemberAiSummaryAsync(memberId, focusRecordId) {
        if (!memberId) return;
        const idx = (db.familyMembers || []).findIndex((m) => m.id === memberId);
        if (idx < 0) return;
        const member = normalizeFamilyMemberObj(db.familyMembers[idx]);
        const memberRecords = (db.records || []).filter((r) =>
          r.familyMemberId === member.id || (member.fullName && r.patientName === member.fullName)
        ).sort((a, b) => (b.createdAtMillis || 0) - (a.createdAtMillis || 0));

        const hasBioOrChronic = (member.chronicConditions && member.chronicConditions.length > 0) ||
          Boolean(member.drugAllergies) || Boolean(member.otherChronicNotes) ||
          member.weightKg > 0 || member.heightCm > 0 || Boolean(member.bloodType);

        if (memberRecords.length === 0 && !hasBioOrChronic) {
          db.familyMembers[idx].aiSummaryAr = '';
          db.familyMembers[idx].aiSummaryEn = '';
          db.familyMembers[idx].aiSummaryUpdatedAtMillis = 0;
          db.familyMembers[idx].aiSummarySource = '';
          saveState(db);
          return;
        }

        ui.aiAnalyzingMemberIds[member.id] = true;
        const visibleCard = document.getElementById('aiMedicalSummaryCard');
        if (visibleCard && ui.lastAiSummaryContext && ui.lastAiSummaryContext.memberObj && ui.lastAiSummaryContext.memberObj.id === member.id) {
          visibleCard.outerHTML = renderAiMedicalSummaryCardHtml(member.fullName, memberRecords, db.familyMembers[idx]);
          bindSharedRecordActions();
        }

        let resolvedAr = '';
        let resolvedEn = '';
        let resolvedSource = 'local';

        // Primary: Real Gemini API via Firebase AI Logic (AndroidAiBridge inside APK)
        const bridgeRes = await callAndroidGeminiBridge({
          focusRecordId: focusRecordId || '',
          member: member,
          records: memberRecords.slice(0, 8)
        });
        if (bridgeRes && bridgeRes.ok && (bridgeRes.summaryAr || bridgeRes.summaryEn)) {
          resolvedAr = bridgeRes.summaryAr || bridgeRes.summaryEn;
          resolvedEn = bridgeRes.summaryEn || bridgeRes.summaryAr;
          resolvedSource = 'gemini';
        } else {
          // Seamless Smart Local Parser Fallback (Zero UI error even offline or outside APK)
          resolvedAr = buildLocalStructuredNarrative(member, memberRecords, false);
          resolvedEn = buildLocalStructuredNarrative(member, memberRecords, true);
          resolvedSource = 'local';
        }

        delete ui.aiAnalyzingMemberIds[member.id];
        const freshIdx = (db.familyMembers || []).findIndex((m) => m.id === member.id);
        if (freshIdx >= 0) {
          db.familyMembers[freshIdx] = normalizeFamilyMemberObj(Object.assign({}, db.familyMembers[freshIdx], {
            aiSummaryAr: resolvedAr,
            aiSummaryEn: resolvedEn,
            aiSummaryUpdatedAtMillis: Date.now(),
            aiSummarySource: resolvedSource
          }));
          saveState(db);
          const curCard = document.getElementById('aiMedicalSummaryCard');
          if (curCard) {
            const latestRecs = (db.records || []).filter((r) =>
              r.familyMemberId === member.id || (member.fullName && r.patientName === member.fullName)
            ).sort((a, b) => (b.createdAtMillis || 0) - (a.createdAtMillis || 0));
            curCard.outerHTML = renderAiMedicalSummaryCardHtml(member.fullName, latestRecs, db.familyMembers[freshIdx]);
            bindSharedRecordActions();
          }
        }
      }

      function buildMedicalSummary(memberName, records, isEnOverride, memberObj) {
        const isEn = typeof isEnOverride === 'boolean' ? isEnOverride : (ui.lang === 'en');
        const mem = memberObj ? normalizeFamilyMemberObj(memberObj) : null;
        const sorted = (records || []).slice().sort((a, b) => (b.createdAtMillis || 0) - (a.createdAtMillis || 0));
        const clinicVisitsCount = sorted.filter((r) => !r.recordType || r.recordType === 'PRESCRIPTION').length;
        const externalVisitsCount = sorted.filter((r) => r.recordType === 'EXTERNAL_VISIT').length;
        const labReportsCount = sorted.filter((r) => r.recordType === 'LAB_RESULT' || r.recordType === 'PATIENT_UPLOAD').length;

        const diagnosesSet = new Set();
        const medsSet = new Set();
        const labsSet = new Set();

        sorted.forEach((rec) => {
          const localized = BilingualMedicalTranslator.resolveForDisplay(rec, isEn);
          if (rec.recordType === 'LAB_RESULT' || rec.recordType === 'PATIENT_UPLOAD') {
            if (labsSet.size < 8) {
              const title = localized.diagnosis || rec.attachmentName || (isEn ? 'Uploaded Lab / File' : 'تحليل / مرفق مرفوع');
              const fileBadge = (rec.attachmentName && !title.toLowerCase().includes(rec.attachmentName.toLowerCase()))
                ? (' [' + rec.attachmentName + ']')
                : '';
              labsSet.add(title + fileBadge + (rec.visitDateLabel ? ' (' + rec.visitDateLabel + ')' : ''));
            }
          } else {
            if (localized.diagnosis && diagnosesSet.size < 5) {
              diagnosesSet.add(localized.diagnosis + (rec.visitDateLabel ? ' — ' + rec.visitDateLabel : ''));
            }
            if (rec.attachmentName && rec.attachmentDataUrl && labsSet.size < 8) {
              labsSet.add((isEn ? 'Attached File: ' : 'مرفق طبي: ') + rec.attachmentName + (rec.visitDateLabel ? ' (' + rec.visitDateLabel + ')' : ''));
            }
            String(localized.medications || '')
              .split('\n')
              .map((l) => l.replace(/^[•\-\*]\s*/, '').trim())
              .filter(Boolean)
              .forEach((line) => {
                if (medsSet.size < 8) medsSet.add(line);
              });
          }
        });

        const parsedLab = extractClinicalLabFindingsFromRecords(sorted, mem, isEn);
        const chronicsList = mem && mem.chronicConditions.length > 0
          ? mem.chronicConditions.map((k) => chronicLabelByKey(k, isEn))
          : [];
        const bioParts = [];
        if (mem) {
          if (mem.age > 0) bioParts.push(isEn ? ('Age: ' + mem.age + ' yrs') : ('السن: ' + mem.age + ' سنة'));
          if (mem.weightKg > 0) bioParts.push((isEn ? 'Weight: ' : 'الوزن: ') + mem.weightKg + (isEn ? ' kg' : ' كجم'));
          if (mem.heightCm > 0) bioParts.push((isEn ? 'Height: ' : 'الطول: ') + mem.heightCm + (isEn ? ' cm' : ' سم'));
          if (mem.bloodType) bioParts.push((isEn ? 'Blood: ' : 'فصيلة الدم: ') + mem.bloodType);
        }

        const storedNarrative = mem
          ? (isEn ? (mem.aiSummaryEn || mem.aiSummaryAr) : (mem.aiSummaryAr || mem.aiSummaryEn))
          : '';
        const structuredNarrative = (storedNarrative && storedNarrative.trim())
          ? storedNarrative.trim()

      function formatActualDateTimeLabelWeb(millis, isEn) {
        const d = new Date(Number(millis) || Date.now());
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear();
        let hr = d.getHours();
        const mn = String(d.getMinutes()).padStart(2, '0');
        const ampm = isEn ? (hr >= 12 ? 'PM' : 'AM') : (hr >= 12 ? 'م' : 'ص');
        hr = hr % 12 || 12;
        return dd + '/' + mm + '/' + yyyy + ' - ' + String(hr).padStart(2, '0') + ':' + mn + ' ' + ampm;
      }

      function translateFileTitleToPlainArWeb(raw) {
        const lower = String(raw || '').toLowerCase();
        if (lower.includes('urine') || lower.includes('بول')) return 'تحليل بول شامل';
        if (lower.includes('cbc') || lower.includes('صورة دم') || lower.includes('blood')) return 'تحليل صورة دم كاملة';
        if (lower.includes('hba1c') || lower.includes('sugar') || lower.includes('glucose') || lower.includes('سكر')) return 'تحليل السكر';
        if (lower.includes('x-ray') || lower.includes('xray') || lower.includes('أشعة') || lower.includes('ct') || lower.includes('mri') || lower.includes('sonar') || lower.includes('سونا')) return 'تقرير أشعة وفحص تصويري';
        if (/[A-Za-z]{4,}/.test(String(raw || '')) && !/[\u0600-\u06FF]/.test(String(raw || ''))) return 'تقرير تحليل أو أشعة طبية';
        return String(raw || '').trim() || 'تحليل / أشعة طبية';
      }

      function buildMedicationIndicationWeb(diagnosis, specialty, medsList, notes, isEn) {
        if (isEn) {
          return 'Prescribed to manage ' + diagnosis + ' within ' + specialty + ' care' +
            (medsList.length > 0 ? ' (' + medsList.length + ' medication(s) aligned with the documented diagnosis' + (notes ? ' and follow-up plan' : '') + ')' : '') + '.';
        }
        const hints = [];
        const addHint = (h) => { if (!hints.includes(h)) hints.push(h); };
        medsList.forEach((mLine) => {
          const l = String(mLine || '').toLowerCase();
          if (l.includes('augmentin') || l.includes('hibiotic') || l.includes('أموكسيسيلين') || l.includes('أوجمنتين') || l.includes('هايبوتيك') || l.includes('مضاد')) addHint('مضاد حيوي لعلاج العدوى البكتيرية');
          else if (l.includes('controloc') || l.includes('nexium') || l.includes('كونترولوك') || l.includes('نيكسيوم') || l.includes('جافيسكون')) addHint('حماية المعدة وتقليل الحموضة والارتجاع');
          else if (l.includes('cetal') || l.includes('brufen') || l.includes('cataflam') || l.includes('سيتال') || l.includes('بروفين') || l.includes('كتافلام') || l.includes('مسكن')) addHint('تسكين الألم وخفض الحرارة والالتهاب');
          else if (l.includes('dimra') || l.includes('myolgin') || l.includes('ديمرا') || l.includes('ميولجين')) addHint('باسط للعضلات ومسكن لآلام العظام');
          else if (l.includes('glucophage') || l.includes('amaryl') || l.includes('جلوكوفاج') || l.includes('أماريل')) addHint('تنظيم مستوى السكر في الدم');
          else if (l.includes('concor') || l.includes('norvasc') || l.includes('كونكور') || l.includes('نورفاسك')) addHint('تنظيم ضغط الدم ودعم القلب');
          else if (l.includes('folic') || l.includes('osteocare') || l.includes('vidrop') || l.includes('فوليك') || l.includes('أوستيوكير') || l.includes('فيتامين')) addHint('دعم التغذية والفيتامينات والمعادن الأساسية');
          else if (l.includes('zyrtec') || l.includes('farcolin') || l.includes('زيرتك') || l.includes('فاركولين')) addHint('تخفيف الحساسية وتحسين التنفس');
        });
        return 'علاج ومتابعة (' + diagnosis + ') في تخصص (' + specialty + ')' +
          (hints.length > 0 ? ' — يشمل: ' + hints.join('، ') : '') +
          (notes ? ' وفق خطة الطبيب (' + notes + ')' : '');
      }

      function buildPermanentLogNarrativeWeb(record, memberObj, providerLabel) {
        const ts = Number(record.createdAtMillis) || Date.now();
        const dtAr = formatActualDateTimeLabelWeb(ts, false);
        const dtEn = formatActualDateTimeLabelWeb(ts, true);
        const isLabOrUpload = record.recordType === 'LAB_RESULT' || record.recordType === 'PATIENT_UPLOAD';
        const provAr = (providerLabel || record.doctorName || (record.recordType === 'PATIENT_UPLOAD' ? 'رفع المريض / الأسرة' : 'منصة طب الحجايزة')).trim();
        const provEn = (providerLabel || record.doctorName || (record.recordType === 'PATIENT_UPLOAD' ? 'Patient / Family Upload' : 'Teb Al-Hajayzah')).trim();

        if (isLabOrUpload) {
          const parsedAr = extractClinicalLabFindingsFromRecords([record], memberObj, false);
          const parsedEn = extractClinicalLabFindingsFromRecords([record], memberObj, true);
          const rawTitle = (record.diagnosis || record.attachmentName || 'تحليل / أشعة طبية').trim();
          const cleanTitleAr = translateFileTitleToPlainArWeb(rawTitle);
          const normalsAr = (parsedAr.normalHighlights || []).slice(0, 4).join('، ');
          const followAr = (parsedAr.followUpPoints || parsedAr.findings || []).slice(0, 5).join('؛ ');
          let narAr = 'بتاريخ ' + dtAr + '، تم تسجيل وتوثيق (' + cleanTitleAr + ') عبر (' + provAr + ').';
          if (parsedAr.normalCount > 0 && !followAr) {
            narAr += ' تُظهر القيم المقروءة حالة مطمئنة وضمن المعدل الطبيعي (' + normalsAr + ').';
          } else if (followAr) {
            if (normalsAr) narAr += ' مؤشرات ضمن الطبيعي: ' + normalsAr + '.';
            narAr += ' نقاط تستدعي مراجعة الطبيب: ' + followAr + '.';
          } else {
            const safeNotes = String(record.notes || '').split('\n').filter((l) => !isLabMetadataHeaderLine(l)).join(' ').trim();
            if (safeNotes && !/[A-Za-z]{4,}/.test(safeNotes)) {
              narAr += ' تفاصيل التقرير المرفق: ' + safeNotes + '.';
            } else {
              narAr += ' تم حفظ التقرير في السجل الطبي الدائم لمراجعته مع الطبيب المختص.';
            }
          }
          narAr += ' (تنبيه طبي قياسي: هذا التلخيص استرشادي لمساعدة المريض ولا يُغني عن مراجعة الطبيب المختص).';

          const normalsEn = (parsedEn.normalHighlights || []).slice(0, 4).join(', ');
          const followEn = (parsedEn.followUpPoints || parsedEn.findings || []).slice(0, 5).join('; ');
          let narEn = 'On ' + dtEn + ', (' + rawTitle + ') was documented via (' + provEn + ').';
          if (parsedEn.normalCount > 0 && !followEn) {
            narEn += ' Readable clinical values appear reassuring and within normal limits (' + normalsEn + ').';
          } else if (followEn) {
            if (normalsEn) narEn += ' Normal indicators: ' + normalsEn + '.';
            narEn += ' Points for physician follow-up: ' + followEn + '.';
          } else {
            narEn += ' Archived permanently in the medical record for treating physician review.';
          }
          narEn += ' (Medical Notice: This summary is informational guidance only and does not replace direct evaluation by a qualified physician.)';
          return { narrativeAr: narAr, narrativeEn: narEn };
        }

        const locAr = BilingualMedicalTranslator.resolveForDisplay(record, false);
        const locEn = BilingualMedicalTranslator.resolveForDisplay(record, true);
        const specAr = record.specialty || 'كشف طبي';
        const specEn = displaySpecialty(specAr, true) || specAr;
        const diagAr = (locAr.diagnosis || 'متابعة طبية عامة').trim();
        const diagEn = (locEn.diagnosis || diagAr).trim();
        const medsAr = String(locAr.medications || '').split('\n').map((l) => l.replace(/^[•\-\*]\s*/, '').trim()).filter(Boolean);
        const medsEn = String(locEn.medications || '').split('\n').map((l) => l.replace(/^[•\-\*]\s*/, '').trim()).filter(Boolean);
        const notesAr = String(locAr.notes || '').trim();
        const notesEn = String(locEn.notes || '').trim();

        const indAr = buildMedicationIndicationWeb(diagAr, specAr, medsAr, notesAr, false);
        const indEn = buildMedicationIndicationWeb(diagEn, specEn, medsEn, notesEn, true);

        const narAr = [
          '📅 التاريخ والوقت الفعلي: ' + dtAr,
          '👨‍⚕️ الطبيب / الجهة: ' + provAr + ' (' + specAr + ')',
          '🩺 التشخيص: ' + diagAr,
          '💊 الأدوية والجرعات الموصوفة: ' + (medsAr.length ? medsAr.join(' • ') : 'لم تُدرج أدوية في هذه الزيارة'),
          '🎯 سبب الوصف ودواعي الاستخدام: ' + indAr,
          notesAr ? ('📝 توصيات الطبيب: ' + notesAr) : ''
        ].filter(Boolean).join('\n');

        const narEn = [
          '📅 Date & Time: ' + dtEn,
          '👨‍⚕️ Physician / Provider: ' + provEn + ' (' + specEn + ')',
          '🩺 Diagnosis: ' + diagEn,
          '💊 Prescribed Medications & Dosages: ' + (medsEn.length ? medsEn.join(' • ') : 'No medications listed for this visit'),
          '🎯 Indication / Reason for Prescribing: ' + indEn,
          notesEn ? ('📝 Doctor Notes: ' + notesEn) : ''
        ].filter(Boolean).join('\n');

        return { narrativeAr: narAr, narrativeEn: narEn };
      }

        if (!record) return;

          (record.familyMemberId && m.id === record.familyMemberId) ||
          (record.patientName && m.fullName === record.patientName)
        ) || null;
        const ts = Number(record.createdAtMillis) || Date.now();
        const built = buildPermanentLogNarrativeWeb(record, memberObj, providerLabel);
        const logId = 'plog_' + record.id;
        const logEntry = {
          id: logId,
          familyMemberId: record.familyMemberId || (memberObj ? memberObj.id : ''),
          patientName: record.patientName || (memberObj ? memberObj.fullName : ''),
          patientPhone: record.patientPhone || (memberObj ? memberObj.phone : ''),
          sourceRecordId: record.id,
          eventType: eventType,
          eventTimestampMillis: ts,
          eventDateTimeLabel: formatActualDateTimeLabelWeb(ts, false),
          providerName: providerLabel || record.doctorName || '',
          specialtyOrCategory: record.specialty || '',
          title: (record.diagnosis || record.attachmentName || 'حدث طبي').trim(),
          narrativeAr: built.narrativeAr,
          narrativeEn: built.narrativeEn,
          isAiGenerated: false
        };
        const existingIdx = db.permanentLogs.findIndex((l) => l.id === logId);
        if (existingIdx >= 0) db.permanentLogs[existingIdx] = logEntry;
        else db.permanentLogs.unshift(logEntry);
        saveState(db);

        // Inside Android APK WebView, asynchronously upgrade narrative using real Gemini AI
        if (window.AndroidAiBridge && typeof window.AndroidAiBridge.analyzeMedicalSummary === 'function') {
          try {
            const bridgeRes = await callAndroidGeminiBridge({
              mode: 'PERMANENT_LOG',
              member: memberObj || {},
              record: Object.assign({}, record, { providerName: providerLabel || record.doctorName || '' })
            });
            if (bridgeRes && bridgeRes.ok && (bridgeRes.summaryAr || bridgeRes.summaryEn)) {
              const targetIdx = (db.permanentLogs || []).findIndex((l) => l.id === logId);
              if (targetIdx >= 0) {
