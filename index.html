      function openSmartPrescriptionModal(slotId) {
        const slot = db.slots.find((s) => s.id === slotId);
        const doc = db.doctors.find((d) => d.id === slot.doctorId);
        const docMedKeys = medicationCatalogKeysForDoctor(doc);
        let filterMode = 'SPECIALTY';
        let medQuery = '';
        let selectedRx = [];
        let rxAttachmentUrl = '';

        function renderRxModalBody() {
          const favSet = new Set(db.doctorFavorites[doc.id] || []);
          const q = medQuery.trim().toLowerCase();
          const filteredMeds = ui.medications.filter((m) => {
            const matchQ = !q ||
              m.tradeName.toLowerCase().includes(q) ||
              m.activeIngredient.toLowerCase().includes(q) ||
              m.strength.toLowerCase().includes(q);
            if (filterMode === 'FAV') return favSet.has(m.id) && matchQ;
            if (q) return matchQ;
            if (filterMode === 'SPECIALTY') return docMedKeys.size === 0 || docMedKeys.has(m.specialty) || m.specialty === doc.specialty;
            return true;
          });

          document.getElementById('rxCatalogContainer').innerHTML = filteredMeds.length === 0
            ? '<div style="text-align:center;padding:16px;color:var(--text-muted);">' + esc(bi('لا توجد أدوية مطابقة', 'No matching medications')) + '</div>'
            : filteredMeds.map((m) => {
                const isFav = favSet.has(m.id);
                const isAdded = selectedRx.some((x) => x.id === m.id);
                return '<div class="med-item-row">' +
                  '<div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">' +
                    '<button class="chip" type="button" data-fav-med="' + esc(m.id) + '" style="min-height:36px;padding:4px 8px;">' + (isFav ? '⭐' : '☆') + '</button>' +
                    '<div style="min-width:0;">' +
                      '<div style="font-weight:700;font-size:0.92rem;">' + esc(m.tradeName) + '</div>' +
                      '<div style="font-size:0.8rem;color:var(--teal);font-weight:600;">' + esc(m.activeIngredient) + ' • ' + esc(m.strength) + '</div>' +
                    '</div>' +
                  '</div>' +
                  '<button class="btn ' + (isAdded ? 'btn-green' : 'btn-primary') + '" type="button" data-add-med="' + esc(m.id) + '" style="min-height:36px;padding:4px 10px;font-size:0.84rem;" ' + (isAdded ? 'disabled' : '') + '>' +
                    (isAdded ? '✓' : '+ ' + esc(bi('إضافة', 'Add'))) +
                  '</button>' +
                '</div>';
              }).join('');

          document.getElementById('rxSelectedContainer').innerHTML = selectedRx.length === 0
            ? '<div style="font-size:0.86rem;color:var(--text-muted);">' + esc(bi('اضغط (+ إضافة) بجانب أي دواء أعلاه لإدراجه في الروشتة.', 'Tap (+ Add) next to any medicine above to include it.')) + '</div>'
            : selectedRx.map((item, idx) =>
                '<div class="card" style="padding:10px;background:rgba(217,242,242,0.3);">' +
                  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
                    '<strong>' + (idx + 1) + '. ' + esc(item.tradeName) + ' ' + esc(item.strength) + '</strong>' +
                    '<button class="chip" type="button" data-del-rx="' + idx + '" style="min-height:30px;padding:2px 8px;color:var(--booked-border);">' + esc(bi('حذف', 'Remove')) + '</button>' +
                  '</div>' +
                  '<input class="input" data-edit-dose="' + idx + '" value="' + esc(item.dosage) + '" placeholder="' + esc(bi('الجرعة وطريقة الاستخدام', 'Dosage instructions')) + '" />' +
                  '<div class="chips-row" style="margin-top:6px;">' +
                    DOSAGE_PRESETS.map((p) =>
                      '<button class="chip" type="button" data-preset-idx="' + idx + '" data-preset-val="' + esc(p) + '" style="min-height:30px;padding:4px 8px;font-size:0.78rem;">' + esc(p) + '</button>'
                    ).join('') +
                  '</div>' +
                '</div>'
              ).join('');

          document.querySelectorAll('[data-fav-med]').forEach((btn) => {
            btn.onclick = function () {
              const medId = btn.getAttribute('data-fav-med');
              const arr = db.doctorFavorites[doc.id] || [];
              const idx = arr.indexOf(medId);
              if (idx >= 0) arr.splice(idx, 1); else arr.push(medId);
              db.doctorFavorites[doc.id] = arr;
              saveState(db);
              renderRxModalBody();
            };
          });
          document.querySelectorAll('[data-add-med]').forEach((btn) => {
            btn.onclick = function () {
              const m = ui.medications.find((x) => x.id === btn.getAttribute('data-add-med'));
              if (m && !selectedRx.some((x) => x.id === m.id)) {
                selectedRx.push({ id: m.id, tradeName: m.tradeName, strength: m.strength, dosage: m.defaultDosage });
                renderRxModalBody();
              }
            };
          });
          document.querySelectorAll('[data-del-rx]').forEach((btn) => {
            btn.onclick = function () {
              selectedRx.splice(parseInt(btn.getAttribute('data-del-rx'), 10), 1);
              renderRxModalBody();
            };
          });
          document.querySelectorAll('[data-edit-dose]').forEach((inp) => {
            inp.oninput = function () {
              selectedRx[parseInt(inp.getAttribute('data-edit-dose'), 10)].dosage = inp.value;
            };
          });
          document.querySelectorAll('[data-preset-idx]').forEach((btn) => {
            btn.onclick = function () {
              const i = parseInt(btn.getAttribute('data-preset-idx'), 10);
              selectedRx[i].dosage = btn.getAttribute('data-preset-val');
              renderRxModalBody();
            };
          });
        }

        function buildMedicationsText() {
          return selectedRx.map((x) => '• ' + x.tradeName + (x.strength ? ' ' + x.strength : '') + ' — ' + (x.dosage || 'حسب إرشادات الطبيب')).join('\n');
        }

        function populateBilingualFields(forceRefresh) {
          const diagInput = document.getElementById('rxDiagnosis').value.trim();
          const medsInput = buildMedicationsText();
          const notesInput = document.getElementById('rxNotes').value.trim();
          const bundle = BilingualMedicalTranslator.buildBilingualBundle({
            patientName: slot.patientName,
            doctorName: getDoctorDisplayName(doc, false),
            specialty: doc.specialty,
            diagnosisInput: diagInput,
            medicationsInput: medsInput,
            notesInput: notesInput,
            existingDiagnosisEn: forceRefresh ? '' : document.getElementById('rxDiagnosisEn').value,
            existingMedicationsEn: forceRefresh ? '' : document.getElementById('rxMedsEn').value,
            existingNotesEn: forceRefresh ? '' : document.getElementById('rxNotesEn').value
          });
          if (forceRefresh || !document.getElementById('rxDiagnosisEn').value.trim()) {
            document.getElementById('rxDiagnosisEn').value = bundle.diagnosisEn;
          }
          if (forceRefresh || !document.getElementById('rxMedsEn').value.trim()) {
            document.getElementById('rxMedsEn').value = bundle.medicationsEn;
          }
          if (forceRefresh || !document.getElementById('rxNotesEn').value.trim()) {
            document.getElementById('rxNotesEn').value = bundle.notesEn;
          }
          if (forceRefresh || !document.getElementById('rxAiReportAr').value.trim()) {
            document.getElementById('rxAiReportAr').value = bundle.aiReportAr;
          }
          if (forceRefresh || !document.getElementById('rxAiReportEn').value.trim()) {
            document.getElementById('rxAiReportEn').value = bundle.aiReportEn;
          }
          return bundle;
        }

        openModal(bi('الروشتة الإلكترونية الذكية — ', 'Smart E-Prescription — ') + slot.patientName,
          '<div class="badge ' + (ui.isLiveMedsApi ? 'badge-avail' : '') + '" style="background:var(--teal-soft);color:var(--teal-text);">' +

      function bindSharedRecordActions() {
        document.querySelectorAll('[data-toggle-ai-summary-lang]').forEach((btn) => {
          btn.onclick = function () {
            const currentIsEn = ui.aiSummaryLang ? (ui.aiSummaryLang === 'en') : (ui.lang === 'en');
            ui.aiSummaryLang = currentIsEn ? 'ar' : 'en';
            const cardEl = btn.closest('#aiMedicalSummaryCard');
            if (cardEl && ui.lastAiSummaryContext) {
              cardEl.outerHTML = renderAiMedicalSummaryCardHtml(ui.lastAiSummaryContext.memberName, ui.lastAiSummaryContext.records);
              bindSharedRecordActions();
            } else {
              renderApp();
            }
          };
        });
        document.querySelectorAll('[data-toggle-rec-lang]').forEach((btn) => {
          btn.onclick = function () {
            const recId = btn.getAttribute('data-toggle-rec-lang');
            const currentIsEn = ui.cardLangOverrides[recId]
              ? (ui.cardLangOverrides[recId] === 'en')
              : (ui.lang === 'en');
            ui.cardLangOverrides[recId] = currentIsEn ? 'ar' : 'en';
            const rec = db.records.find((r) => r.id === recId);
            const cardEl = btn.closest('[data-record-card]');
            if (rec && cardEl) {
              cardEl.outerHTML = renderMedicalRecordCardHtml(rec);
              bindSharedRecordActions();
            } else {
              renderApp();
            }
          };
        });
        document.querySelectorAll('[data-print-rec]').forEach((btn) => {
          btn.onclick = function () {
            const recId = btn.getAttribute('data-print-rec');
            const rec = db.records.find((r) => r.id === recId);
            if (rec) {
              const cardIsEn = ui.cardLangOverrides[recId]
                ? (ui.cardLangOverrides[recId] === 'en')
                : (ui.lang === 'en');
              printPrescription(rec, cardIsEn);
            }
          };
        });
        document.querySelectorAll('[data-preview-img]').forEach((img) => {
          img.onclick = function () {
            const rec = db.records.find((r) => r.id === img.getAttribute('data-preview-img'));
            if (rec && rec.attachmentDataUrl) {
              openModal(rec.diagnosis || bi('معاينة الصورة', 'Image Preview'), '<img src="' + esc(rec.attachmentDataUrl) + '" style="width:100%;border-radius:14px;" />');
            }
          };
        });
        document.querySelectorAll('[data-open-pdf]').forEach((btn) => {
          btn.onclick = function () {
            const rec = db.records.find((r) => r.id === btn.getAttribute('data-open-pdf'));
            if (rec && rec.attachmentDataUrl) {
              const safeName = rec.attachmentName || 'medical_report.pdf';
              openModal(
                safeName,
                '<div style="display:flex;flex-direction:column;gap:10px;">' +
                  '<a class="btn btn-primary btn-block" href="' + esc(rec.attachmentDataUrl) + '" download="' + esc(safeName) + '">⬇️ ' + esc(bi('تحميل ملف التحليل (PDF)', 'Download PDF Report')) + '</a>' +
                  '<iframe src="' + esc(rec.attachmentDataUrl) + '" title="' + esc(safeName) + '" style="width:100%;height:62vh;border:1px solid var(--border);border-radius:12px;"></iframe>' +
                '</div>'
              );
            }
          };
        });
      }

      function bindLabDashboardEvents() {
        const lab = (db.labs || []).find((l) => l.id === ui.loggedInLabId);
        if (!lab) return;

        let pendingLabFile = { dataUrl: '', mimeType: '', fileName: '' };

        const logoutBtn = document.getElementById('btnLabLogout');
        if (logoutBtn) {
          logoutBtn.onclick = function () {
            ui.loggedInLabId = null;
            ui.labPhoneQuery = '';
            ui.labSearchResults = [];
            ui.labTargetMemberId = '';
            ui.labTargetAccountPhone = '';
            showToast(bi('تم تسجيل خروج المعمل بنجاح', 'Lab signed out'));
            renderApp();
          };
        }

        function runLabPatientSearch() {
          const rawQ = (document.getElementById('labPatientPhoneQuery').value || '').trim();
          const digitsQ = normalizePhoneDigits(rawQ);
          ui.labPhoneQuery = rawQ;
          if (!digitsQ) {
            ui.labSearchResults = [];
            ui.labTargetMemberId = '';
            renderApp();
            return;
          }
          const matches = (db.accounts || []).filter((acc) => normalizePhoneDigits(acc.phone).includes(digitsQ));
          ui.labSearchResults = matches.map((acc) => ({
            account: acc,
            members: (db.familyMembers || []).filter((m) => m.accountId === acc.id || normalizePhoneDigits(m.phone) === normalizePhoneDigits(acc.phone))
          }));
          if (ui.labSearchResults.length === 1 && ui.labSearchResults[0].members.length > 0) {
            ui.labTargetMemberId = ui.labSearchResults[0].members[0].id;
            ui.labTargetAccountPhone = ui.labSearchResults[0].account.phone;
          } else {
            ui.labTargetMemberId = '';
            ui.labTargetAccountPhone = '';
          }
          renderApp();
        }

        const searchBtn = document.getElementById('btnLabPhoneSearch');
        const queryInp = document.getElementById('labPatientPhoneQuery');
        if (searchBtn) searchBtn.onclick = runLabPatientSearch;
        if (queryInp) {
          queryInp.onkeydown = function (e) {
            if (e.key === 'Enter') runLabPatientSearch();
          };
        }

        document.querySelectorAll('[data-lab-pick-member]').forEach((btn) => {
          btn.onclick = function () {
            ui.labTargetMemberId = btn.getAttribute('data-lab-pick-member');
            ui.labTargetAccountPhone = btn.getAttribute('data-lab-acc-phone') || '';
            renderApp();
          };
        });

        const fileInp = document.getElementById('labResultFileInput');
        if (fileInp) {
          fileInp.onchange = function (e) {
            const file = e.target.files[0];
            if (!file) return;
            readAttachmentWithCompression(file, function (res) {
              pendingLabFile = res;
              const prev = document.getElementById('labFilePreview');
              if (prev) {
                prev.innerHTML = res.mimeType === 'application/pdf'
                  ? '📑 ' + esc(bi('ملف PDF جاهز للرفع: ', 'PDF ready: ')) + esc(res.fileName)
                  : '✓ ' + esc(bi('صورة التحليل مضغوطة وجاهزة للرفع', 'Compressed image ready')) + '<br/><img class="attach-img" src="' + esc(res.dataUrl) + '" alt="نتيجة التحليل" style="margin-top:6px;" />';
              }
            });
          };
        }

        const uploadSubmitBtn = document.getElementById('btnLabUploadSubmit');
        if (uploadSubmitBtn) {
          uploadSubmitBtn.onclick = function () {
            const member = (db.familyMembers || []).find((m) => m.id === ui.labTargetMemberId);
            if (!member) {
              showToast(bi('يرجى اختيار فرد العائلة أولاً', 'Select a family member first'));
              return;
            }
            const title = (document.getElementById('labTestTitle').value || '').trim();
            const notes = (document.getElementById('labTestNotes').value || '').trim();
            if (!title) {
              showToast(bi('يرجى كتابة اسم التحليل أو الأشعة', 'Please enter test or scan title'));
              return;
            }
            db.records.unshift({
              id: 'labrec_' + Date.now(),
              familyMemberId: member.id,
              patientName: member.fullName,
              patientPhone: ui.labTargetAccountPhone || member.phone,
              doctorId: lab.id,
              doctorName: lab.labName,
              specialty: bi('تحاليل وأشعة طبية', 'Medical Lab & Imaging'),
              visitDateLabel: formatTodayAr(),
              diagnosis: title,
              medications: '',
              notes: notes,
              attachmentDataUrl: pendingLabFile.dataUrl || '',
              attachmentMimeType: pendingLabFile.mimeType || '',
              attachmentName: pendingLabFile.fileName || '',
              recordType: 'LAB_RESULT',
              createdAtMillis: Date.now()
            });
            saveState(db);
            showToast(bi('تم إرسال نتيجة ' + title + ' إلى ملف ' + member.fullName + ' بنجاح!', 'Sent lab report to ' + member.fullName + '\'s record!'));
            pendingLabFile = { dataUrl: '', mimeType: '', fileName: '' };
            const titleEl = document.getElementById('labTestTitle');
            const notesEl = document.getElementById('labTestNotes');
            const prevEl = document.getElementById('labFilePreview');
            if (titleEl) titleEl.value = '';
            if (notesEl) notesEl.value = '';
            if (prevEl) prevEl.innerHTML = '';
          };
        }
      }

      function bindDoctorLoginEvents() {
        const submitBtn = document.getElementById('btnDocLoginSubmit');
        const idInp = document.getElementById('docLoginIdentifier');
        const passInp = document.getElementById('docLoginPassword');
        const errEl = document.getElementById('docLoginError');

        function attemptDoctorLogin() {
          const ident = (idInp.value || '').trim();
          const pass = (passInp.value || '').trim();
          const found = db.doctors.find((d) =>
            (d.username && d.username === ident) && (d.password || '1234') === pass
          );
          if (!found) {
            errEl.textContent = bi('بيانات الدخول غير صحيحة. تأكد من اسم المستخدم وكلمة المرور من الإدارة.', 'Invalid credentials. Verify username and password.');
            errEl.style.display = 'block';
            return;
          }
          ui.loggedInDoctorId = found.id;
          showToast(bi('مرحباً ' + found.doctorName, 'Welcome, ' + found.doctorName));
          renderApp();
        }

        if (submitBtn) submitBtn.onclick = attemptDoctorLogin;
        if (passInp) {
          passInp.onkeydown = function (e) {
            if (e.key === 'Enter') attemptDoctorLogin();
          };
        }
        bindPasswordToggleButtons(document);
      }

      function bindSuperAdminEvents() {
        document.querySelectorAll('[data-admin-tab]').forEach((btn) => {
          btn.onclick = function () {
            ui.adminTab = btn.getAttribute('data-admin-tab');
            renderApp();
          };
        });

        const addPrivBtn = document.getElementById('btnAdminAddPrivateDoctor');
        if (addPrivBtn) {
          addPrivBtn.onclick = function () {
            openAdminDoctorFormModal(null);
          };
        }

        const addHospBtn = document.getElementById('btnAdminAddHospitalDept');
        if (addHospBtn) {
          addHospBtn.onclick = function () {
            openAdminDoctorFormModal(null);
            const typeSel = document.getElementById('admDocType');
            if (typeSel) typeSel.value = 'HOSPITAL';
          };
        }

        const addLabBtn = document.getElementById('btnAdminAddLab');
        if (addLabBtn) {
          addLabBtn.onclick = function () {
            openAdminLabFormModal(null);
          };
        }

        document.querySelectorAll('[data-admin-edit-lab]').forEach((btn) => {
          btn.onclick = function () {
            const lab = (db.labs || []).find((l) => l.id === btn.getAttribute('data-admin-edit-lab'));
            if (lab) openAdminLabFormModal(lab);
          };
        });

        document.querySelectorAll('[data-admin-delete-lab]').forEach((btn) => {
          btn.onclick = function () {
            const lab = (db.labs || []).find((l) => l.id === btn.getAttribute('data-admin-delete-lab'));
            if (!lab) return;
            openModal(
              bi('تأكيد حذف معمل التحاليل', 'Confirm Lab Deletion'),
              '<div>' + esc(bi('هل أنت متأكد من حذف ', 'Are you sure you want to delete ')) + '<strong>' + esc(lab.labName) + '</strong>؟</div>' +
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">' +
                '<button class="btn btn-outline" id="btnCancelDeleteLab" type="button">' + esc(bi('تراجع', 'Cancel')) + '</button>' +
                '<button class="btn btn-danger-outline" id="btnConfirmDeleteLab" type="button">🗑️ ' + esc(bi('حذف نهائي', 'Delete')) + '</button>' +
              '</div>',
              function () {
                document.getElementById('btnCancelDeleteLab').onclick = closeModal;
                document.getElementById('btnConfirmDeleteLab').onclick = function () {
                  db.labs = (db.labs || []).filter((l) => l.id !== lab.id);
                  if (ui.loggedInLabId === lab.id) ui.loggedInLabId = null;
                  saveState(db);
                  closeModal();
                  showToast(bi('تم حذف معمل ' + lab.labName + ' نهائياً', 'Deleted ' + lab.labName));
                  renderApp();
                };
              }
            );
          };
        });

        const logoutBtn = document.getElementById('btnAdminLogout');
        if (logoutBtn) {
          logoutBtn.onclick = function () {
            ui.isAdminLoggedIn = false;
            ui.roleMode = 'PATIENT';
            showToast(bi('تم تأمين وإغلاق لوحة الإدارة العليا', 'Super Admin dashboard locked'));
            renderApp();
          };
        }

        const searchInp = document.getElementById('adminDoctorSearch') || document.getElementById('adminLabSearch');
        if (searchInp) {
          const activeId = searchInp.id;
          searchInp.oninput = function (e) {
            const pos = e.target.selectionStart;
            ui.adminSearchQuery = e.target.value;
            renderApp();
            const again = document.getElementById(activeId);
            if (again) {
              again.focus();
              again.setSelectionRange(pos, pos);
            }
          };
        }

        document.querySelectorAll('[data-admin-edit-doc]').forEach((btn) => {
          btn.onclick = function () {
            const doc = db.doctors.find((d) => d.id === btn.getAttribute('data-admin-edit-doc'));
            if (doc) openAdminDoctorFormModal(doc);
          };
        });

        document.querySelectorAll('[data-admin-delete-doc]').forEach((btn) => {
          btn.onclick = function () {
            const doc = db.doctors.find((d) => d.id === btn.getAttribute('data-admin-delete-doc'));
            if (!doc) return;
            openModal(bi('تأكيد حذف الدكتور من المنصة', 'Confirm Doctor Deletion'),
              '<div>' + esc(bi('هل أنت متأكد من حذف ', 'Are you sure you want to permanently delete ')) + '<strong>' + esc(doc.doctorName) + '</strong> (' + esc(doc.clinicName) + ')?</div>' +
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">' +
                '<button class="btn btn-outline" id="btnCancelDeleteDoc" type="button">' + esc(bi('تراجع', 'Cancel')) + '</button>' +
                '<button class="btn btn-danger-outline" id="btnConfirmDeleteDoc" type="button">🗑️ ' + esc(bi('حذف نهائي', 'Delete')) + '</button>' +
              '</div>',
              function () {
                document.getElementById('btnCancelDeleteDoc').onclick = closeModal;
                document.getElementById('btnConfirmDeleteDoc').onclick = function () {
                  db.doctors = db.doctors.filter((d) => d.id !== doc.id);
                  db.slots = db.slots.filter((s) => s.doctorId !== doc.id);
                  if (db.doctorFavorites) delete db.doctorFavorites[doc.id];
                  if (ui.loggedInDoctorId === doc.id) ui.loggedInDoctorId = null;
                  if (ui.bookingDoctorId === doc.id) ui.bookingDoctorId = null;
                  saveState(db);
                  closeModal();
                  showToast(bi('تم حذف ' + doc.doctorName + ' من المنصة نهائياً', 'Deleted ' + doc.doctorName));
                  renderApp();
                };
              }
            );
          };
        });

        function blockPhoneAndCancel(rawPhone, reason) {
          const digits = normalizePhoneDigits(rawPhone);
          if (digits.length < 8) {
            showToast(bi('يرجى إدخال رقم هاتف صحيح للحظر', 'Enter a valid phone number'));
            return;
          }
          if (!isPhoneBlocked(rawPhone)) {
            db.blockedPhones = (db.blockedPhones || []).concat([{
              phone: rawPhone.trim(),
              reason: (reason || '').trim() || bi('حظر إداري بسبب حجز وهمي', 'Blocked for fake booking'),
              blockedAtMillis: Date.now()
            }]);
          }
          db.slots.forEach((s) => {
            if (s.status === 'BOOKED' && normalizePhoneDigits(s.patientPhone) === digits) {
              s.status = 'AVAILABLE';
              s.patientName = '';
              s.patientPhone = '';
              s.familyMemberId = '';
              s.bookingSource = '';
            }
          });
          saveState(db);
          showToast(bi('تم حظر الرقم ' + rawPhone.trim() + ' وإلغاء حجوزاته النشطة', 'Blocked ' + rawPhone.trim()));
          renderApp();
        }

        const blockSubmitBtn = document.getElementById('btnAdminBlockPhoneSubmit');
        if (blockSubmitBtn) {
          blockSubmitBtn.onclick = function () {
            const p = document.getElementById('adminBlockPhoneInp').value;
            const r = document.getElementById('adminBlockReasonInp').value;
            blockPhoneAndCancel(p, r);
          };
        }

        document.querySelectorAll('[data-admin-quick-block]').forEach((btn) => {
          btn.onclick = function () {
            blockPhoneAndCancel(btn.getAttribute('data-admin-quick-block'), bi('حجز وهمي / مخالفة مواعيد', 'Fake booking violation'));
          };
        });

        document.querySelectorAll('[data-admin-unblock-phone]').forEach((btn) => {
          btn.onclick = function () {
            const target = normalizePhoneDigits(btn.getAttribute('data-admin-unblock-phone'));
            db.blockedPhones = (db.blockedPhones || []).filter((b) => normalizePhoneDigits(b.phone) !== target);
            saveState(db);
            showToast(bi('تم رفع الحظر عن الرقم بنجاح', 'Phone unblocked'));
            renderApp();
          };
        });

        document.querySelectorAll('[data-admin-cancel-slot]').forEach((btn) => {
          btn.onclick = function () {
            const slot = db.slots.find((s) => s.id === btn.getAttribute('data-admin-cancel-slot'));
            if (slot && slot.status === 'BOOKED') {
              slot.status = 'AVAILABLE';
              slot.patientName = '';
              slot.patientPhone = '';
              slot.familyMemberId = '';
              slot.bookingSource = '';
              saveState(db);
              showToast(bi('تم إلغاء الحجز وإعادة الموعد متاحاً', 'Booking cancelled'));
              renderApp();
            }
          };
        });

        const saveAdmCfgBtn = document.getElementById('btnAdmSaveCfg');
        if (saveAdmCfgBtn) {
          saveAdmCfgBtn.onclick = async function () {
            const newPin = document.getElementById('admSetPin').value.trim();
            if (newPin && newPin.length < 4) {
              showToast(bi('الرقم السري (PIN) يجب أن يكون 4 أرقام على الأقل', 'PIN must be at least 4 digits'));
              return;
            }
            db.config.platformNameAr = document.getElementById('admSetPlatform').value.trim() || DEFAULT_CONFIG.platformNameAr;
            db.config.villageNameAr = document.getElementById('admSetVillage').value.trim() || DEFAULT_CONFIG.villageNameAr;
            db.config.hospitalNameAr = document.getElementById('admSetHospital').value.trim() || DEFAULT_CONFIG.hospitalNameAr;
            db.config.supportPhone = document.getElementById('admSetPhone').value.trim() || DEFAULT_CONFIG.supportPhone;
            db.config.homeAnnouncementAr = document.getElementById('admSetAnnouncement').value.trim();
            db.config.apkDownloadUrl = document.getElementById('admSetApk').value.trim() || DEFAULT_CONFIG.apkDownloadUrl;
            db.config.medicationsApiUrl = document.getElementById('admSetMedsApi').value.trim();
            if (newPin.length >= 4) db.config.adminPin = newPin;
            saveState(db);
            await refreshMedicationsFromApi();
            showToast(bi('تم حفظ جميع إعدادات المنصة والـ PIN بنجاح', 'All platform settings & PIN saved'));
            renderApp();
          };
        }

        const resetAdmCfgBtn = document.getElementById('btnAdmResetCfg');
        if (resetAdmCfgBtn) {
          resetAdmCfgBtn.onclick = async function () {
            db.config = Object.assign({}, DEFAULT_CONFIG);
            saveState(db);
            await refreshMedicationsFromApi();
            showToast(bi('تمت استعادة الإعدادات الافتراضية للمنصة', 'Restored default settings'));
            renderApp();
          };
        }

        bindOtpGeneratorEvents('ADMIN');
        bindPasswordToggleButtons(document);
      }

      function bindDoctorDashboardEvents() {
        const doc = db.doctors.find((d) => d.id === ui.loggedInDoctorId);
        if (!doc) return;

        document.querySelectorAll('[data-doc-tab]').forEach((btn) => {
          btn.onclick = function () {
            ui.doctorTab = btn.getAttribute('data-doc-tab');
            renderApp();
          };
        });

        const logoutBtn = document.getElementById('btnDoctorLogout');
        if (logoutBtn) {
          logoutBtn.onclick = function () {
            ui.loggedInDoctorId = null;
            showToast(bi('تم تسجيل خروج الطبيب', 'Doctor signed out'));
            renderApp();
          };
        }

        function applyDelay(mins) {
          doc.currentDelayMinutes += mins;
          db.slots.forEach((s) => {
            if (s.doctorId === doc.id && s.status !== 'COMPLETED') s.delayMinutes += mins;
          });
          db.notifications.unshift({
            id: Date.now(),
            message: 'تنبيه عاجل: تم تأخير مواعيد ' + doc.doctorName + ' (' + doc.clinicName + ') لمدة ' + mins + ' دقيقة (الإجمالي: ' + doc.currentDelayMinutes + ' دقيقة).',
            isRead: false
          });
          saveState(db);
          showToast(bi('تم تأخير المواعيد ' + mins + ' دقيقة وإرسال تنبيه فوري للمرضى', 'Delayed slots by ' + mins + ' min'));
          renderApp();
        }

        const delay15Btn = document.getElementById('btnDelay15');
        if (delay15Btn) delay15Btn.onclick = () => applyDelay(15);
        const delay30Btn = document.getElementById('btnDelay30');
        if (delay30Btn) delay30Btn.onclick = () => applyDelay(30);
        const schedGenBtn = document.getElementById('btnOpenScheduleGen');
        if (schedGenBtn) schedGenBtn.onclick = () => openScheduleGenModal(doc);

        document.querySelectorAll('[data-manual-slot]').forEach((btn) => {
          btn.onclick = () => openManualPhoneModal(btn.getAttribute('data-manual-slot'));
        });
        document.querySelectorAll('[data-write-rx]').forEach((btn) => {
          btn.onclick = () => openSmartPrescriptionModal(btn.getAttribute('data-write-rx'));
        });
        document.querySelectorAll('[data-view-emr]').forEach((btn) => {
          btn.onclick = () => openPatientEmrModal(btn.getAttribute('data-view-emr'));
        });
        document.querySelectorAll('[data-cancel-slot]').forEach((btn) => {
          btn.onclick = function () {
            const slot = db.slots.find((s) => s.id === btn.getAttribute('data-cancel-slot'));
            if (slot && slot.status === 'BOOKED') {
              slot.status = 'AVAILABLE';
              slot.patientName = '';
              slot.patientPhone = '';
              slot.familyMemberId = '';
              slot.bookingSource = '';
              saveState(db);
              showToast(bi('تم إلغاء الحجز وعاد الموعد متاحاً باللون الأخضر', 'Booking cancelled'));
              renderApp();
            }
          };
        });

        bindOtpGeneratorEvents(doc.doctorName);
      }

      // Top Header & Nav Global Listeners
      const langDropdownWrap = document.getElementById('langDropdownWrap');
      const langDropdownMenu = document.getElementById('langDropdownMenu');
      const langToggleBtn = document.getElementById('btnLangToggle');
      function closeLangDropdown() {
        if (langDropdownMenu) langDropdownMenu.classList.remove('open');
        if (langToggleBtn) langToggleBtn.setAttribute('aria-expanded', 'false');
      }
      document.getElementById('btnSmartRefresh').onclick = performSmartHardRefresh;
      langToggleBtn.onclick = function (e) {
        e.stopPropagation();
        const isOpen = langDropdownMenu.classList.toggle('open');
        langToggleBtn.setAttribute('aria-expanded', String(isOpen));
      };
      document.querySelectorAll('[data-set-lang]').forEach(function (item) {
        item.onclick = function (e) {
          e.stopPropagation();
          ui.lang = item.getAttribute('data-set-lang') === 'en' ? 'en' : 'ar';
          try { localStorage.setItem(LANG_KEY, ui.lang); } catch (err) {}
          closeLangDropdown();
          renderApp();
        };
      });
      document.addEventListener('click', function (e) {
        if (langDropdownWrap && !langDropdownWrap.contains(e.target)) {
          closeLangDropdown();
        }
      });
      document.getElementById('rolePatientBtn').onclick = function () {
        ui.roleMode = 'PATIENT';
        renderApp();
      };
      document.getElementById('roleDoctorBtn').onclick = function () {
        ui.roleMode = 'DOCTOR';
        renderApp();
      };
      document.getElementById('btnNotifications').onclick = openNotificationsModal;
      document.getElementById('btnAccount').onclick = function () { openAccountModal(); };

      document.getElementById('bottomNav').querySelectorAll('.nav-item').forEach((btn) => {
        btn.onclick = function () {
          ui.bookingDoctorId = null;
          ui.patientTab = btn.getAttribute('data-tab');
          if (ui.patientTab === 'SPECIALTIES') ui.selectedSpecialty = null;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      });

      // Smooth Escape Key Modal & Dropdown Closing
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeLangDropdown();
          const modalRoot = document.getElementById('modalRoot');
          if (modalRoot && modalRoot.innerHTML.trim() !== '') {
            closeModal();
          }
        }
      });

      // Instant Cross-Tab Real-Time Sync via LocalStorage events
      window.addEventListener('storage', function (e) {
        if (e.key === STORAGE_KEY) {
          db = loadState();
          renderApp();
        }
      });

      // 30-Second Background Auto-Refresh for Appointment Slots (non-disruptive)
      setInterval(function () {
        const modalRoot = document.getElementById('modalRoot');
        const hasOpenModal = modalRoot && modalRoot.innerHTML.trim() !== '';
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        const isTyping = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT';
        if (hasOpenModal || isTyping) return;
        const latestDb = loadState();
        if (JSON.stringify(latestDb.slots) !== JSON.stringify(db.slots) ||
            JSON.stringify(latestDb.doctors) !== JSON.stringify(db.doctors)) {
          db = latestDb;
          renderApp();
        }
      }, 30000);

      // Clear any stale legacy SW caches automatically while preserving clean v1.0.0 cache
      if ('caches' in window && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) {
            if (k !== 'teb-alhajayzah-v1.0.0-clean') {
              caches.delete(k).catch(function () {});
            }
          });
        }).catch(function () {});
      }

      // Service Worker Registration for PWA Installability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').then(function (reg) {
            if (reg && reg.update) reg.update();
          }).catch(function () {});
        });
      }

      // Initialize App with brief spinner while loading medications catalog
      setGlobalLoading(true, bi('جاري تجهيز منصة طب الحجايزة...', 'Loading Teb Al-Hajayzah...'));
      renderApp();
      refreshMedicationsFromApi().finally(function () {
        setGlobalLoading(false);
        renderApp();
      });
    })();
  </script>
</body>
</html>
