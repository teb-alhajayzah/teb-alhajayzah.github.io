            const passVal = (document.getElementById('smsGatePassword').value || '').trim();

            ui.smsTestPhone = phoneVal;
            db.config.smsGateServerUrl = urlVal;
            db.config.smsGateUsername = userVal;
            db.config.smsGatePassword = passVal;
            db.config.smsGateProxyUrl = proxyVal;
            saveState(db);

            if (!phoneVal || normalizePhoneDigits(phoneVal).length < 10) {
              ui.smsTestStatus = {
                busy: false,
                ok: false,
                msg: bi('يرجى كتابة رقم هاتف تجربة صحيح (11 رقم) أولاً.', 'Please enter a valid 11-digit test phone number.')

            renderApp();

            const res = await SmsGateService.sendSms({
              serverUrl: urlVal,
              proxyUrl: proxyVal,
              username: userVal,
              password: passVal,
              phone: phoneVal,
              messageText: 'منصة ' + (db.config.platformNameAr || 'طب الحجايزة') + ': كود التفعيل الخاص بك هو: 123456',
              timeoutMs: 25000
            });

            if (res.ok) {
              ui.smsTestStatus = {
                busy: false,
                ok: true,
                corsBlocked: false,
                msg: bi('✓ تم إرسال الرسالة التجريبية (كود التفعيل: 123456) بنجاح إلى ' + res.phone, '✓ Test SMS (OTP 123456) sent successfully to ' + res.phone)
              };
              showToast(bi('تم إرسال الرسالة التجريبية (123456) بنجاح!', 'Test SMS sent!'));
            } else {
              ui.smsTestStatus = {
                busy: false,
                ok: false,
                corsBlocked: Boolean(res.corsBlocked),
                msg: res.error || bi('تعذر إرسال الرسالة التجريبية', 'Test SMS failed')
              };
              showToast(ui.smsTestStatus.msg);
            }
            renderApp();
          };
        }

        bindPasswordToggleButtons(document);

      function bindDoctorDashboardEvents() {
        const doc = db.doctors.find((d) => d.id === ui.loggedInDoctorId);
        if (!doc) return;

        document.querySelectorAll('[data-doc-tab]').forEach((btn) => {
          btn.onclick = function () {
            ui.doctorTab = btn.getAttribute('data-doc-tab');
            renderApp();
          };
        });

        const logoutBtn = document.getElementById('btnDoctorLogout');
        if (logoutBtn) {
          logoutBtn.onclick = function () {
            ui.loggedInDoctorId = null;
            showToast(bi('تم تسجيل خروج الطبيب', 'Doctor signed out'));
            renderApp();
          };
        }

        function applyDelay(mins) {
          doc.currentDelayMinutes += mins;
          db.slots.forEach((s) => {
            if (s.doctorId === doc.id && s.status !== 'COMPLETED') s.delayMinutes += mins;
          });
          db.notifications.unshift({
            id: Date.now(),
            message: 'تنبيه عاجل: تم تأخير مواعيد ' + doc.doctorName + ' (' + doc.clinicName + ') لمدة ' + mins + ' دقيقة (الإجمالي: ' + doc.currentDelayMinutes + ' دقيقة).',
            isRead: false
          });
          saveState(db);
          showToast(bi('تم تأخير المواعيد ' + mins + ' دقيقة وإرسال تنبيه فوري للمرضى', 'Delayed slots by ' + mins + ' min'));
          renderApp();
        }

        const delay15Btn = document.getElementById('btnDelay15');
        if (delay15Btn) delay15Btn.onclick = () => applyDelay(15);
        const delay30Btn = document.getElementById('btnDelay30');
        if (delay30Btn) delay30Btn.onclick = () => applyDelay(30);
        const schedGenBtn = document.getElementById('btnOpenScheduleGen');
        if (schedGenBtn) schedGenBtn.onclick = () => openScheduleGenModal(doc);

        document.querySelectorAll('[data-manual-slot]').forEach((btn) => {
          btn.onclick = () => openManualPhoneModal(btn.getAttribute('data-manual-slot'));
        });
        document.querySelectorAll('[data-write-rx]').forEach((btn) => {
          btn.onclick = () => openSmartPrescriptionModal(btn.getAttribute('data-write-rx'));
        });
        document.querySelectorAll('[data-view-emr]').forEach((btn) => {
          btn.onclick = () => openPatientEmrModal(btn.getAttribute('data-view-emr'));
        });
        document.querySelectorAll('[data-cancel-slot]').forEach((btn) => {
          btn.onclick = function () {
            const slot = db.slots.find((s) => s.id === btn.getAttribute('data-cancel-slot'));
            if (slot && slot.status === 'BOOKED') {
              slot.status = 'AVAILABLE';
              slot.patientName = '';
              slot.patientPhone = '';
              slot.familyMemberId = '';
              slot.bookingSource = '';
              saveState(db);
              showToast(bi('تم إلغاء الحجز وعاد الموعد متاحاً باللون الأخضر', 'Booking cancelled'));
              renderApp();
            }
          };
        });

        bindOtpGeneratorEvents(doc.doctorName);
      }

      // Top Header & Nav Global Listeners
      const langDropdownWrap = document.getElementById('langDropdownWrap');
      const langDropdownMenu = document.getElementById('langDropdownMenu');
      const langToggleBtn = document.getElementById('btnLangToggle');
      function closeLangDropdown() {
        if (langDropdownMenu) langDropdownMenu.classList.remove('open');
        if (langToggleBtn) langToggleBtn.setAttribute('aria-expanded', 'false');
      }
      document.getElementById('btnSmartRefresh').onclick = performSmartHardRefresh;
      langToggleBtn.onclick = function (e) {
        e.stopPropagation();
        const isOpen = langDropdownMenu.classList.toggle('open');
        langToggleBtn.setAttribute('aria-expanded', String(isOpen));
      };
      document.querySelectorAll('[data-set-lang]').forEach(function (item) {
        item.onclick = function (e) {
          e.stopPropagation();
          ui.lang = item.getAttribute('data-set-lang') === 'en' ? 'en' : 'ar';
          try { localStorage.setItem(LANG_KEY, ui.lang); } catch (err) {}
          closeLangDropdown();
          renderApp();
        };
      });
      document.addEventListener('click', function (e) {
        if (langDropdownWrap && !langDropdownWrap.contains(e.target)) {
          closeLangDropdown();
        }
      });
      document.getElementById('rolePatientBtn').onclick = function () {
        ui.roleMode = 'PATIENT';
        renderApp();
      };
      document.getElementById('roleDoctorBtn').onclick = function () {
        ui.roleMode = 'DOCTOR';
        renderApp();
      };
      document.getElementById('btnNotifications').onclick = openNotificationsModal;
      document.getElementById('btnAccount').onclick = function () { openAccountModal(); };

      document.getElementById('bottomNav').querySelectorAll('.nav-item').forEach((btn) => {
        btn.onclick = function () {
          ui.bookingDoctorId = null;
          ui.patientTab = btn.getAttribute('data-tab');
          if (ui.patientTab === 'SPECIALTIES') ui.selectedSpecialty = null;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      });

      // Smooth Escape Key Modal & Dropdown Closing
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeLangDropdown();
          const modalRoot = document.getElementById('modalRoot');
          if (modalRoot && modalRoot.innerHTML.trim() !== '') {
            closeModal();
          }
        }
      });

      // Instant Cross-Tab Real-Time Sync via LocalStorage events
      window.addEventListener('storage', function (e) {
        if (e.key === STORAGE_KEY) {
          db = loadState();
          renderApp();
        }
      });

      // 30-Second Background Auto-Refresh for Appointment Slots (non-disruptive)
      setInterval(function () {
        const modalRoot = document.getElementById('modalRoot');
        const hasOpenModal = modalRoot && modalRoot.innerHTML.trim() !== '';
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        const isTyping = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT';
        if (hasOpenModal || isTyping) return;
        const latestDb = loadState();
        if (JSON.stringify(latestDb.slots) !== JSON.stringify(db.slots) ||
            JSON.stringify(latestDb.doctors) !== JSON.stringify(db.doctors)) {
          db = latestDb;
          renderApp();
        }
      }, 30000);

      // Service Worker Registration for PWA Installability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').then(function (reg) {
            if (reg && reg.update) reg.update();
          }).catch(function () {});
        });
      }

      // Initialize App with brief spinner while loading medications catalog
      setGlobalLoading(true, bi('جاري تجهيز منصة طب الحجايزة...', 'Loading Teb Al-Hajayzah...'));
      renderApp();
      refreshMedicationsFromApi().finally(function () {
        setGlobalLoading(false);
        renderApp();
      });
    })();
  </script>
</body>
</html>
